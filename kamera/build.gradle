plugins { id 'com.android.application' }
android {
    namespace 'com.bilal.kamera'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bilal.kamera'
        minSdk 29
        targetSdk 35
        versionCode 4
        versionName '4.0'
    }
    // Güncellemelerin eskisinin üzerine kurulması için hep aynı anahtar kullanılmalı.
    signingConfigs {
        debug {
            storeFile file('keystore/kamera.keystore')
            storePassword 'android'
            keyAlias 'kamera'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
def camerax = '1.5.3'
dependencies {
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-video:$camerax"
    implementation "androidx.camera:camera-view:$camerax"
    implementation "androidx.camera:camera-extensions:$camerax"
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.exifinterface:exifinterface:1.3.7'
    implementation 'com.google.zxing:core:3.5.3'
}
