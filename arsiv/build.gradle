plugins { id 'com.android.application' }
android {
    namespace 'com.bilal.arsivim'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bilal.arsivim'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0'
    }
    // Arşivim'in kendi imza anahtarı. Değişirse güncelleme kurulmaz → anahtarı asla değiştirme.
    signingConfigs {
        debug {
            storeFile file('keystore/arsivim.keystore')
            storePassword 'android'
            keyAlias 'arsivim'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
