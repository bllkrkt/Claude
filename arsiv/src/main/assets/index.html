<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; font-src 'self'; connect-src 'self' blob:; frame-src 'self' blob: data:; object-src 'none'">
<title>Arşivim</title>
<style>
@font-face{font-family:Jakarta;font-weight:400 800;font-display:swap;src:url(fonts/jakarta-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:Jakarta;font-weight:400 800;font-display:swap;src:url(fonts/jakarta-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{
  --bg:#0b0c12;--surface:#14161f;--surface-2:#1b1e29;--surface-3:#252938;--line:rgba(255,255,255,.07);--line-2:rgba(255,255,255,.13);
  --text:#f4f5f9;--muted:#9299aa;--faint:#5e6475;
  --accent:#7c6cff;--accent-soft:rgba(124,108,255,.16);--accent-text:#a99fff;
  --grad:linear-gradient(135deg,#3d9bff 0%,#7c6cff 50%,#d24dff 100%);
  --ok:#3ddc97;--ok-soft:rgba(61,220,151,.13);--warn:#ffc35a;--warn-soft:rgba(255,195,90,.12);--bad:#ff6b81;--bad-soft:rgba(255,107,129,.13);
  --me:linear-gradient(135deg,#4f8bff,#8b5cff);--them:#232735;
  --shadow:0 10px 30px rgba(0,0,0,.4);--shadow-sm:0 2px 10px rgba(0,0,0,.25);--r:22px;color-scheme:dark;
}
:root[data-theme=light]{
  --bg:#f3f4f8;--surface:#fff;--surface-2:#eff0f5;--surface-3:#e2e4ec;--line:rgba(17,20,28,.07);--line-2:rgba(17,20,28,.13);
  --text:#12141b;--muted:#666d7d;--faint:#a0a6b3;
  --accent:#5b4ae8;--accent-soft:rgba(91,74,232,.1);--accent-text:#4f3fd6;
  --ok:#0f9d64;--ok-soft:rgba(15,157,100,.1);--warn:#9a6300;--warn-soft:rgba(240,170,40,.16);--bad:#d63852;--bad-soft:rgba(214,56,82,.09);
  --them:#e9eaf1;--shadow:0 10px 30px rgba(20,24,40,.09);--shadow-sm:0 2px 8px rgba(20,24,40,.06);color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);overscroll-behavior-y:none}
body{font-family:Jakarta,"Segoe UI",Roboto,system-ui,sans-serif;font-size:15px;line-height:1.45;min-width:300px;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
svg{flex-shrink:0}
.wrap{max-width:680px;margin:0 auto;padding:10px 16px calc(96px + env(safe-area-inset-bottom))}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:13px}.tiny{font-size:12px}.b{font-weight:800}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.center{text-align:center}.wrapline{flex-wrap:wrap}
.mt4{margin-top:4px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.hidden{display:none!important}
.ell{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
h1,h2,h3{margin:0;letter-spacing:-.02em}
h2{font-size:18px;font-weight:800}h3{font-size:15px;font-weight:800}
.sec{font-size:12px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:24px 4px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.sec button{text-transform:none;letter-spacing:0;color:var(--accent-text);font-weight:800;font-size:13px}

/* üst çubuk */
.top{position:sticky;top:0;z-index:20;background:var(--bg);margin:0 -16px;padding:8px 12px 10px;display:flex;align-items:center;gap:6px}
.top .t{flex:1;min-width:0}
.top .t h1{font-size:20px;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .t .s{font-size:12px;color:var(--muted);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top.home h1{font-size:26px;letter-spacing:-.03em}
.ib{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;color:var(--text);flex-shrink:0}
.ib:active{background:var(--surface-2)}
.ib.on{background:var(--accent-soft);color:var(--accent-text)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-sm)}
.hero{position:relative;overflow:hidden;padding:18px}
.hero::before{content:"";position:absolute;right:-80px;top:-100px;width:280px;height:280px;background:radial-gradient(closest-side,rgba(124,108,255,.28),transparent);pointer-events:none}
.hero::after{content:"";position:absolute;left:-90px;bottom:-120px;width:260px;height:260px;background:radial-gradient(closest-side,rgba(61,155,255,.18),transparent);pointer-events:none}
.hero>*{position:relative}
.pf{display:flex;align-items:center;gap:14px}
.pf .pic{width:74px;height:74px;border-radius:50%;padding:3px;background:var(--grad);flex-shrink:0}
.pf .pic>*{width:100%;height:100%;border-radius:50%;object-fit:cover;display:grid;place-items:center;background:var(--surface-3);font-size:28px;font-weight:800;color:#fff;border:3px solid var(--surface)}
.pf .nm{font-size:20px;font-weight:800;letter-spacing:-.02em;line-height:1.2;word-break:break-word}
.pf .un{color:var(--accent-text);font-weight:800;font-size:14px}
.bio{margin-top:12px;font-size:13px;color:var(--muted);white-space:pre-wrap;word-break:break-word}
.pills{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.pill{display:inline-flex;align-items:center;gap:5px;border-radius:99px;padding:5px 10px;font-size:12px;font-weight:800;background:var(--surface-2);color:var(--muted)}
.pill.acc{background:var(--accent-soft);color:var(--accent-text)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:16px;font-weight:800;background:var(--surface-2);border:1px solid var(--line);transition:transform .1s}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--grad);border:0;color:#fff;box-shadow:0 8px 22px rgba(124,108,255,.3)}
.btn.danger{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
.btn.block{width:100%}.btn.lg{min-height:56px;font-size:16px;border-radius:18px}
.btn.sm{min-height:38px;padding:0 13px;border-radius:12px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:2px;min-height:96px;position:relative;overflow:hidden}
.tile:active{transform:scale(.98)}
.tile .e{font-size:22px;line-height:1}
.tile .v{font-size:24px;font-weight:800;letter-spacing:-.02em;margin-top:8px;font-variant-numeric:tabular-nums;line-height:1.1}
.tile .k{font-size:12px;color:var(--muted);font-weight:700}
.tile.big{grid-column:span 2;flex-direction:row;align-items:center;gap:14px;min-height:80px}
.tile.big .e{font-size:30px;width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:var(--accent-soft)}

.group{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{display:flex;align-items:center;gap:13px;padding:12px 14px;border-top:1px solid var(--line);min-height:62px;width:100%;text-align:left}
.item:first-child{border-top:0}
button.item:active,a.item:active,.item.tap:active{background:var(--surface-2)}
.item .ic{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;flex-shrink:0;font-size:20px;background:var(--surface-2)}
.item .tt{font-weight:800;line-height:1.25}
.item .st{font-size:12px;color:var(--muted);margin-top:2px}
.item .cnt{font-weight:800;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.item .chev{color:var(--faint)}
.item.sel{background:var(--accent-soft)}

.search{display:flex;align-items:center;gap:10px;height:48px;border-radius:16px;background:var(--surface);border:1px solid var(--line);padding:0 14px;color:var(--muted)}
.search input{flex:1;background:transparent;border:0;outline:0;min-width:0;height:100%;color:var(--text)}
.search .clr{color:var(--faint)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:10px 16px 2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;padding:8px 13px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.chip.on{background:var(--text);color:var(--bg);border-color:transparent}
.chip .n{opacity:.65;margin-left:5px}
.tools{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:10px 2px 0;font-size:13px}
.tools button{display:inline-flex;align-items:center;gap:6px;font-weight:800;color:var(--muted);padding:6px 4px}

.avatar{border-radius:50%;display:grid;place-items:center;font-weight:800;color:#fff;flex-shrink:0;text-shadow:0 1px 2px rgba(0,0,0,.15);width:44px;height:44px;font-size:17px;overflow:hidden}
.avatar.sm{width:34px;height:34px;font-size:14px}
.avatar img{width:100%;height:100%;object-fit:cover}

/* kayıt kartları */
.rec{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:13px 14px;margin-top:8px}
.rec .h{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.rec .h b{font-weight:800;word-break:break-word;min-width:0}
.rec .h .d{font-size:12px;color:var(--faint);white-space:nowrap;font-weight:700}
.kvr{display:flex;gap:10px;font-size:13px;margin-top:5px;line-height:1.4}
.kvr .k{color:var(--muted);flex-shrink:0;max-width:42%;font-weight:700}
.kvr .v{min-width:0;overflow-wrap:anywhere;word-break:break-word}
.kvr a,.lnk{color:var(--accent-text);font-weight:700}
.mrow{display:flex;gap:6px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.mrow .th{width:72px;height:72px;border-radius:12px;flex-shrink:0}
.more{display:block;margin:14px auto 0}

/* medya ızgarası */
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;border-radius:16px;overflow:hidden}
.th{position:relative;aspect-ratio:1;background:var(--surface-2);overflow:hidden;display:block;width:100%}
.th img,.th video{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;background:var(--surface-2)}
.th .badge{position:absolute;right:5px;top:5px;background:rgba(0,0,0,.55);color:#fff;border-radius:8px;padding:2px 5px;font-size:10px;font-weight:800;display:flex;align-items:center;gap:3px}
.th .ph{position:absolute;inset:0;display:grid;place-items:center;color:var(--faint);font-size:22px}
.th.missing img,.th.missing video{opacity:0}
.mhead{font-weight:800;font-size:13px;color:var(--muted);margin:18px 4px 8px;display:flex;justify-content:space-between}

/* mesajlar */
.chat{display:flex;flex-direction:column;gap:2px;padding-bottom:8px}
.day{align-self:center;margin:14px 0 8px;font-size:12px;font-weight:800;color:var(--muted);background:var(--surface);border:1px solid var(--line);padding:4px 12px;border-radius:99px}
.who{font-size:12px;font-weight:800;color:var(--accent-text);margin:8px 0 2px 10px}
.bub{max-width:80%;padding:8px 12px 6px;border-radius:20px;background:var(--them);word-break:break-word;overflow-wrap:anywhere;align-self:flex-start;position:relative;margin-top:2px}
.bub.me{align-self:flex-end;background:var(--me);color:#fff}
.bub .tm{font-size:10px;opacity:.6;font-weight:700;text-align:right;margin-top:2px}
.bub.media{padding:4px;background:transparent}
.bub.media.me{background:transparent}
.bub .mg{display:grid;grid-template-columns:repeat(2,1fr);gap:3px;border-radius:16px;overflow:hidden;width:min(210px,56vw)}
.bub .mg.one{grid-template-columns:1fr}
.bub .mg .th{border-radius:0}
.bub audio{width:min(260px,64vw);height:40px;display:block}
.bub .share{display:block;margin-top:4px;padding:8px 10px;border-radius:12px;background:rgba(0,0,0,.18);font-size:13px}
.bub .share b{display:block;font-size:12px;opacity:.8}
.bub .sys{font-style:italic;opacity:.8}
.bub.hl{outline:3px solid var(--warn);outline-offset:2px}
.react{font-size:13px;margin:-6px 8px 4px;align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:99px;padding:1px 7px;position:relative;z-index:1}
.react.me{align-self:flex-end}
.call{align-self:center;font-size:12px;color:var(--muted);font-weight:700;margin:6px 0;background:var(--surface-2);padding:5px 12px;border-radius:99px}
mark{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 2px}
.bub.me mark{background:rgba(255,255,255,.3);color:#fff}

/* grafikler */
.bars{display:flex;align-items:flex-end;height:130px;gap:4px;margin-top:14px}
.bars .c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:5px;min-width:0}
.bars .bw{flex:1;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bars .b{width:100%;max-width:34px;border-radius:7px 7px 3px 3px;background:var(--grad);min-height:3px}
.bars .b.z{background:var(--surface-3)}
.bars .n{font-size:10px;font-weight:800;height:13px;white-space:nowrap}
.bars .d{font-size:10px;color:var(--muted);font-weight:700;white-space:nowrap;height:13px}
.hbar{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);width:100%;text-align:left}
.hbar:first-child{border-top:0}
.hbar .nm{width:38%;font-weight:800;font-size:13px}
.hbar .tr{flex:1;height:10px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.hbar .tr i{display:block;height:100%;border-radius:99px;background:var(--grad)}
.hbar .vv{font-size:12px;font-weight:800;color:var(--muted);min-width:46px;text-align:right;font-variant-numeric:tabular-nums}
.heat{display:grid;grid-template-columns:repeat(24,1fr);gap:2px;margin-top:12px}
.heat i{aspect-ratio:1;border-radius:3px;background:var(--accent)}
.emo{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.emo span{background:var(--surface-2);border-radius:14px;padding:6px 10px;font-size:20px;display:inline-flex;align-items:center;gap:6px}
.emo small{font-size:12px;font-weight:800;color:var(--muted)}
.stat2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat2 .card{padding:14px}
.stat2 .k{font-size:12px;color:var(--muted);font-weight:700}
.stat2 .v{font-size:22px;font-weight:800;letter-spacing:-.02em;margin-top:2px;font-variant-numeric:tabular-nums}
.seg{display:flex;background:var(--surface-2);border-radius:14px;padding:4px;gap:4px}
.seg button{flex:1;padding:8px 6px;border-radius:10px;font-size:13px;font-weight:800;color:var(--muted);white-space:nowrap}
.seg button.on{background:var(--surface-3);color:var(--text)}
:root[data-theme=light] .seg button.on{background:var(--surface);box-shadow:var(--shadow-sm)}

/* dosyalar */
.crumbs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;margin:8px -16px 0;padding:0 16px;font-size:13px;font-weight:800;color:var(--muted)}
.crumbs::-webkit-scrollbar{display:none}
.crumbs button{white-space:nowrap;padding:6px 8px;border-radius:10px;background:var(--surface)}
.crumbs button:last-child{color:var(--text);background:var(--accent-soft)}
pre.code{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;font:12px/1.5 ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;word-break:break-word;overflow:auto;max-height:70vh;user-select:text}
.jt{font:12.5px/1.6 ui-monospace,Menlo,Consolas,monospace;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;overflow-x:auto;user-select:text}
.jt details{padding-left:14px}
.jt summary{margin-left:-14px;cursor:pointer;color:var(--muted);list-style:none}
.jt summary::before{content:"▸ ";color:var(--faint)}
.jt details[open]>summary::before{content:"▾ "}
.jt .jk{color:var(--accent-text)}.jt .js{color:var(--ok)}.jt .jn{color:var(--warn)}.jt .jb{color:#ff8fb1}
.jt .jl{padding-left:14px;word-break:break-word}
.prev{border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;min-height:120px}
.prev img,.prev video{max-width:100%;max-height:70vh;display:block}
.prev audio{width:100%;margin:16px}
iframe.html{width:100%;height:70vh;border:1px solid var(--line);border-radius:16px;background:#fff}

/* alt menü */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.nav .in{display:flex;max-width:680px;width:100%}
.nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:11px;font-weight:800;color:var(--faint);position:relative}
.nav button.on{color:var(--text)}
.nav button.on svg{color:var(--accent-text)}
.nav .dot{position:absolute;top:3px;left:calc(50% + 8px);min-width:8px;height:8px;border-radius:99px;background:var(--accent)}

/* görüntüleyici */
.viewer{position:fixed;inset:0;z-index:60;background:#000;display:flex;flex-direction:column;color:#fff;touch-action:pan-y}
.viewer .vb{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:linear-gradient(rgba(0,0,0,.6),transparent);position:absolute;left:0;right:0;top:0;z-index:2}
.viewer .vb .ib{color:#fff}
.viewer .vb .t{flex:1;min-width:0;font-weight:800;font-size:14px}
.viewer .vb .t small{display:block;font-weight:600;opacity:.7;font-size:12px}
.viewer .vs{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;position:relative}
.viewer .vs img,.viewer .vs video{max-width:100%;max-height:100%;object-fit:contain}
.viewer .vf{position:absolute;left:0;right:0;bottom:0;padding:24px 16px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.75));font-size:14px;max-height:40vh;overflow:auto;white-space:pre-wrap;word-break:break-word}
.viewer .nx{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;display:grid;place-items:center;color:#fff;opacity:.7;z-index:2}
.viewer .nx.l{left:0}.viewer .nx.r{right:0}
.viewer .miss{opacity:.7;text-align:center;padding:30px}

/* alt pencere */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:680px;margin:0 auto;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .25s cubic-bezier(.2,.8,.2,1);max-height:86vh;overflow:auto;box-shadow:var(--shadow)}
.sheet.show{transform:none}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line-2);margin:0 auto 14px}
.sheet h2{margin-bottom:6px}
.toast{position:fixed;left:50%;bottom:calc(94px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:800;font-size:13px;z-index:70;opacity:0;pointer-events:none;transition:.2s;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

.banner{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:12px 14px;font-size:13px;font-weight:600;margin-top:12px;background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--accent-soft);color:var(--accent-text)}
.prog{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;margin-top:8px}
.prog i{display:block;height:100%;background:var(--grad);transition:width .2s}
.busy{display:flex;align-items:center;gap:10px;font-size:13px;font-weight:700;color:var(--muted)}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--surface-3);border-top-color:var(--accent);animation:sp 0.8s linear infinite;flex-shrink:0}
@keyframes sp{to{transform:rotate(360deg)}}
.empty{text-align:center;color:var(--muted);padding:40px 20px;font-weight:600}
.empty .e{font-size:44px;margin-bottom:10px}
.steps{counter-reset:s;list-style:none;padding:0;margin:12px 0 0}
.steps li{counter-increment:s;position:relative;padding:0 0 12px 38px;font-size:14px}
.steps li::before{content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:9px;background:var(--accent-soft);color:var(--accent-text);font-weight:800;display:grid;place-items:center;font-size:13px}
.steps b{font-weight:800}
.onb{text-align:center;padding:26px 6px 6px}
.onb .logo{width:96px;height:96px;border-radius:30px;background:var(--grad);margin:0 auto 18px;display:grid;place-items:center;box-shadow:0 18px 40px rgba(124,108,255,.35)}
.onb h1{font-size:28px;font-weight:800;letter-spacing:-.03em}
.onb p{color:var(--muted);margin:10px auto 0;max-width:420px}
.feat{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:20px;text-align:left}
.feat div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:12px;font-size:13px;font-weight:700}
.feat div span{display:block;font-size:20px;margin-bottom:4px}
.switch{width:50px;height:30px;border-radius:99px;background:var(--surface-3);position:relative;flex-shrink:0;transition:.2s}
.switch::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.switch.on{background:var(--accent)}
.switch.on::after{left:23px}

/* kilit */
.lock{position:fixed;inset:0;z-index:90;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px}
.dots{display:flex;gap:14px;margin:22px 0 30px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--line-2)}
.dots i.f{background:var(--accent);border-color:var(--accent)}
.dots.err{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.keys{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.keys button{height:76px;border-radius:50%;background:var(--surface);border:1px solid var(--line);font-size:26px;font-weight:700}
.keys button:active{background:var(--surface-3)}
.keys button.nb{background:none;border:0;font-size:14px;color:var(--muted)}
</style>
</head>

<script>
"use strict";
/* ================= TEMEL ================= */

}
function dayKey(ts) { const d = new Date(ts * 1000); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function fSize(b) {

const COLORS = [["#ff6a3d", "#ff3d7f"], ["#7c6cff", "#3d9bff"], ["#3ddc97", "#1e9bd7"], ["#ffb13d", "#ff6a3d"], ["#d24dff", "#7c6cff"], ["#ff3d7f", "#d24dff"], ["#1ec8c8", "#3d6bff"], ["#8bc34a", "#20a060"]];
function hash(s) { let h = 0; for (let i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) | 0; return Math.abs(h); }
function initial(s) { const m = String(s || "?").replace(/^[@_.\s]+/, "").match(/\p{L}|\p{N}/u); return m ? m[0].toLocaleUpperCase("tr") : "?"; }
function avatar(name, cls = "") { const c = COLORS[hash(String(name)) % COLORS.length]; return `<div class="avatar ${cls}" style="background:linear-gradient(135deg,${c[0]},${c[1]})">${esc(initial(name))}</div>`; }
const EXT = n => (String(n).toLowerCase().match(/\.([a-z0-9]+)$/) || [])[1] || "";
function kindOf(path) {

const MIME = {jpg: "image/jpeg", jpeg: "image/jpeg", png: "image/png", webp: "image/webp", gif: "image/gif", heic: "image/heic", mp4: "video/mp4", mov: "video/quicktime", webm: "video/webm", m4a: "audio/mp4", aac: "audio/aac", mp3: "audio/mpeg", ogg: "audio/ogg", opus: "audio/ogg", wav: "audio/wav", json: "application/json", html: "text/html", htm: "text/html", txt: "text/plain", csv: "text/plain"};

const ICON = {
  home: '<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',

  image: '<rect x="3" y="3" width="18" height="18" rx="4"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/>',
  search: '<circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/>',
  folder: '<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>',
  gear: '<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
  back: '<path d="M15 18l-6-6 6-6"/>', chev: '<path d="m9 18 6-6-6-6"/>', x: '<path d="M18 6 6 18M6 6l12 12"/>',
  down: '<path d="M12 3v12m0 0-5-5m5 5 5-5M5 21h14"/>',
  share: '<circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/>',
  play: '<path d="M8 5v14l11-7z" fill="currentColor"/>', cal: '<rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/>',
  chart: '<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', lock: '<rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', trash: '<path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14"/>', sort: '<path d="M7 4v16M3 16l4 4 4-4M17 20V4M13 8l4-4 4 4"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 16v-5M12 8h.01"/>', up: '<path d="M12 19V5M5 12l7-7 7 7"/>', list: '<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
  ext: '<path d="M14 4h6v6M20 4l-9 9M19 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h5"/>'
};
const ic = (n, s = 22) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;

/* ================= AYARLAR ================= */
const KEY = "arsivim-v1";
let S = {theme: "dark", pin: null, lastTab: "home"};
try { Object.assign(S, JSON.parse(localStorage.getItem(KEY) || "{}")); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} }
function applyTheme() {
  const dark = S.theme === "dark" || (S.theme === "auto" && matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  try { B && B.setBars && B.setBars(dark ? "#0b0c12" : "#f3f4f8", !dark); } catch (e) {}
}
applyTheme();
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", () => S.theme === "auto" && applyTheme());

/* ================= UI YARDIMCILARI ================= */
let ACT = new Map(), actN = 0;
const A = fn => { const id = "a" + (++actN); ACT.set(id, fn); return id; };
document.addEventListener("click", e => {
  const el = e.target.closest("[data-a]");
  if (!el) return;
  const f = ACT.get(el.dataset.a);
  if (f) { e.preventDefault(); f(el, e); }
});
let toastT;
function toast(m, ms = 2400) { const t = $("#toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("show"), ms); }
function sheet(html, onOpen) {
  const s = $("#sheet");
  s.innerHTML = '<div class="grab"></div>' + html;
  s.classList.add("show"); $("#scrim").classList.add("show");
  s.scrollTop = 0;
  onOpen && onOpen(s);
}
function closeSheet() { $("#sheet").classList.remove("show"); $("#scrim").classList.remove("show"); }
const sheetOpen = () => $("#sheet").classList.contains("show");
$("#scrim").onclick = closeSheet;
function downloadBlobUrl(url, name) { const a = document.createElement("a"); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function saveText(name, text, mime = "text/plain") {
  if (B && B.saveText) { const p = B.saveText(name, text, mime); toast(p ? p + " kaydedildi" : "Kaydedilemedi"); return; }
  downloadBlobUrl(URL.createObjectURL(new Blob([text], {type: mime + ";charset=utf-8"})), name);
}
async function saveEntry(e) {
  if (!e) return;
  const name = e.base;

}

/* ================= ARŞİV (ZIP) KATMANI ================= */
const UTF = new TextDecoder("utf-8", {fatal: true});
// Instagram, Türkçe karakterleri bozuk kodlar ("ÅŸ" gibi): baytları yeniden UTF-8 olarak çöz

  if (typeof s !== "string" || !/[\u0080-ÿ]/.test(s) || /[^\u0000-ÿ]/.test(s)) return s;

}
const parseJSON = t => JSON.parse(t, (k, v) => typeof v === "string" ? fixStr(v) : v);

const ROOTS = new Set(["your_instagram_activity", "connections", "personal_information", "security_and_login_information", "logged_information", "ads_information", "preferences", "media", "apps_and_websites_off_of_instagram", "messages", "content", "followers_and_following", "comments", "likes", "saved", "story_sticker_interactions", "login_and_account_creation", "ads_and_businesses", "information_about_you", "recent_searches", "account_information", "devices", "settings", "your_topics", "monetization", "shopping", "events", "fundraisers", "guides", "reports", "autofill_information", "professional_information", "threads", "files", "past_instagram_insights", "additional_information", "story_interactions", "your_activity_across_facebook", "fb_and_ig_activity", "linked_meta_accounts", "privacy_checkup", "meta_ai"]);

const Arc = {
  archives: [], entries: [], byRel: new Map(), byBase: new Map(), files: [], urls: new Map(), jcache: new Map(), sig: "",
  async load() {

      const r = await fetch(ORIGIN + "/zipidx/?t=" + Date.now());

    } else {

        catch (err) { this.archives.push({name: f.name, size: f.size, ok: false, err: err.message}); }
      }
    }
    this.build(raw);
  },
  build(raw) {

    const per = new Map();
    for (const e of raw) { if (e.name.endsWith("/")) continue; (per.get(e.a) || per.set(e.a, []).get(e.a)).push(e); }
    for (const [, list] of per) {
      // Arşivin tamamı tek bir üst klasördeyse (ör. "instagram-kullanici-2024…/") o klasörü at
      const firsts = new Set(list.map(e => e.name.includes("/") ? e.name.split("/")[0] : ""));
      let strip = "";

      for (const e of list) {
        e.rel = strip && e.name.startsWith(strip) ? e.name.slice(strip.length) : e.name;
        e.base = e.rel.split("/").pop();
        e.dir = e.rel.slice(0, e.rel.length - e.base.length).replace(/\/$/, "");
        e.kind = kindOf(e.rel);
        this.entries.push(e);
        if (!this.byRel.has(e.rel)) this.byRel.set(e.rel, e);
        const b = this.byBase.get(e.base);
        this.byBase.set(e.base, b === undefined ? e : null); // null = aynı adda birden çok dosya
      }
    }
    this.sig = this.archives.map(a => a.name + ":" + a.size).join("|");
  },
  resolve(uri) {
    if (!uri || /^https?:/i.test(uri)) return null;
    let u = String(uri).replace(/^\.?\//, "");
    let e = this.byRel.get(u);
    if (e) return e;
    const parts = u.split("/"), k = parts.findIndex(p => ROOTS.has(p));
    if (k > 0) { e = this.byRel.get(parts.slice(k).join("/")); if (e) return e; }
    e = this.byBase.get(parts[parts.length - 1]);
    return e || null;
  },
  async url(e) {
    if (B) return ORIGIN + "/zip/" + e.a + "/" + e.name.split("/").map(encodeURIComponent).join("/");

  },

async function zipIndex(file, a) {

  else if (c.kind === "media") c.data = jsons.flatMap(collectMedia).sort((a, b) => (b.ts || 0) - (a.ts || 0));
  else {
    c.data = jsons.flatMap(recordsOf).map(r => { const f = flat(r); f.text = fold([f.title, ...f.rows.map(x => x.k + " " + x.v)].join(" ")); return f; });
    c.data.sort((a, b) => (b.ts || 0) - (a.ts || 0));
  }
  c.count = c.data.length;
  // büyük dosyaların ham hâlini bellekte tutma
  for (const f of c.files) if (f.size > 2e6) Arc.jcache.delete(f.a + "/" + f.name);
  return c.data;
}

const Msg = {
  threads: [], byId: new Map(), scanned: false, scanning: null, me: "", stats: null, _tmp: null,
  reset() { this.threads = []; this.byId = new Map(); this.scanned = false; this.scanning = null; this.me = ""; this.stats = null; this._tmp = new Map(); },
  addFile(box, folder, n, e) {
    const id = box + "/" + folder;
    let t = this._tmp.get(id);
    if (!t) { t = {id, box, folder, files: [], title: human(folder.replace(/_\d{6,}$/, "")), parts: [], msgs: null, count: 0, last: 0, first: 0}; this._tmp.set(id, t); }
    t.files.push({n, e});
  },
  finishIndex() {
    this.threads = [...this._tmp.values()];
    for (const t of this.threads) { t.files.sort((a, b) => a.n - b.n); this.byId.set(t.id, t); }
    this._tmp = new Map();
  },
  async loadThread(t) {
    if (t.msgs) return t;
    const msgs = [];
    let parts = null, title = "";
    for (const {e} of t.files) {
      let j; try { j = await Arc.json(e, false); } catch (err) { continue; }
      if (!parts && Array.isArray(j.participants)) parts = j.participants.map(p => p && p.name || "").filter(Boolean);
      if (!title && j.title) title = j.title;
      for (const m of j.messages || []) msgs.push(toMsg(m));
    }
    msgs.sort((a, b) => a.t - b.t);
    t.msgs = msgs; t.parts = parts || []; t.count = msgs.length;
    if (title) t.title = title; else if (t.parts.length) t.title = t.parts.join(", ");
    t.first = msgs.length ? msgs[0].t : 0; t.last = msgs.length ? msgs[msgs.length - 1].t : 0;
    t.group = t.parts.length > 2;
    return t;
  },
  scan(onProg) {
    if (this.scanned) return Promise.resolve();
    if (this.scanning) return this.scanning;
    this.scanning = (async () => {
      let done = 0;
      const q = [...this.threads], N = q.length;
      const worker = async () => { while (q.length) { const t = q.shift(); await this.loadThread(t); done++; onProg && onProg(done, N); } };
      await Promise.all([worker(), worker(), worker(), worker()]);
      this.detectMe();
      this.threads.sort((a, b) => b.last - a.last);
      this.stats = computeStats();
      this.scanned = true;
    })();
    return this.scanning;
  },
  detectMe() {
    const cnt = new Map();
    for (const t of this.threads) for (const p of new Set(t.parts)) cnt.set(p, (cnt.get(p) || 0) + 1);
    let best = "", bn = 0;
    for (const [p, n] of cnt) if (n > bn) { best = p; bn = n; }
    if (Profile.name && cnt.has(Profile.name)) best = Profile.name;
    this.me = this.threads.length > 1 || !Profile.name ? best : Profile.name;
    for (const t of this.threads) {
      const others = t.parts.filter(p => p !== this.me);
      if (!t.titleFixed && others.length && (t.title === t.parts.join(", ") || !t.title)) t.title = others.join(", ");
    }
  },
  totalMsgs() { return this.threads.reduce((s, t) => s + (t.count || 0), 0); }
};
function toMsg(m) {
  const o = {s: m.sender_name || "", t: toSec(m.timestamp_ms || m.timestamp) || 0};
  if (m.content) o.c = m.content;
  if (Array.isArray(m.photos) && m.photos.length) o.ph = m.photos.map(p => p.uri).filter(Boolean);
  if (Array.isArray(m.videos) && m.videos.length) o.vi = m.videos.map(p => p.uri).filter(Boolean);
  if (Array.isArray(m.audio_files) && m.audio_files.length) o.au = m.audio_files.map(p => p.uri).filter(Boolean);
  if (Array.isArray(m.gifs) && m.gifs.length) o.gi = 1;
  if (m.sticker && m.sticker.uri) o.st = m.sticker.uri;
  if (m.share) o.sh = {l: m.share.link || "", x: m.share.share_text || "", o: m.share.original_content_owner || ""};
  if (Array.isArray(m.reactions) && m.reactions.length) o.re = m.reactions.map(r => r.reaction).filter(Boolean);
  if (m.call_duration != null) o.call = m.call_duration;
  if (m.is_unsent) o.un = 1;
  return o;
}
const EMOJI_RE = /\p{Extended_Pictographic}/gu;
function computeStats() {
  const me = Msg.me, st = {total: 0, sent: 0, recv: 0, years: {}, hours: Array(24).fill(0), dows: Array(7).fill(0), emojis: new Map(), first: 0, last: 0, days: new Map(), photos: 0, videos: 0, audios: 0, calls: 0, callSec: 0, words: 0, onThisDay: []};
  const now = new Date(), tm = now.getMonth(), td = now.getDate(), ty = now.getFullYear();
  for (const t of Msg.threads) {
    t.mine = 0; t.otd = {};
    for (const m of t.msgs || []) {
      if (!m.t) continue;
      st.total++;
      const mine = m.s === me;
      if (mine) { st.sent++; t.mine++; } else st.recv++;
      const d = new Date(m.t * 1000), y = d.getFullYear();
      st.years[y] = (st.years[y] || 0) + 1;
      st.hours[d.getHours()]++; st.dows[d.getDay()]++;
      const dk = dayKey(m.t); st.days.set(dk, (st.days.get(dk) || 0) + 1);
      if (!st.first || m.t < st.first) st.first = m.t;
      if (m.t > st.last) st.last = m.t;
      if (m.ph) st.photos += m.ph.length; if (m.vi) st.videos += m.vi.length; if (m.au) st.audios += m.au.length;
      if (m.call != null) { st.calls++; st.callSec += m.call; }
      if (m.c) {
        st.words += m.c.split(/\s+/).filter(Boolean).length;
        if (mine && !/^(Reacted|Bir mesajına|.* tepki verdi)/.test(m.c)) { const em = m.c.match(EMOJI_RE); if (em) for (const x of em) st.emojis.set(x, (st.emojis.get(x) || 0) + 1); }
      }
      if (d.getMonth() === tm && d.getDate() === td && y < ty) t.otd[y] = (t.otd[y] || 0) + 1;
    }
    for (const [y, n] of Object.entries(t.otd)) st.onThisDay.push({t, y: +y, n});
  }
  let bd = "", bn = 0;
  for (const [k, n] of st.days) if (n > bn) { bd = k; bn = n; }
  st.busiest = {day: bd, n: bn};
  st.activeDays = st.days.size;
  st.onThisDay.sort((a, b) => b.n - a.n);
  delete st.days;
  return st;
}

const Profile = {name: "", user: "", bio: "", photo: null, exportDate: null, loaded: false};
async function loadProfile() {
  Object.assign(Profile, {name: "", user: "", bio: "", photo: null, exportDate: null, loaded: true});
  const c = catByKey("personal_information", "instagram_profile_information", "account_information");
  if (c) {
    try {
      const recs = recordsOf(await Arc.json(c.files[0]));
      const f = flat(recs[0] || {});
      const get = re => (f.rows.find(r => re.test(r.k)) || {}).v || "";
      Profile.user = norm(get(/^kullanıcı adı$/i)) || "";
      Profile.name = get(/^(ad|isim|name)$/i) || (f.title !== Profile.user ? f.title : "");
      Profile.bio = get(/^biyografi$/i);
      if (f.media.length) Profile.photo = f.media[0];
    } catch (e) {}
  }
  const pp = catByKey("profile_photos");
  if (!Profile.photo && pp) { try { const d = await loadCat(pp); if (d[0]) Profile.photo = d[0].items[0].uri; } catch (e) {} }
  for (const a of Arc.archives) {
    const m = String(a.name).match(/(?:instagram|meta)-([a-z0-9._]+?)-(\d{4}-\d{2}-\d{2})/i);
    if (m) { if (!Profile.user) Profile.user = m[1].toLowerCase(); Profile.exportDate = m[2]; break; }
    const d = String(a.name).match(/(\d{4}-\d{2}-\d{2})/);
    if (d && !Profile.exportDate) Profile.exportDate = d[1];
  }
}

function paginate(container, items, renderItem, page = 60, empty = "Kayıt yok") {
  let shown = 0;
  const box = document.createElement("div"); container.appendChild(box);
  const more = document.createElement("button"); more.className = "btn sm more";
  const sentinel = document.createElement("div");
  container.appendChild(more); container.appendChild(sentinel);
  const step = () => {
    const html = []; const end = Math.min(items.length, shown + page);
    for (let i = shown; i < end; i++) html.push(renderItem(items[i], i));
    box.insertAdjacentHTML("beforeend", html.join(""));
    shown = end;
    more.textContent = "Daha fazla göster (" + fmt(items.length - shown) + " kaldı)";
    more.classList.toggle("hidden", shown >= items.length);
    lazy(box);
  };
  more.onclick = step;
  if (!items.length) box.innerHTML = `<div class="empty"><div class="e">🫥</div>${esc(empty)}</div>`;
  step();
  new IntersectionObserver((en, o) => { if (!document.body.contains(sentinel)) { o.disconnect(); return; } if (en[0].isIntersecting && shown < items.length) step(); }, {rootMargin: "600px"}).observe(sentinel);
}

function yearChart(tsList, label = "Yıllara göre") {

}

function chatHtml(t, s, e, hlIdx, q) {

  for (let i = s; i < e; i++) {

    if (dk !== lastDay) { const d = new Date(m.t * 1000); out.push(`<div class="day">${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}, ${DAYS[d.getDay()]}</div>`); lastDay = dk; lastSender = null; }
    if (m.call != null) { out.push(`<div class="call" id="m${i}">📞 ${esc(m.c || "Arama")} · ${fDur(m.call)} · ${fTime(m.t)}</div>`); lastSender = null; continue; }
    if (t.group && !mine && m.s !== lastSender) out.push(`<div class="who">${esc(m.s)}</div>`);
    lastSender = m.s;
    const media = [...(m.ph || []), ...(m.vi || [])];
    const H = i === hlIdx ? " hl" : "";
    if (media.length) {
      const list = media.map(u => ({uri: u, ts: m.t, title: (mine ? "Sen" : m.s)}));
      out.push(`<div class="bub media ${mine ? "me" : ""}${H}" id="m${i}"><div class="mg ${media.length === 1 ? "one" : ""}">${media.map((u, k) => thumb(u, () => V.open(list, k))).join("")}</div></div>`);
    }
    let body = "";
    if (m.au) body += m.au.map(u => `<audio controls preload="none" data-uri="${esc(u)}"></audio>`).join("");
    if (m.c) body += `<div class="${/^(Reacted |.*tepki verdi|.*sent an attachment|.*ek gönderdi|.*bir ek gönderdi)/i.test(m.c) ? "sys" : ""}">${hl(m.c, q)}</div>`;
    else if (m.un) body += `<div class="sys">Bu mesaj geri alındı</div>`;
    else if (m.st) body += thumbSticker(m.st);
    else if (m.gi) body += `<div class="sys">GIF</div>`;
    if (m.sh && (m.sh.l || m.sh.x)) body += `<a class="share" href="${esc(m.sh.l || "#")}" target="_blank" rel="noopener">${m.sh.o ? `<b>@${esc(m.sh.o)}</b>` : ""}${esc((m.sh.x || m.sh.l).slice(0, 220))}</a>`;
    if (body || !media.length) out.push(`<div class="bub ${mine ? "me" : ""}${media.length ? "" : H}" ${media.length ? "" : `id="m${i}"`}>${body || '<div class="sys">…</div>'}<div class="tm">${fTime(m.t)}</div></div>`);
    if (m.re) out.push(`<div class="react ${mine ? "me" : ""}">${esc(m.re.join(" "))}</div>`);
  }
  return out.join("");
}

function threadSearch(t, p) {

  h += `<div id="fv" class="mt12">${loadingHtml("Açılıyor…")}</div>`;
  main.innerHTML = h;
  const box = $("#fv");
  (async () => {
    try {
      if (e.kind === "image" || e.kind === "video" || e.kind === "audio") {
        const u = await Arc.url(e);
        box.innerHTML = `<div class="prev">${e.kind === "image" ? `<img src="${esc(u)}" alt="">` : e.kind === "video" ? `<video src="${esc(u)}" controls playsinline></video>` : `<audio src="${esc(u)}" controls></audio>`}</div>`;
      } else if (e.kind === "json") {
        box.innerHTML = "";
        if (e.size > 8e6) { box.innerHTML = `<div class="banner info">${ic("info", 18)}<div>Bu dosya çok büyük (${fSize(e.size)}). Ağaç görünümünde ilk kısımları gösteriliyor.</div></div>`; }
        const j = await Arc.json(e, e.size < 2e6);
        box.insertAdjacentHTML("beforeend", `<div class="jt">${jsonTree(j, null, 0)}</div>`);
      } else if (e.kind === "html") {
        const t = await Arc.text(e);
        box.innerHTML = `<iframe class="html" sandbox="" srcdoc="${esc(t)}"></iframe>`;
      } else if (e.kind === "text" || e.size < 2e5) {
        const t = await Arc.text(e);
        box.innerHTML = `<pre class="code">${esc(t.slice(0, 300000))}</pre>`;
      } else box.innerHTML = `<div class="empty"><div class="e">📦</div>Bu dosya türü önizlenemiyor.<br>Kaydet tuşuyla telefonuna indirebilirsin.</div>`;
    } catch (err) { box.innerHTML = `<div class="empty"><div class="e">⚠️</div>Açılamadı: ${esc(err.message)}</div>`; }
  })();
};
function jsonTree(v, key, depth) {
  const k = key != null ? `<span class="jk">${esc(key)}</span>: ` : "";
  if (v === null) return `<div class="jl">${k}<span class="jb">null</span></div>`;
  if (typeof v === "string") {
    return `<div class="jl">${k}<span class="js">"${esc(v.length > 2000 ? v.slice(0, 2000) + "…" : v)}"</span></div>`;
  }
  if (typeof v === "number") {
    const tsHint = /time|timestamp|date/i.test(String(key)) && toSec(v) && toSec(v) > 9e8 && toSec(v) < 4e9 ? ` <span class="faint">(${fDT(toSec(v))})</span>` : "";
    return `<div class="jl">${k}<span class="jn">${v}</span>${tsHint}</div>`;
  }
  if (typeof v === "boolean") return `<div class="jl">${k}<span class="jb">${v}</span></div>`;
  const arr = Array.isArray(v), ent = arr ? v.map((x, i) => [i, x]) : Object.entries(v);
  const lim = 200, shown = ent.slice(0, lim);
  const label = arr ? `[${fmt(ent.length)}]` : `{${fmt(ent.length)}}`;
  const inner = shown.map(([kk, x]) => jsonTree(x, arr ? kk : fixStr(kk), depth + 1)).join("") + (ent.length > lim ? `<div class="jl faint">… ${fmt(ent.length - lim)} öğe daha</div>` : "");
  return `<details ${depth < 2 ? "open" : ""}><summary>${k}${label}</summary>${inner}</details>`;
}

/* ---------- İstatistikler ---------- */
VIEWS.stats = p => {
  if (!Msg.scanned && Msg.threads.length) {
    main.innerHTML = topbar("İstatistikler") + busyHtml() + loadingHtml("Mesajlar sayılıyor…");
    Msg.scan().then(() => stack[stack.length - 1] === p && render());
    return;
  }
  const st = Msg.stats;
  let h = topbar("İstatistikler", st && st.first ? fDate(st.first) + " – " + fDate(st.last) : "");
  if (st && st.total) {
    const span = Math.max(1, Math.round((st.last - st.first) / 86400));
    h += `<div class="stat2">
      <div class="card"><div class="k">Toplam mesaj</div><div class="v">${fmt(st.total)}</div></div>
      <div class="card"><div class="k">Sohbet</div><div class="v">${fmt(Msg.threads.length)}</div></div>
      <div class="card"><div class="k">Gönderdiğin</div><div class="v">${fmt(st.sent)}</div></div>
      <div class="card"><div class="k">Aldığın</div><div class="v">${fmt(st.recv)}</div></div>
      <div class="card"><div class="k">Günlük ortalama</div><div class="v">${(st.total / span).toLocaleString("tr-TR", {maximumFractionDigits: 1})}</div></div>
      <div class="card"><div class="k">Mesajlaştığın gün</div><div class="v">${fmt(st.activeDays)}</div></div>
      <div class="card"><div class="k">Fotoğraf · video</div><div class="v">${fmt(st.photos)} · ${fmt(st.videos)}</div></div>
      <div class="card"><div class="k">Sesli mesaj</div><div class="v">${fmt(st.audios)}</div></div>
      ${st.calls ? `<div class="card"><div class="k">Arama</div><div class="v">${fmt(st.calls)}</div><div class="tiny muted">${fDur(st.callSec)}</div></div>` : ""}
      <div class="card"><div class="k">En yoğun gün</div><div class="v" style="font-size:15px">${st.busiest.day ? fDate(new Date(st.busiest.day + "T12:00").getTime() / 1000) : "—"}</div><div class="tiny muted">${fmt(st.busiest.n)} mesaj</div></div>
      <div class="card" style="grid-column:span 2"><div class="k">Yazılan kelime</div><div class="v">${fmt(st.words)}</div><div class="tiny muted">yaklaşık ${fmt(Math.round(st.words / 250))} kitap sayfası</div></div>
    </div>`;
    const ys = Object.keys(st.years).map(Number).sort();
    if (ys.length) { const all = []; for (let y = ys[0]; y <= ys[ys.length - 1]; y++) all.push(["'" + String(y).slice(2), st.years[y] || 0]); h += `<div class="sec">Yıllara göre mesaj</div><div class="card">${barsHtml(all)}</div>`; }
    const top = Msg.threads.filter(t => !t.group).sort((a, b) => b.count - a.count).slice(0, 10);
    if (top.length) {
      const max = top[0].count;
      h += `<div class="sec">En çok mesajlaştığın kişiler</div><div class="card" style="padding:6px 14px">${top.map((t, i) => `<button class="hbar" data-a="${A(() => go({v: "thread", id: t.id}))}"><span class="nm ell">${i + 1}. ${esc(t.title)}</span><span class="tr"><i style="width:${t.count / max * 100}%"></i></span><span class="vv">${fmt(t.count)}</span></button>`).join("")}</div>`;
    }
    const groups = Msg.threads.filter(t => t.group).sort((a, b) => b.count - a.count).slice(0, 5);
    if (groups.length) { const max = groups[0].count; h += `<div class="sec">En hareketli gruplar</div><div class="card" style="padding:6px 14px">${groups.map(t => `<button class="hbar" data-a="${A(() => go({v: "thread", id: t.id}))}"><span class="nm ell">${esc(t.title)}</span><span class="tr"><i style="width:${t.count / max * 100}%"></i></span><span class="vv">${fmt(t.count)}</span></button>`).join("")}</div>`; }
    const hmax = Math.max(...st.hours);
    const night = st.hours.slice(0, 6).reduce((a, b) => a + b, 0);
    h += `<div class="sec">Saatlere göre</div><div class="card">${barsHtml(st.hours.map((n, i) => [i % 3 === 0 ? String(i) : "", n]), false)}<div class="small muted mt8">En aktif saatin <b style="color:var(--text)">${st.hours.indexOf(hmax)}:00</b>. Mesajlarının %${Math.round(night / st.total * 100)}'i gece 00:00–06:00 arası.</div></div>`;
    const order = [1, 2, 3, 4, 5, 6, 0];
    h += `<div class="sec">Günlere göre</div><div class="card">${barsHtml(order.map(d => [DAY3[d], st.dows[d]]))}</div>`;
    const em = [...st.emojis.entries()].sort((a, b) => b[1] - a[1]).slice(0, 15);
    if (em.length) h += `<div class="sec">En çok kullandığın emojiler</div><div class="card"><div class="emo" style="margin-top:0">${em.map(([e, n]) => `<span>${e}<small>${fmt(n)}</small></span>`).join("")}</div></div>`;
  } else h += `<div class="empty"><div class="e">💬</div>Mesaj verisi yok.</div>`;
  // içerik istatistikleri (tembel)
  h += `<div class="sec">Paylaşımların</div><div id="cs">${loadingHtml("Hesaplanıyor…")}</div>`;
  main.innerHTML = h;
  (async () => {
    const rows = [];
    for (const [k, t] of [["stories", "Hikaye"], ["posts", "Gönderi"], ["reels", "Reels"], ["liked_posts", "Beğeni"], ["post_comments", "Yorum"], ["saved_posts", "Kaydedilen"], ["account_searches", "Hesap araması"]]) {
      const c = catByKey(k); if (!c) continue;
      const d = await loadCat(c);
      rows.push({t, c, d});
    }
    const box = $("#cs"); if (!box || stack[stack.length - 1] !== p) return;
    if (!rows.length) { box.innerHTML = `<div class="empty">Paylaşım verisi yok.</div>`; return; }
    box.innerHTML = `<div class="stat2">${rows.map(r => `<button class="card" style="text-align:left" data-a="${A(() => go({v: "cat", id: r.c.id}))}"><div class="k">${esc(r.t)}</div><div class="v">${fmt(r.d.length)}</div></button>`).join("")}</div>` +
      rows.filter(r => r.d.length > 5).slice(0, 4).map(r => yearChart(r.d.map(x => x.ts || x.at), r.t + " · yıllara göre")).join("");
  })();
};

/* ---------- Ayarlar ---------- */
VIEWS.settings = () => {
  const sw = on => `<span class="switch ${on ? "on" : ""}"></span>`;
  let h = topbar("Ayarlar");
  h += `<div class="sec">Arşivler</div><div class="group">`;
  Arc.archives.forEach((a, i) => {
    h += `<div class="item"><span class="ic">${a.ok ? "📦" : "⚠️"}</span><div class="grow"><div class="tt ell">${esc(a.name)}</div><div class="st">${fSize(a.size)}${a.ok ? "" : " · " + esc(a.err || "açılamadı")}${a.temp ? " · bu oturumluk" : ""}${a.copied ? " · uygulamaya kopyalandı" : ""}</div></div><button class="ib" aria-label="Kaldır" data-a="${A(() => removeArchive(i))}">${ic("trash", 20)}</button></div>`;
  });
  if (!Arc.archives.length) h += `<div class="item muted">Henüz ZIP eklenmedi</div>`;
  h += `</div><button class="btn block mt12" data-a="${A(pickZip)}">${ic("plus", 18)} ZIP ekle (diğer parçalar dahil)</button>`;
  h += `<div class="sec">Görünüm</div><div class="card"><div class="seg">${[["dark", "Koyu"], ["light", "Açık"], ["auto", "Sistem"]].map(([k, t]) => `<button class="${S.theme === k ? "on" : ""}" data-a="${A(() => { S.theme = k; save(); applyTheme(); render(); })}">${t}</button>`).join("")}</div></div>`;
  h += `<div class="sec">Gizlilik</div><div class="group">
    <button class="item" data-a="${A(() => S.pin ? removePin() : setPin())}"><span class="ic">🔒</span><div class="grow"><div class="tt">Uygulama kilidi</div><div class="st">${S.pin ? "Açık · her açılışta şifre sorulur" : "Kapalı · 4 haneli şifre koy"}</div></div>${sw(!!S.pin)}</button>
    ${B && B.setSecure ? `<button class="item" data-a="${A(() => { const on = !B.isSecure(); B.setSecure(on); toast(on ? "Ekran görüntüsü engellendi" : "Ekran görüntüsüne izin verildi"); render(); })}"><span class="ic">📵</span><div class="grow"><div class="tt">Ekran görüntüsünü engelle</div><div class="st">Mesajların ekran görüntüsü alınamaz, son uygulamalarda gizlenir</div></div>${sw(B.isSecure())}</button>` : ""}
  </div>
  <div class="card mt12 small muted">${ic("lock", 14)} Arşivim internete hiç bağlanmaz. Veriler sadece seçtiğin ZIP'ten, telefonun içinde okunur; kimseye gönderilmez. ZIP'i silersen uygulama da onu göremez.</div>`;
  h += `<div class="sec">Yardım</div><div class="card">${guideHtml()}</div>`;
  h += `<div class="sec">Sorun mu var?</div><div class="card small muted">
    <p style="margin:0 0 8px"><b style="color:var(--text)">Takipçilerim eksik görünüyor:</b> İndirirken tarih aralığı "Son 1 yıl" kalmış olabilir. "Tüm zamanlar" seçip yeniden indir.</p>
    <p style="margin:0 0 8px"><b style="color:var(--text)">Fotoğraflar çıkmıyor (🚫):</b> Medya başka bir ZIP parçasında olabilir; diğer parçaları da ekle. Ya da indirirken medya hariç tutulmuş olabilir.</p>
    <p style="margin:0"><b style="color:var(--text)">Kategoriler boş:</b> Arşiv HTML biçiminde inmiş olabilir. JSON biçimini seçip yeniden indir.</p></div>`;
  h += `<div class="center tiny faint mt20">Arşivim 1.0 · ${fmt(Arc.entries.length)} dosya okundu</div>`;
  main.innerHTML = h;
};
function removeArchive(i) {
  const a = Arc.archives[i];
  sheet(`<h2>Arşivi kaldır?</h2><p class="muted small">"${esc(a.name)}" uygulamadan kaldırılır. Telefonundaki ZIP dosyası silinmez.</p><div class="grid2 mt16"><button class="btn" id="rc">Vazgeç</button><button class="btn danger" id="ro">Kaldır</button></div>`, s => {
    $("#rc", s).onclick = closeSheet;
    $("#ro", s).onclick = async () => { closeSheet(); if (B) B.removeArchive(i); else Arc.files.splice(i, 1); await reloadArchive(); go({v: "settings"}); };
  });
}

/* ================= KİLİT ================= */
async function sha(s) {
  try { const b = await crypto.subtle.digest("SHA-256", new TextEncoder().encode("arsivim:" + s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, "0")).join(""); }
  catch (e) { return String(hash("arsivim:" + s)); }
}
function keypad(el, title, sub, onDone) {
  let v = "";
  el.innerHTML = `<div class="onb" style="padding:0"><div class="logo" style="width:70px;height:70px;border-radius:22px">${ic("lock", 32).replace('stroke="currentColor"', 'stroke="#fff"')}</div></div><h2 class="center">${esc(title)}</h2><div class="small muted center mt4" id="ksub">${esc(sub || "")}</div><div class="dots" id="kd">${"<i></i>".repeat(4)}</div><div class="keys">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map(n => `<button data-k="${n}">${n}</button>`).join("")}<button class="nb" data-k="x">${el.id === "lock" ? "" : "Vazgeç"}</button><button data-k="0">0</button><button class="nb" data-k="d">Sil</button></div>`;
  const dots = () => el.querySelectorAll("#kd i").forEach((d, i) => d.classList.toggle("f", i < v.length));
  el.querySelector(".keys").onclick = async e => {
    const b = e.target.closest("[data-k]"); if (!b) return;
    const k = b.dataset.k;
    if (k === "d") v = v.slice(0, -1);
    else if (k === "x") { if (el.id !== "lock") closeSheet(); return; }
    else if (v.length < 4) v += k;
    dots();
    if (v.length === 4) { const ok = await onDone(v); if (ok === false) { const d = el.querySelector("#kd"); d.classList.add("err"); navigator.vibrate && navigator.vibrate(120); setTimeout(() => { d.classList.remove("err"); v = ""; dots(); }, 400); } }
  };
}
function showLock() {
  return new Promise(res => {
    const el = $("#lock"); el.classList.remove("hidden");
    keypad(el, "Arşivim kilitli", "Şifreni gir", async v => { if (await sha(v) === S.pin) { el.classList.add("hidden"); el.innerHTML = ""; res(); return true; } return false; });
  });
}
function setPin() {
  sheet('<div id="kp"></div>', s => {
    let firstPin = null;
    const el = $("#kp", s);
    const step1 = () => keypad(el, "Yeni şifre", "4 haneli bir şifre seç", v => { firstPin = v; step2(); });
    const step2 = () => keypad(el, "Şifreyi tekrarla", "Aynı şifreyi bir daha gir", async v => { if (v !== firstPin) { $("#ksub", el).textContent = "Uyuşmadı, baştan dene"; setTimeout(step1, 700); return false; } S.pin = await sha(v); save(); closeSheet(); toast("Uygulama kilidi açıldı"); render(); });
    step1();
  });
}
function removePin() {
  sheet('<div id="kp"></div>', s => keypad($("#kp", s), "Kilidi kapat", "Mevcut şifreni gir", async v => { if (await sha(v) !== S.pin) return false; S.pin = null; save(); closeSheet(); toast("Uygulama kilidi kapatıldı"); render(); }));
}
document.addEventListener("visibilitychange", () => {
  // uygulamadan 60 sn'den uzun çıkıldıysa tekrar kilitle
  if (!S.pin) return;
  if (document.hidden) window.__hid = Date.now();
  else if (window.__hid && Date.now() - window.__hid > 60000) showLock();
});

/* ================= YÜKLEME ================= */
async function reloadArchive() {
  ready = false; render(true);
  try { await Arc.load(); } catch (e) { Arc.entries = []; Arc.archives = Arc.archives || []; toast("Arşiv okunamadı: " + e.message, 4000); }
  buildCatalog();
  await loadProfile();
  ready = true;
  stack = [{v: "home"}];
  render(true);
  background();
}
let bgToken = 0;
async function background() {
  const my = ++bgToken;
  if (Msg.threads.length) {
    setBusy({kind: "msgs", label: "Mesajlar hazırlanıyor", done: 0, total: Msg.threads.length});
    renderNav();
    await Msg.scan((d, n) => { if (my === bgToken) setBusy({kind: "msgs", label: "Mesajlar hazırlanıyor (" + fmt(d) + "/" + fmt(n) + " sohbet)", done: d, total: n}); });
    if (my !== bgToken) return;
  }
  setBusy(null);
  if (!Profile.name && Msg.me) Profile.name = Msg.me;
  refreshIfHome();
  // kategori sayıları
  const cats = Cat.list.slice().sort((a, b) => (MEDIA_KEYS.has(b.key) || PEOPLE_KEYS.has(b.key)) - (MEDIA_KEYS.has(a.key) || PEOPLE_KEYS.has(a.key)));
  let n = 0;
  for (const c of cats) {
    if (my !== bgToken) return;
    if (c.data) continue;
    try { await loadCat(c); } catch (e) {}
    if (++n % 6 === 0) { refreshIfHome(); await sleep(0); }
  }
  refreshIfHome();
}
function refreshIfHome() {
  const p = stack[stack.length - 1];
  if (stack.length === 1 && p.v === "home" && ready && !sheetOpen() && $("#viewer").classList.contains("hidden")) { const y = scrollY; render(); scrollTo(0, y); }
  else renderNav();
}

(async function init() {
  render();
  if (S.pin) await showLock();
  await reloadArchive();
})();
</script>
