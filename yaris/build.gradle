plugins { id 'com.android.application' }
android {
    namespace 'com.bilal.gecekacagi'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bilal.gecekacagi'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '11.0'
    }
    // Aynı imza = güncellemeler eskisinin üzerine kurulur, kariyer kaydı silinmez. Bu anahtarı değiştirme.
    signingConfigs {
        debug {
            storeFile file('keystore/kacak.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
