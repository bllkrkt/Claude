plugins { id 'com.android.application' }

android {
    namespace 'com.bilal.arackutusu'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bilal.arackutusu'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '5.0'
    }
    // İmza anahtarı GitHub Actions'ta ortam değişkenlerinden gelir (depoya konmaz).
    // Aynı anahtar = yeni sürüm eskisinin üzerine kurulur.
    signingConfigs {
        release {
            def ks = System.getenv('KEYSTORE_FILE')
            if (ks) {
                storeFile file(ks)
                storePassword System.getenv('KEYSTORE_PASSWORD')
                keyAlias System.getenv('KEY_ALIAS')
                keyPassword System.getenv('KEYSTORE_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig System.getenv('KEYSTORE_FILE') ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
