<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Araç Kutusu</title>
<style>
:root{
  --bg:#0E1116; --bg2:#151A21; --card:#1A2029; --card2:#212935; --line:#2A3340;
  --tx:#E8EDF3; --tx2:#9AA6B5; --tx3:#6B7686;
  --ac:#4FD1A5; --ac2:#2FB386; --acbg:rgba(79,209,165,.12);
  --warn:#F5B94A; --warnbg:rgba(245,185,74,.12);
  --bad:#F26D6D; --badbg:rgba(242,109,109,.13);
  --blue:#6AA8FF; --bluebg:rgba(106,168,255,.12);
  --r:18px;
}
:root[data-theme=light]{
  --bg:#F2F4F7; --bg2:#E8ECF1; --card:#FFFFFF; --card2:#EDF0F4; --line:#DCE1E8;
  --tx:#121820; --tx2:#566273; --tx3:#8A95A4;
  --ac:#0F9C74; --ac2:#0C8462; --acbg:rgba(15,156,116,.12);
  --warn:#B26F12; --warnbg:rgba(245,170,50,.16); --bad:#D23F3F; --badbg:rgba(210,63,63,.11);
  --blue:#2D6BD2; --bluebg:rgba(45,107,210,.10);
}
:root[data-theme=light] header{background:rgba(242,244,247,.94)}
:root[data-theme=light] .note.warn,:root[data-theme=light] .note.info,:root[data-theme=light] .note.bad,:root[data-theme=light] .note.ok{color:var(--tx)}
:root[data-theme=light] #toast{background:#1E2630;color:#fff}
:root[data-theme=light] .btn.pri{color:#fff} :root[data-theme=light] .btn.red{color:#fff}
:root[data-theme=light] .tile.hl{background:linear-gradient(135deg,#DCEBFA,#FFFFFF)!important}
:root[data-theme=light] .app,:root[data-theme=light] .card,:root[data-theme=light] .list,:root[data-theme=light] .tile,:root[data-theme=light] .set,:root[data-theme=light] .mode,:root[data-theme=light] .stat{box-shadow:0 1px 3px rgba(20,30,50,.07)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding-bottom:110px}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:6px;padding:10px 12px;background:rgba(14,17,22,.94);backdrop-filter:blur(10px);min-height:60px}
header h2{margin:0;font-size:20px;font-weight:700;flex:1}
#backBtn{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;background:var(--card)}
#backBtn svg{width:24px;height:24px}
main{padding:4px 16px 16px;max-width:640px;margin:0 auto}
h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx2);margin:26px 4px 10px;font-weight:700}
p{margin:0}
.muted{color:var(--tx2)} .small{font-size:14px} .tiny{font-size:12.5px}
.card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Ana ekran */
.hero{padding:18px 4px 6px}
.hero h1{margin:0 0 4px;font-size:30px;letter-spacing:-.02em}
.store{margin-top:14px}
.bar{height:10px;border-radius:6px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:6px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.tile{background:var(--card);border-radius:22px;padding:18px 16px;text-align:left;min-height:168px;display:flex;flex-direction:column;gap:10px;border:1px solid transparent;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ic{width:52px;height:52px;border-radius:16px;display:flex;align-items:center;justify-content:center}
.tile .ic svg{width:28px;height:28px}
.tile b{font-size:18px;line-height:1.2}
.tile span{font-size:13.5px;color:var(--tx2);line-height:1.35}
.c1 .ic{background:var(--acbg);color:var(--ac)} .c2 .ic{background:var(--bluebg);color:var(--blue)}
.c3 .ic{background:var(--warnbg);color:var(--warn)} .c4 .ic{background:rgba(190,140,255,.13);color:#C39BFF}

/* Butonlar */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:0 20px;border-radius:16px;font-weight:700;font-size:17px;background:var(--card2);width:100%}
.btn.pri{background:var(--ac);color:#06281C}
.btn.red{background:var(--bad);color:#2A0707}
.btn.ghost{background:transparent;border:1.5px solid var(--line)}
.btn.sm{min-height:46px;font-size:15px;border-radius:14px;padding:0 14px;width:auto}
.btn:disabled{opacity:.45}
.btns{display:flex;gap:10px;flex-wrap:wrap}
.btns>.btn{flex:1;min-width:130px}
.link{color:var(--ac);font-weight:600;padding:12px 4px;display:inline-flex;align-items:center;gap:6px}

.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg button{min-height:46px;padding:0 16px;border-radius:14px;background:var(--card2);font-weight:600;font-size:15px;border:1.5px solid transparent}
.seg button.on{background:var(--acbg);border-color:var(--ac);color:var(--ac)}

.note{display:flex;gap:12px;align-items:flex-start;border-radius:var(--r);padding:14px 16px;margin-bottom:12px;font-size:14.5px}
.note svg{margin-top:1px}
.note.warn{background:var(--warnbg);color:#F7D9A0} .note.warn svg{color:var(--warn)}
.note.info{background:var(--bluebg);color:#C7DCFF} .note.info svg{color:var(--blue)}
.note.bad{background:var(--badbg);color:#FFC9C9} .note.bad svg{color:var(--bad)}
.note.ok{background:var(--acbg);color:#BDF2DE} .note.ok svg{color:var(--ac)}
.note b{color:var(--tx)}

/* Liste */
.list{background:var(--card);border-radius:var(--r);overflow:hidden;margin-bottom:12px}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);min-height:64px;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item:active{background:var(--card2)}
.chk{width:28px;height:28px;border-radius:9px;border:2px solid var(--tx3);display:flex;align-items:center;justify-content:center;flex:none}
.chk svg{width:18px;height:18px;opacity:0;stroke-width:3}
.item.sel .chk{background:var(--ac);border-color:var(--ac);color:#06281C}
.item.sel .chk svg{opacity:1}
.th{width:52px;height:52px;border-radius:12px;background:var(--card2);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:11px;font-weight:700;overflow:hidden}
.th img{width:100%;height:100%;object-fit:cover}
.sz{font-weight:700;font-size:15px;white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--card2);color:var(--tx2);margin:2px 4px 2px 0}
.badge.ok{background:var(--acbg);color:var(--ac)} .badge.warn{background:var(--warnbg);color:var(--warn)}
.badge.bad{background:var(--badbg);color:var(--bad)} .badge.blue{background:var(--bluebg);color:var(--blue)}
.grp{padding:10px 14px;background:var(--bg2);font-size:13px;color:var(--tx2);display:flex;justify-content:space-between}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px}
.stat{background:var(--card);border-radius:16px;padding:14px;text-align:left;border:1.5px solid transparent}
.stat.on{border-color:var(--ac)}
.stat b{display:block;font-size:22px}
.stat span{font-size:13px;color:var(--tx2)}

.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + var(--sb,0px));background:linear-gradient(transparent,var(--bg) 22%);display:none}
.dock.show{display:block}
.dock .in{max-width:640px;margin:0 auto;background:var(--card2);border-radius:20px;padding:12px 12px 12px 18px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.45)}

.spin{width:22px;height:22px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--ac);animation:sp 1s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}

/* Uygulama kartı */
.app{background:var(--card);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.app>.head{display:flex;gap:12px;align-items:center;padding:14px;width:100%;text-align:left}
.app img.aic{width:46px;height:46px;border-radius:12px;flex:none;background:var(--card2)}
.app .body{padding:0 14px 14px;display:none}
.app.open .body{display:block}
.risk{border-left:3px solid var(--warn);padding:6px 0 6px 12px;margin:10px 0}
.risk.l3{border-color:var(--bad)} .risk.l1{border-color:var(--tx3)}
.risk b{display:block;font-size:15px}
.risk p{font-size:14px;color:var(--tx2)}

/* Ayar satırları */
.set{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px}
.set .top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.set .top b{font-size:16.5px}
.set .top .v{color:var(--ac);font-weight:700}
input[type=range]{width:100%;height:44px;accent-color:var(--ac)}
.sw{width:58px;height:34px;border-radius:20px;background:var(--line);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;left:4px;top:4px;width:26px;height:26px;border-radius:50%;background:#fff;transition:left .2s}
.sw.on{background:var(--ac)} .sw.on::after{left:28px}
.dot{width:10px;height:10px;border-radius:50%;background:var(--bad);flex:none}
.dot.ok{background:var(--ac)} .dot.mid{background:var(--warn)}
input[type=text]{width:100%;min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit;font-size:17px;padding:0 14px}
select{min-height:46px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit;padding:0 10px;flex:1;min-width:0}

.mode{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;border:1.5px solid transparent}
.mode.last{border-color:var(--ac2)}
.mode .em{font-size:30px;width:52px;height:52px;border-radius:16px;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:none}

.steps{counter-reset:s;padding:0;margin:0;list-style:none}
.steps li{counter-increment:s;position:relative;padding:0 0 18px 46px}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:32px;height:32px;border-radius:50%;background:var(--acbg);color:var(--ac);font-weight:800;display:flex;align-items:center;justify-content:center}
.steps li.done::before{content:"✓";background:var(--ac);color:#06281C}
.steps li>b{display:block;margin-bottom:4px}
.steps p{color:var(--tx2);font-size:14.5px;margin-bottom:10px}

/* Pencere ve bildirim */
#sheetBg{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;display:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;background:var(--bg2);border-radius:24px 24px 0 0;max-height:86vh;overflow:auto;padding:20px 16px calc(20px + var(--sb,0px));transform:translateY(105%);transition:transform .22s,visibility 0s .22s;visibility:hidden}
#sheet.show{transform:none;visibility:visible;transition:transform .22s}
#sheet h4{margin:0 0 8px;font-size:21px}
#toast{position:fixed;left:16px;right:16px;bottom:24px;z-index:60;background:#2B3542;color:var(--tx);padding:14px 18px;border-radius:16px;font-size:15px;box-shadow:0 10px 30px rgba(0,0,0,.5);opacity:0;pointer-events:none;transition:opacity .2s;max-width:600px;margin:0 auto}
#toast.show{opacity:1}
.empty{text-align:center;padding:30px 10px;color:var(--tx2)}
.ring{width:84px;height:84px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-weight:800;font-size:24px}
.ring>span{width:68px;height:68px;border-radius:50%;background:var(--card);display:flex;align-items:center;justify-content:center}
.kv{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.kv:last-child{border-bottom:0} .kv span:first-child{color:var(--tx2)} .kv span:last-child{text-align:right;font-weight:600}
.mini{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.mini button{background:var(--card);border-radius:16px;padding:12px 6px;text-align:center}
.mini b{display:block;font-size:17px} .mini span{font-size:11.5px;color:var(--tx2)}
.cbar{display:flex;height:14px;border-radius:8px;overflow:hidden;background:var(--card2);margin:10px 0 12px}
.cbar i{display:block;height:100%}
.leg{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;font-size:13.5px}
.leg div{display:flex;align-items:center;gap:8px} .leg i{width:10px;height:10px;border-radius:3px;flex:none}
.search{position:relative;margin-bottom:12px} .search input{padding-left:44px}
.search svg{position:absolute;left:14px;top:16px;color:var(--tx3)}
input[type=time]{min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg2);color:var(--tx);font:inherit;font-size:22px;padding:0 14px;width:100%;color-scheme:dark}
details summary{cursor:pointer;color:var(--tx2);padding:10px 4px;font-size:14.5px}
</style>
</head>
<body>
<header id="hdr"><button id="backBtn" onclick="goBack()" aria-label="Geri"></button><h2 id="ttl">Araç Kutusu</h2></header>
<main id="view"></main>
<div class="dock" id="dock"><div class="in" id="dockIn"></div></div>
<div id="sheetBg" onclick="closeSheet()"></div>
<div id="sheet"></div>
<div id="toast"></div>
<script>
'use strict';
// ================= Simgeler =================
const IC={
  back:'<polyline points="15 18 9 12 15 6"/>',
  chev:'<polyline points="9 18 15 12 9 6"/>',
  trash:'<polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>',
  shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>',
  key:'<circle cx="7.5" cy="15.5" r="4.5"/><path d="M10.7 12.3 21 2m-4 4 3 3m-6 0 2 2"/>',
  zap:'<polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/>',
  check:'<polyline points="20 6 9 17 4 12"/>',
  x:'<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>',
  warn:'<path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>',
  info:'<circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  folder:'<path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>',
  plus:'<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>',
  search:'<circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>',
  phone:'<rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/>',
  clock:'<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>',
  grid:'<rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/>',
  eye:'<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>',
  ext:'<path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/>',
};
const ic=(n,cls)=>`<svg class="i ${cls||''}" viewBox="0 0 24 24">${IC[n]}</svg>`;
document.getElementById('backBtn').innerHTML=ic('back');

// ================= Köprü =================
const B=window.AndroidBridge||null;
let seq=0; const pend={}, prog={};
function sync(m,a){
  if(!B) return null;
  try{ return JSON.parse(B.sync(m,JSON.stringify(a||{}))); }catch(e){ return {error:String(e)}; }
}
function call(m,a,onProg){
  return new Promise(res=>{
    if(!B){ res({error:'nobridge'}); return; }
    const id='c'+(++seq); pend[id]=res; if(onProg) prog[id]=onProg;
    B.async(id,m,JSON.stringify(a||{}));
  });
}
window.__done=(id,r)=>{ const f=pend[id]; delete pend[id]; delete prog[id]; if(f) f(r); };
window.__progress=(id,t)=>{ if(prog[id]) prog[id](t); };

// ================= Yardımcılar =================
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function bytes(n){
  if(!n) return '0 B';
  const u=['B','KB','MB','GB','TB']; let i=0; n=+n;
  while(n>=1024&&i<u.length-1){n/=1024;i++;}
  return (i>=2? n.toLocaleString('tr-TR',{maximumFractionDigits:n<10?1:0}) : Math.round(n))+' '+u[i];
}
const date=t=>t?new Date(t).toLocaleDateString('tr-TR',{day:'numeric',month:'short',year:'numeric'}):'';
const b64url=s=>btoa(unescape(encodeURIComponent(s))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
let toastT;
function toast(t){ const e=$('#toast'); e.textContent=t; e.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>e.classList.remove('show'),3200); }
function openSheet(html){ $('#sheet').innerHTML=html; $('#sheetBg').style.display='block'; requestAnimationFrame(()=>$('#sheet').classList.add('show')); }
function closeSheet(){ $('#sheet').classList.remove('show'); $('#sheetBg').style.display='none'; }
const sheetOpen=()=>$('#sheet').classList.contains('show');

let INFO={};
function applyTheme(){
  let t='dark'; try{ t=JSON.parse(localStorage.getItem('ak-theme')||'"dark"'); }catch(e){}
  if(t==='system') t=matchMedia('(prefers-color-scheme: light)').matches?'light':'dark';
  document.documentElement.dataset.theme=t;
  sync('setBars',{color:t==='light'?'#F2F4F7':'#0E1116',light:t==='light'});
}
applyTheme();
try{ matchMedia('(prefers-color-scheme: light)').addEventListener('change',applyTheme); }catch(e){}
function refreshInfo(){ INFO=sync('info')||{}; }

// ================= Gezinme =================
const stack=['home'];
const TITLES={home:'Araç Kutusu',clean:'Temizlik',sec:'Güvenlik kontrolü',hidden:'Gizli ayarlar',quick:'Tek tık ayarlar',mode:'Modu düzenle',shizuku:'Shizuku kurulumu',limits:'Android\'in sınırları',device:'Telefon durumu',tools:'Araçlar',tool:'',apps:'Uygulama yöneticisi',perms:'İzin denetimi',about:'Ayarlar ve hakkında',usage:'Ekran süresi',xtips:'Xiaomi rehberi',files:'Dosya yöneticisi',checkup:'Telefon Check-up'};
let viewArg=null;
function go(v,arg){ closeSheet(); stack.push(v); viewArg=arg; render(); window.scrollTo(0,0); }
function goBack(){
  if(sheetOpen()){ closeSheet(); return true; }
  if(stack.length>1){ stack.pop(); viewArg=null; render(); window.scrollTo(0,0); return true; }
  return false;
}
window.__onBack=goBack;
window.__onResume=()=>{
  refreshInfo(); const v=stack[stack.length-1];
  if(v==='sec') checkUninstalled();
  if(v==='apps'&&AP.queue) { nextUninstall(); return; }
  if(['home','clean','sec','quick','shizuku','device','tool','about','usage','files','checkup'].includes(v)) render(true);
};
function render(soft){
  const v=stack[stack.length-1];
  $('#ttl').textContent=TITLES[v]||'';
  $('#hdr').style.display=v==='home'?'none':'flex';
  $('#backBtn').style.display=stack.length>1?'flex':'none';
  $('#dock').classList.remove('show');
  if(devTimer&&v!=='device'){ clearInterval(devTimer); devTimer=null; }
  if(v!=='tool'&&typeof stopTool==='function'&&TOOL) stopTool();
  ({home:vHome,clean:vClean,sec:vSec,hidden:vHidden,quick:vQuick,mode:vMode,shizuku:vShizuku,limits:vLimits,device:vDevice,tools:vTools,tool:vTool,apps:vApps,perms:vPerms,about:vAbout,usage:vUsage,xtips:vXtips,files:vFiles,checkup:vCheckup})[v](soft);
}
const V=h=>{ $('#view').innerHTML=h; };

// ================= Ana ekran =================
let DEV=null, devTimer=null;
function vHome(){

// ================= 1) Temizlik =================
const CL={res:null,busy:false,prog:'',tab:'large',min:100,sel:new Map()};
const TABS=[['large','Büyük dosyalar'],['dupes','Kopya fotoğraflar'],['apks','Eski APK\'lar'],['junk','Çöp dosyalar'],['oldDl','Eski indirilenler'],['shots','Eski ekran görüntüleri'],['waOld','Eski WhatsApp medyası'],['empty','Boş klasörler']];
const TABINFO={junk:'.thumbnails önbellekleri, .tmp/.log/.bak dosyaları ve 0 baytlık boş dosyalar. Silmek güvenlidir; uygulamalar gerekirse yeniden oluşturur.',
  oldDl:'İndirilenler klasöründe 90 günden eski dosyalar (APK\'lar hariç). Gerekli belgelerin olabilir, tek tek bak.',
  shots:'30 günden eski ekran görüntüleri ve ekran kayıtları (en eskiden yeniye).',
  waOld:'WhatsApp\'tan gelen veya gönderilen, 6 aydan eski fotoğraf, video, ses ve belgeler. Sohbet yedeğine dokunulmaz.'};
const CATCOL=['#4FD1A5','#6AA8FF','#C39BFF','#F5B94A','#F26D6D','#FF8FB1','#6B7686'];
function vClean(){
  if(!INFO.files){
    V(`<div class="card"><div class="row" style="margin-bottom:12px"><div class="th" style="color:var(--ac)">${ic('folder')}</div><div class="grow"><b>Dosya izni gerekli</b><p class="muted small">Dosyaları bulup silebilmem için Android'in <b>"Tüm dosyalara erişim"</b> iznini vermen lazım.</p></div></div>
      <p class="small muted" style="margin-bottom:14px">Açılan ekranda <b>Araç Kutusu</b> anahtarını aç, sonra geri tuşuyla buraya dön.</p>
      <button class="btn pri" onclick="sync('openPerm',{which:'files'})">İzni ver</button></div>
      <div class="note info">${ic('info')}<div>Uygulama internete hiçbir şey göndermez. Senin onayın olmadan hiçbir dosya silinmez.</div></div>`);
    return;
  }
  let h=`<div class="btns" style="margin-bottom:12px"><button class="btn sm" onclick="go('apps')">📦 Uygulamalar</button><button class="btn sm" onclick="go('files')">🗂️ Dosyalar</button><button class="btn sm" onclick="go('tool','compress')">🗜️ Fotoğraf küçült</button></div><div class="card"><b>Büyük dosya sınırı</b><div class="seg" style="margin:10px 0 14px">${[50,100,250,500,1024].map(m=>`<button class="${CL.min===m?'on':''}" onclick="CL.min=${m};render()">${m>=1024?'1 GB':m+' MB'}</button>`).join('')}</div>
    <button class="btn pri" ${CL.busy?'disabled':''} onclick="scanClean()">${CL.busy?'<div class="spin"></div> Taranıyor…':(CL.res?'Yeniden tara':'Taramayı başlat')}</button>
    ${CL.busy?`<p class="muted small" id="clProg" style="margin-top:10px;text-align:center">${esc(CL.prog||'Başlıyor…')}</p>`:''}</div>`;
  const r=CL.res;
  if(r&&!CL.busy){
    const sum=a=>a.reduce((s,x)=>s+x.size,0);
    const dupeCount=r.dupes.reduce((s,g)=>s+g.length-1,0);
    const st={large:[r.large.length+(r.largeTotal>r.large.length?'+':''),bytes(sum(r.large))],dupes:[dupeCount,bytes(r.dupeWaste)+' fazlalık'],apks:[r.apks.length,bytes(sum(r.apks))],empty:[r.empty.length,'klasör']};
    for(const k of ['junk','oldDl','shots','waOld']) st[k]=[(r[k]||[]).length,bytes(sum(r[k]||[]))];
    const ct=(r.cats||[]).reduce((s2,c)=>s2+c.bytes,0)||1;
    h+=`<p class="muted small" style="margin:4px 4px 12px">${r.files.toLocaleString('tr-TR')} dosya tarandı (${bytes(r.bytes)}).</p>`;
    if(r.cats) h+=`<div class="card"><b>Depolama dağılımı</b><div class="cbar">${r.cats.map((c,i)=>`<i style="width:${(c.bytes/ct*100).toFixed(2)}%;background:${CATCOL[i]}"></i>`).join('')}</div>
      <div class="leg">${r.cats.map((c,i)=>`<div><i style="background:${CATCOL[i]}"></i><span class="grow">${c.t}</span><b>${bytes(c.bytes)}</b></div>`).join('')}</div>
      <details style="margin-top:8px"><summary>En çok yer kaplayan klasörler</summary>${(r.topDirs||[]).map(d=>`<div class="kv"><span class="ellip">${esc(d.name)}</span><span>${bytes(d.bytes)}</span></div>`).join('')}</details></div>`;
    h+=`<div class="stats">${TABS.map(([k,t])=>`<button class="stat ${CL.tab===k?'on':''}" onclick="CL.tab='${k}';render()"><b>${st[k][0]}</b><span>${t}<br>${st[k][1]}</span></button>`).join('')}</div>`;
    h+=cleanList();
    h+=`<div class="note info">${ic('info')}<div class="small">Android 11'den beri hiçbir uygulama <b>Android/data</b> ve <b>Android/obb</b> klasörlerine giremez; oradaki dosyalar taranmadı. Kopya araması sadece <b>birebir aynı</b> fotoğrafları bulur; benzer ama farklı fotoğrafları bulmaz.</div></div>`;
  } else if(!CL.busy){
    h+=`<div class="note info">${ic('info')}<div class="small">Tarama hiçbir şeyi silmez. Önce listeyi görürsün, sen seçip onaylarsan silinir.</div></div>`;
  }
  V(h); dock();
}
function cleanList(){
  const r=CL.res, t=CL.tab;
  const row=(f,extra)=>{
    const sel=CL.sel.has(f.path);
    const th=f.img?`<div class="th"><img loading="lazy" src="/thumb/${b64url(f.path)}" onerror="this.remove()"></div>`
      : `<div class="th">${f.dir?ic('folder'):esc((f.name.split('.').pop()||'').slice(0,4).toUpperCase())}</div>`;
    return `<button class="item ${sel?'sel':''}" data-p="${esc(f.path)}" data-s="${f.size}" onclick="tgl(this)"><div class="chk">${ic('check')}</div>${th}
      <div class="grow"><div class="ellip" style="font-weight:600">${esc(f.name)}</div><div class="muted tiny ellip">${esc(f.rel.slice(0,-f.name.length-1)||'/')}</div>${extra||''}</div>
      <div class="sz">${f.dir?'':bytes(f.size)}</div></button>`;
  };
  let h='', acts='';
  if(t==='large'){
    if(!r.large.length) return `<div class="card empty">${CL.min>=1024?'1 GB':CL.min+' MB'}'tan büyük dosya yok.</div>`;
    acts=`<button class="btn sm" onclick="selAll('large',true)">Tümünü seç</button><button class="btn sm ghost" onclick="selAll('large',false)">Seçimi kaldır</button>`;
    h=`<div class="list">${r.large.map(f=>row(f,`<div class="muted tiny">${date(f.mtime)}</div>`)).join('')}</div>`;
    if(r.largeTotal>r.large.length) h+=`<p class="muted tiny" style="margin:0 4px 12px">En büyük ${r.large.length} dosya gösteriliyor (toplam ${r.largeTotal}).</p>`;
  } else if(t==='dupes'){
    if(!r.dupes.length) return `<div class="card empty">Birebir kopya fotoğraf bulunamadı. 👍</div>`;
    acts=`<button class="btn sm" onclick="selDupes()">Her gruptan en eskiyi koru, kalanları seç</button><button class="btn sm ghost" onclick="selAll('dupes',false)">Seçimi kaldır</button>`;
    h=r.dupes.map((g,gi)=>`<div class="list"><div class="grp"><span>Grup ${gi+1} · ${g.length} aynı fotoğraf</span><span>${bytes(g[0].size)}</span></div>${g.map((f,i)=>row(f,`<div class="tiny">${i===0?'<span class="badge ok">En eski (orijinal)</span>':'<span class="badge">Kopya</span>'} <span class="muted">${date(f.mtime)}</span></div>`)).join('')}</div>`).join('');
  } else if(t==='apks'){
    if(!r.apks.length) return `<div class="card empty">İndirilenler'de APK dosyası yok.</div>`;
    acts=`<button class="btn sm" onclick="selApks()">Zaten yüklü olanları seç</button><button class="btn sm" onclick="selAll('apks',true)">Tümünü seç</button><button class="btn sm ghost" onclick="selAll('apks',false)">Kaldır</button>`;
    const st={same:['ok','Bu sürüm yüklü'],newer:['ok','Daha yeni sürüm yüklü'],older:['warn','Yüklü sürüm daha eski'],no:['blue','Yüklü değil']};
    h=`<div class="list">${r.apks.map(f=>{
      const s=f.broken?['bad','Bozuk / eksik dosya']:st[f.installed]||['','?'];
      return row(f,`<div class="tiny">${f.app?`<b>${esc(f.app)}</b> ${esc(f.ver||'')} · `:''}<span class="badge ${s[0]}">${s[1]}</span> <span class="muted">${date(f.mtime)}</span></div>`);
    }).join('')}</div>`;
  } else if(TABINFO[t]){
    const L=r[t]||[];
    const note=`<div class="note info">${ic('info')}<div class="small">${TABINFO[t]}</div></div>`;
    if(!L.length) return note+`<div class="card empty">Bu grupta dosya yok. 👍</div>`;
    acts=`<button class="btn sm" onclick="selAll('${t}',true)">Tümünü seç</button><button class="btn sm ghost" onclick="selAll('${t}',false)">Seçimi kaldır</button>`;
    h=note.replace('class="note','style="margin-bottom:12px" class="note').replace(/^/,'')+`<div class="list">${L.map(f=>row(f,`<div class="muted tiny">${date(f.mtime)}</div>`)).join('')}</div>`;
    return `<div class="btns" style="margin-bottom:12px">${acts}</div>`+h;
  } else {
    if(!r.empty.length) return `<div class="card empty">Boş klasör yok.</div>`;
    acts=`<button class="btn sm" onclick="selAll('empty',true)">Tümünü seç</button><button class="btn sm ghost" onclick="selAll('empty',false)">Seçimi kaldır</button>`;
    h=`<div class="list">${r.empty.map(f=>row(f)).join('')}</div><p class="muted tiny" style="margin:0 4px 12px">Klasör, silme anında içinde dosya çıkarsa silinmez.</p>`;
  }
  return `<div class="btns" style="margin-bottom:12px">${acts}</div>`+h;
}
function itemsOf(tab){ const r=CL.res; return tab==='dupes'? r.dupes.flat() : r[tab]; }
function tgl(el){ const p=el.dataset.p; if(CL.sel.has(p)) CL.sel.delete(p); else CL.sel.set(p,+el.dataset.s); el.classList.toggle('sel'); dock(); }
function selAll(tab,on){ for(const f of itemsOf(tab)){ if(on) CL.sel.set(f.path,f.size); else CL.sel.delete(f.path);} render(); }
function selDupes(){ for(const g of CL.res.dupes) g.forEach((f,i)=>{ if(i===0) CL.sel.delete(f.path); else CL.sel.set(f.path,f.size); }); render(); }
function selApks(){ for(const f of CL.res.apks) if(f.installed==='same'||f.installed==='newer') CL.sel.set(f.path,f.size); render(); }
function dock(){
  const d=$('#dock');
  if(stack[stack.length-1]!=='clean'||!CL.sel.size){ d.classList.remove('show'); return; }
  let s=0; CL.sel.forEach(v=>s+=v);
  $('#dockIn').innerHTML=`<div class="grow"><b>${CL.sel.size} öğe seçili</b><div class="muted small">${bytes(s)} yer açılacak</div></div><button class="btn red sm" style="min-width:110px" onclick="confirmDel()">${ic('trash')} Sil</button>`;
  d.classList.add('show');
}
async function scanClean(){
  CL.busy=true; CL.prog=''; CL.sel.clear(); render();
  const r=await call('scanClean',{minLarge:CL.min*1048576},t=>{ CL.prog=t; const e=$('#clProg'); if(e) e.textContent=t; });
  CL.busy=false;
  if(r.error==='noaccess'){ refreshInfo(); }
  else if(r.error){ toast('Tarama hatası: '+r.error); }
  else CL.res=r;
  if(stack[stack.length-1]==='clean') render();
}
function confirmDel(){
  const all=[...CL.sel.entries()]; let s=0; all.forEach(([,v])=>s+=v);
  const name=p=>p.split('/').pop();
  openSheet(`<h4>Silinsin mi?</h4><p class="muted" style="margin-bottom:12px"><b style="color:var(--tx)">${all.length} öğe</b> silinecek, <b style="color:var(--tx)">${bytes(s)}</b> yer açılacak.</p>
    <div class="list" style="max-height:38vh;overflow:auto">${all.slice(0,60).map(([p,v])=>`<div class="item" style="min-height:48px"><div class="grow ellip small">${esc(name(p))}</div><div class="muted small">${v?bytes(v):'klasör'}</div></div>`).join('')}
    ${all.length>60?`<div class="item muted small" style="min-height:44px">…ve ${all.length-60} öğe daha</div>`:''}</div>
    <div class="note bad">${ic('warn')}<div><b>Kalıcı olarak silinir.</b> Çöp kutusuna gitmez, geri alınamaz.</div></div>
    <div class="btns"><button class="btn ghost" onclick="closeSheet()">Vazgeç</button><button class="btn red" id="delGo" onclick="doDelete()">Evet, sil</button></div>`);
}
async function doDelete(){
  const b=$('#delGo'); b.disabled=true; b.innerHTML='<div class="spin"></div> Siliniyor…';
  const paths=[...CL.sel.keys()];
  const r=await call('delete',{paths});
  closeSheet();
  if(r.error){ toast('Silme hatası: '+r.error); return; }
  const gone=new Set(r.deleted);
  const keep=f=>!gone.has(f.path);
  const R=CL.res;
  for(const k of ['large','apks','empty','junk','oldDl','shots','waOld']) if(R[k]) R[k]=R[k].filter(keep);
  R.dupes=R.dupes.map(g=>g.filter(keep)).filter(g=>g.length>1);
  R.dupeWaste=R.dupes.reduce((s,g)=>s+g[0].size*(g.length-1),0);
  gone.forEach(p=>CL.sel.delete(p));
  refreshInfo(); render();
  openSheet(`<h4>${r.failed.length?'Kısmen tamamlandı':'Tamamlandı'}</h4>
    <div class="note ok">${ic('check')}<div><b>${bytes(r.freed)}</b> yer açıldı · ${r.done} öğe silindi.<br>Şu an boş alan: <b>${bytes(r.freeBytes)}</b></div></div>
    ${r.failed.length?`<div class="note warn">${ic('warn')}<div>${r.failed.length} öğe silinemedi (başka bir uygulamaya ait veya klasörde dosya var). Seçili bırakıldı.</div></div>`:''}
    <button class="btn pri" onclick="closeSheet()">Tamam</button>`);
}

  if(!INFO.usage) h+=`<div class="card"><b>Kullanmadıklarını bulmak için izin</b><p class="muted small" style="margin:4px 0 12px">"Uzun süredir açılmayan" listesi için <b>Kullanım erişimi</b> izni gerekli. Açılan listede Araç Kutusu'nu bul ve aç. (İzin vermesen de diğer kontroller çalışır.)</p><button class="btn sm" onclick="sync('openPerm',{which:'usage'})">Kullanım erişimini ver</button></div>`;

function appCard(a){
  const lv=Math.max(...a.risks.map(x=>x.lv));
  const tag=x=>`<span class="badge ${x.lv>=3?'bad':x.lv===2?'warn':''}">${esc(x.t)}</span>`;
  const has=k=>a.risks.some(x=>x.k===k);
  const p=JSON.stringify(a.pkg).replace(/"/g,'&quot;');
  let extra='';
  if(has('a11y')) extra+=`<button class="btn sm" onclick="sync('openPerm',{which:'a11y'})">Erişilebilirliği kapat</button>`;
  if(has('admin')) extra+=`<button class="btn sm" onclick="sync('openPerm',{which:'admins'})">Yönetici yetkisini kapat</button>`;
  if(has('overlay')) extra+=`<button class="btn sm" onclick="sync('overlaySettings',{pkg:${p}})">Üstte göstermeyi kapat</button>`;
  if(has('notif')) extra+=`<button class="btn sm" onclick="sync('openPerm',{which:'notifAccess'})">Bildirim erişimini kapat</button>`;
  return `<div class="app ${SC.open===a.pkg?'open':''}" id="app-${esc(a.pkg)}">
    <button class="head" onclick="SC.open=SC.open===${p}?null:${p};render(true)"><img class="aic" src="/icon/${esc(a.pkg)}" onerror="this.style.visibility='hidden'">
      <div class="grow"><div class="row" style="gap:8px"><b class="ellip">${esc(a.label)}</b>${lv>=3?`<span class="dot"></span>`:''}</div><div>${a.risks.map(tag).join('')}</div></div>${ic('chev')}</button>
    <div class="body">
      ${a.risks.map(x=>`<div class="risk l${x.lv}"><b>${esc(x.t)}</b><p>${esc(x.why)}</p></div>`).join('')}
      <p class="muted tiny" style="margin:10px 0 14px">${esc(a.pkg)} · sürüm ${esc(a.version||'?')}<br>Kaynak: ${esc(a.installer)} · ${a.installedDays} gün önce kuruldu</p>
      <div class="btns">
        <button class="btn sm" onclick="sync('appSettings',{pkg:${p}})">${ic('ext')} Ayarlarını aç</button>
        ${a.system?'':`<button class="btn sm red" onclick="SC.pendingUn=${p};if(!sync('uninstall',{pkg:${p}}))toast('Kaldırma ekranı açılamadı')">${ic('trash')} Kaldır</button>`}
        ${extra}
      </div>
      ${a.system?`<p class="muted tiny" style="margin-top:10px">Sistem uygulaması: kaldırılamaz. "Ayarlarını aç" ekranından izinlerini kapatabilir veya devre dışı bırakabilirsin (Xiaomi izin veriyorsa).</p>`:''}
      ${has('admin')&&!a.system?`<p class="muted tiny" style="margin-top:10px">Cihaz yöneticisi açıkken Android kaldırmaya izin vermez: önce "Yönetici yetkisini kapat".</p>`:''}
    </div></div>`;
}
async function scanApps(){
  SC.busy=true; SC.prog=''; render();
  const r=await call('scanApps',{system:SC.sys,unusedDays:SC.days},t=>{ SC.prog=t; const e=$('#scProg'); if(e) e.textContent=t; });
  SC.busy=false;
  if(r.error) toast('Tarama hatası: '+r.error); else { SC.res=r; SC.filter='all'; }
  if(stack[stack.length-1]==='sec') render();
}
function checkUninstalled(){
  if(!SC.pendingUn||!SC.res) return;
  const pkg=SC.pendingUn; SC.pendingUn=null;
  if(!sync('installed',{pkg})){ SC.res.apps=SC.res.apps.filter(a=>a.pkg!==pkg); toast('Uygulama kaldırıldı'); render(true); }
}

let SH=null, SHQ='';
const trl=x=>String(x).toLocaleLowerCase('tr-TR');
function shList(){
  const q=trl(SHQ.trim()), groups={};
  SH.items.filter(it=>!q||trl(it.title+' '+it.desc+' '+it.group).includes(q)).forEach(it=>(groups[it.group]=groups[it.group]||[]).push(it));
  let h='';
  for(const g in groups) h+=`<h3>${esc(g)}</h3><div class="list">${groups[g].map(it=>`<button class="item" onclick="openSc('${it.id}')"><div class="grow"><div style="font-weight:700">${esc(it.title)}${it.id==='dev'&&!SH.devEnabled?' <span class="badge warn">Kapalı</span>':''}</div><div class="muted small">${esc(it.desc)}</div></div>${ic('chev')}</button>`).join('')}</div>`;
  return h||`<div class="card empty">"${esc(SHQ)}" ile eşleşen kısayol yok.</div>`;
}

  if(!SH){ V(`<div class="card row"><div class="spin"></div><span class="muted">Bu telefonda hangi ekranların açıldığına bakılıyor…</span></div>`); SH=await call('shortcuts'); if(stack[stack.length-1]!=='hidden') return; }

  let h=`<div class="search">${ic('search')}<input type="text" placeholder="Ayar ara (ör. pil, kilit, DNS)" value="${esc(SHQ)}" oninput="SHQ=this.value;$('#shList').innerHTML=shList()"></div>

  if(!INFO.xiaomi) h+=`<div class="note warn">${ic('warn')}<div class="small">Bu telefon Xiaomi görünmüyor; Xiaomi'ye özel kısayollar büyük ihtimalle gizlendi.</div></div>`;

  if(SH.hidden.length) h+=`<details><summary>Bu telefonda bulunamadığı için gizlenen ${SH.hidden.length} kısayol</summary><div class="list">${SH.hidden.map(it=>`<div class="item" style="min-height:52px"><div class="grow"><div class="small" style="font-weight:600">${esc(it.title)}</div><div class="muted tiny">${esc(it.group)}</div></div></div>`).join('')}</div><p class="muted tiny" style="margin:0 4px">Bu ekranlar HyperOS sürümüne göre kaldırılmış, adı değişmiş veya dışarıdan açılmaya kapatılmış olabilir.</p></details>`;

function openSc(id){

function needBtn(n){

function editSched(i){
  const L=sync('schedules')||[];

  drawSched();
}
function drawSched(){
  const DN=['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'], d=SE.days||[];
  openSheet(`<h4>${SE._i>=0?'Zamanlamayı düzenle':'Yeni zamanlama'}</h4>
    <b>Saat</b><input type="time" style="margin:8px 0 16px" value="${String(SE.h).padStart(2,'0')}:${String(SE.m).padStart(2,'0')}" onchange="const p=this.value.split(':');SE.h=+p[0];SE.m=+p[1]">
    <b>Günler</b> <span class="muted tiny">(hiçbiri seçilmezse her gün)</span><div class="seg" style="margin:8px 0 16px">${DN.map((n,k)=>`<button class="${d.includes(k+1)?'on':''}" style="min-width:54px;padding:0 10px" onclick="schDay(${k+1})">${n}</button>`).join('')}</div>
    <b>Mod</b><div class="seg" style="margin:8px 0 18px">${MD.modes.map(m=>`<button class="${SE.mode===m.id?'on':''}" onclick="SE.mode='${esc(m.id)}';drawSched()">${esc((m.emoji||'')+' '+m.name)}</button>`).join('')}</div>
    <div class="btns"><button class="btn pri" onclick="saveSched()">Kaydet</button>${SE._i>=0?`<button class="btn red sm" style="flex:0 0 auto" onclick="delSched()">Sil</button>`:''}</div>`);

function schDay(n){ const d=SE.days||(SE.days=[]); const i=d.indexOf(n); if(i>=0) d.splice(i,1); else d.push(n); d.sort(); drawSched(); }
function saveSched(){
  const L=sync('schedules')||[]; const x=Object.assign({},SE); delete x._i;
  if(SE._i>=0) L[SE._i]=x; else L.push(x);
  L.sort((a,b)=>a.h*60+a.m-(b.h*60+b.m));
  sync('saveSchedules',{list:L}); closeSheet(); toast('Zamanlama kaydedildi'); render(true);
  if(!INFO.notif) askNotif();
}
function delSched(){ const L=sync('schedules')||[]; L.splice(SE._i,1); sync('saveSchedules',{list:L}); closeSheet(); toast('Zamanlama silindi'); render(true); }
function togSched(i){ const L=sync('schedules')||[]; L[i].on=L[i].on===false; sync('saveSchedules',{list:L}); render(true); }

  let est='';
  if(b.chargeMah&&b.level>5){
    const full=Math.round(b.chargeMah*100/b.level);
    est = b.designMah? `~${full.toLocaleString('tr-TR')} mAh (tasarımın %${Math.min(100,Math.round(full/b.designMah*100))}'i)` : `~${full.toLocaleString('tr-TR')} mAh`;
  }
  const up=sy.uptimeMin||0;
  const hz=sc.maxHz&&sc.maxHz!==sc.hz?`${sc.hz} Hz (en fazla ${sc.maxHz} Hz)`:`${sc.hz||'?'} Hz`;
  const ramPct=d.ramTotal?Math.round((d.ramTotal-d.ramFree)/d.ramTotal*100):0;
  const txt=[`${sy.brand} ${sy.model} (${sy.device})`,`Android ${sy.android} (API ${sy.sdk}) ${INFO.os||''}`,`Güvenlik yaması: ${sy.patch}`,`Yapı: ${sy.build}`,`Çekirdek: ${sy.kernel}`,

    `Pil: %${b.level} · ${b.health} · ${b.temp}°C${b.cycles!==undefined?' · '+b.cycles+' döngü':''}`].join('\n');
  V(`<div class="card"><div class="row" style="margin-bottom:6px"><div class="ring" style="background:conic-gradient(${b.level>20?'var(--ac)':'var(--bad)'} ${(b.level||0)*3.6}deg,var(--card2) 0)"><span>%${b.level??'?'}</span></div>
      <div class="grow"><b style="font-size:18px">Pil</b><p class="muted small">${esc(b.status||'')}${b.plug?' · '+esc(b.plug):''}${b.fullInMin?` · ~${b.fullInMin} dk'da dolar`:''}</p></div></div>
    ${kv('Sağlık',esc(b.health))}${kv('Sıcaklık',b.temp!==undefined?b.temp.toLocaleString('tr-TR')+' °C'+(b.temp>=42?' <span class="badge bad">Sıcak</span>':''):'')}
    ${kv('Voltaj',b.voltage?(b.voltage/1000).toLocaleString('tr-TR',{maximumFractionDigits:2})+' V':'')}${kv('Anlık akım',b.currentMa!==undefined?b.currentMa+' mA':'')}
    ${kv('Şarj döngüsü',b.cycles)}${kv('Tasarım kapasitesi',b.designMah?b.designMah.toLocaleString('tr-TR')+' mAh':'')}${kv('Tahmini gerçek kapasite',est)}${kv('Teknoloji',esc(b.tech))}
    ${est?'<p class="muted tiny" style="margin-top:8px">Kapasite tahmini telefonun bildirdiği değerlerden hesaplanır; kesin ölçüm değildir.</p>':''}</div>

function nextUninstall(){
