*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}

<script>
'use strict';
/* ============================================================
   EFSANE YOLU — yandan görünümlü aksiyon-platform oyunu (deneme sürümü v1)
   Tek dosya: Canvas 2D çizim + sabit adımlı (60/sn) fizik + dokunmatik kontroller.
   Kayıt: localStorage 'efsane-yolu-v1'. Yeni alan eklerken fresh() içine varsayılan koy.
   ============================================================ */
const VER='2.0';
const BR=window.AndroidBridge||null;
const SKEY='efsane-yolu-v1';
function fresh(){return{v:1,lang:'tr',snd:1,mus:1,vib:1,gold:0,uid:2,
  inv:[{id:1,s:'w',r:0,b:0,p:0,atk:3,hp:0,crit:0,u:0}],eq:{w:1,a:0,c:0},
  lvs:[lvF(),lvF()],cur:0,kills:0}}
function lvF(){return{cp:-1,done:0,best:0,chest:[],coin:[],star:0,dth:0,rt:0}}
let SV=fresh();
try{const o=JSON.parse(localStorage.getItem(SKEY)||'null');if(o&&typeof o==='object'){const f=fresh();SV=Object.assign(f,o);if(o.lv&&!o.lvs)SV.lvs=[o.lv];delete SV.lv;SV.lvs=[0,1].map(i=>Object.assign(lvF(),(SV.lvs||[])[i]||{}));SV.eq=Object.assign({w:0,a:0,c:0},o.eq||{});if(!Array.isArray(SV.inv))SV.inv=f.inv}}catch(e){}
let CH=Math.min(1,SV.cur|0),LV=SV.lvs[CH];
function save(){try{localStorage.setItem(SKEY,JSON.stringify(SV))}catch(e){}}
const LANG=SV.lang==='en'?'en':'tr';
document.documentElement.lang=LANG;

function T(s,...a){let r=(LANG==='en'&&EN[s])||s;a.forEach((v,i)=>{r=r.split('{'+i+'}').join(v)});return r}
const $=id=>document.getElementById(id);
$('rott').textContent=T('Telefonu yan çevir');$('lj').textContent=T('ZIPLA');$('la').textContent=T('VUR');$('ld').textContent=T('KAÇ');$('ls').textContent=T('ÖZEL');
document.title=T('Efsane Yolu');
const rnd=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
const hash=(x,y)=>{let h=(x*374761393+y*668265263)|0;h=(h^(h>>>13))*1274126177|0;return((h^(h>>>16))>>>0)/4294967296};
const fmtT=s=>{s=Math.max(0,s|0);return (s/60|0)+':'+String(s%60).padStart(2,'0')};

/* ---------- ses: WebAudio ile üretilen efektler + basit döngü müzik ---------- */
let AC=null,MG=null,NB=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}

function stepBoss(){const B=G.boss;if(!B)return;B.hit=Math.max(0,B.hit-DT);B.stT-=DT;const pcx=P.x+P.w/2,bcx=B.x+B.w/2,sp=B.ph===2?1.35:1;
  if(B.st==='die'){if(Math.random()<.4)parts(B.x+rnd(0,B.w),B.y+rnd(0,B.h),3,Math.random()<.5?'#8ad860':'#a0703a',200,.6,300);if(B.stT<=0){G.boss=null;bossWon()}return}
  if(B.ph===1&&B.hp<B.mhp*.5){B.ph=2;B.st='roar';B.stT=1.2;sfx('roar');shake(10);banner(T('ÖFKELENDİ!'),'',1500);vib(60)}
  if(B.kind==='golem')aiGolem(B,pcx,bcx,sp);else switch(B.st){
    case'intro':case'roar':if(B.stT<=0){B.st='idle';B.stT=.6}break;
    case'idle':B.face=pcx<bcx?-1:1;if(B.stT<=0){const opts=['walk','slam','roots','seeds'].filter(s=>s!==B.last);const s=opts[Math.random()*opts.length|0];B.last=s;B.st=s;B.n=0;
      B.stT=s==='walk'?1.7:s==='slam'?.8/sp:s==='roots'?.3:.4}break;
    case'walk':B.face=pcx<bcx?-1:1;B.x+=B.face*75*sp*DT;B.x=clamp(B.x,L.arena.x0*TS+4,L.arena.wall*TS-B.w-4);if(B.stT<=0){B.st='idle';B.stT=.7/sp}break;
    case'slam':if(B.stT<=0){sfx('slam');shake(12);vib(70);parts(bcx,AG,26,'#b08a5a',260,.6,500,4);
      for(const d of[-1,1])PRJ.push({t:'wave',x:bcx+d*40-14,y:AG-26,w:28,h:26,vx:d*270*sp,vy:0,dmg:B.dmg*.85,life:3});
      B.st='rec';B.stT=.7/sp}break;
    case'rec':if(B.stT<=0){B.st='idle';B.stT=.6/sp}break;
    case'roots':if(B.stT<=0){if(B.n<(B.ph===2?5:3)){B.n++;PRJ.push({t:'root',x:clamp(pcx,L.arena.x0*TS+20,L.arena.wall*TS-20)-14,y:AG-78,w:28,h:78,warn:.62/Math.min(sp,1.2),act:.45,dmg:B.dmg,life:3});B.stT=.48/sp}
      else{B.st='idle';B.stT=.9/sp}}break;
    case'seeds':if(B.stT<=0){if(B.n<(B.ph===2?5:3)){B.n++;const tx=pcx+rnd(-60,60),T0=.9,vx=(tx-bcx)/T0;
        const gg=GRAV*.6,y0=B.y+10;PRJ.push({t:'seed',x:bcx-7,y:y0,w:14,h:14,vx,vy:(AG-14-y0-.5*gg*T0*T0)/T0,gg,dmg:B.dmg*.8,life:4});sfx('arrow');B.stT=.32/sp}
      else{B.st='idle';B.stT=.9/sp}}break;
  }
  const chg=B.st==='charge'&&B.n===1;if(B.st==='walk'||B.st==='idle'||B.st==='rec'||chg){if(ov(P,{x:B.x+8,y:B.y+10,w:B.w-16,h:B.h-10}))hurtP(B.dmg*(chg?1.1:.8),pcx<bcx?-1:1)}}
function bossDie(){const B=G.boss;B.dead=true;B.st='die';B.stT=1.8;sfx('roar');shake(14);vib(120);G.kills++;PRJ=PRJ.filter(q=>q.t==='coin');
  for(let i=0;i<14;i++)PICK.push({t:'coin',x:B.x+B.w/2,y:B.y+30,vx:rnd(-240,240),vy:rnd(-520,-260),age:0,v:3+(LV.done|0)});
  PICK.push({t:'item',x:B.x+B.w/2,y:B.y+20,vx:-80,vy:-420,age:0,minR:2});$('bossbar').style.display='none'}
function bossWon(){G.won=true;G.bossOn=false;for(let y=gTop();y<GT;y++){L.g[y][L.arena.gate]=0;L.g[y][L.arena.wall]=0}sfx('win');banner(T('ZAFER!'),T('Işık kapısı açıldı'),2600);musStart(lvMus())}

/* ---------- mermiler ve toplanabilirler ---------- */
function stepPrj(){for(const q of PRJ){if(q.dead)continue;q.life-=DT;if(q.life<=0){q.dead=true;continue}
  if(q.t==='arrow'){q.x+=q.vx*DT;const tx=Math.floor((q.x+(q.vx>0?q.w:0))/TS),ty=Math.floor((q.y+2)/TS);if(solid(tile(tx,ty))){q.dead=true;parts(q.x,q.y,4,'#c8a060',100,.3,200);continue}if(ov(P,q)){q.dead=true;hurtP(q.dmg,Math.sign(q.vx))}}
  else if(q.t==='wave'){q.x+=q.vx*DT;if(Math.random()<.5)parts(q.x+14,AG,1,'#b08a5a',100,.4,500);if(q.x<L.arena.x0*TS-40||q.x>L.arena.wall*TS+10)q.dead=true;else if(ov(P,q))hurtP(q.dmg,Math.sign(q.vx))}
  else if(q.t==='root'){if(q.warn>0){q.warn-=DT;if(q.warn<=0){sfx('root');shake(3);parts(q.x+14,AG,10,'#8a6a3a',200,.4,500)}}else{q.act-=DT;if(q.act<=0)q.dead=true;else if(ov(P,{x:q.x+4,y:q.y,w:q.w-8,h:q.h}))hurtP(q.dmg,P.x+9<q.x+14?-1:1)}}
  else if(q.t==='seed'){q.vy+=q.gg*DT;q.x+=q.vx*DT;q.y+=q.vy*DT;if(ov(P,q)){q.dead=true;hurtP(q.dmg,Math.sign(q.vx)||1);boom(q);continue}if(q.y+q.h>=AG){q.dead=true;boom(q)}}
  else if(q.t==='shard'){if(q.warn>0)q.warn-=DT;else{q.vy+=2200*DT;q.y+=q.vy*DT;if(ov(P,q)){q.dead=true;hurtP(q.dmg,P.x+9<q.x+7?-1:1);parts(q.x+7,q.y+20,8,'#7af0ff',160,.3,300)}else if(q.y+q.h>=AG){q.dead=true;sfx('clink');parts(q.x+7,AG,10,'#7af0ff',180,.4,400)}}}
  else if(q.t==='gem'){q.vy+=500*DT;q.x+=q.vx*DT;q.y+=q.vy*DT;if(solid(tile(Math.floor((q.x+5)/TS),Math.floor((q.y+5)/TS)))){q.dead=true;parts(q.x+5,q.y+5,5,'#7af0ff',120,.3,200)}else if(ov(P,q)){q.dead=true;hurtP(q.dmg,Math.sign(q.vx)||1)}}
  else if(q.t==='pw'){q.x+=q.vx*DT;if(Math.random()<.6)parts(q.x+q.w/2,q.y+rnd(0,q.h),1,'#bff0ff',40,.3,0);
    if(solid(tile(Math.floor((q.x+(q.vx>0?q.w:0))/TS),Math.floor((q.y+q.h/2)/TS)))){q.dead=true;parts(q.x+q.w/2,q.y+q.h/2,10,'#bff0ff',200,.3,0);continue}
    for(const e of ENS)if(!e.dead&&!q.hit.includes(e)&&ov(q,e)){q.hit.push(e);hurtE(e,q.dmg,false,Math.sign(q.vx),true)}
    const B=G.boss;if(B&&!B.dead&&!q.hit.includes(B)&&ov(q,B)){q.hit.push(B);hurtE(B,q.dmg,false,Math.sign(q.vx),true);bossbar()}
    for(const k of L.crates)if(!k.broken&&ov(q,k))breakCrate(k);
    for(const o of PRJ)if(o!==q&&!o.own&&(o.t==='arrow'||o.t==='seed'||o.t==='gem')&&!o.dead&&ov(q,o)){o.dead=true;parts(o.x,o.y,6,'#ffd27a',150,.3,0)}}}
  PRJ=PRJ.filter(q=>!q.dead)}
function boom(q){sfx('boom');shake(4);parts(q.x+7,q.y+7,16,'#ff9a3a',220,.45,200,4);parts(q.x+7,q.y+7,8,'#6ad860',160,.5,300);
  if(Math.abs(P.x+9-(q.x+7))<44&&Math.abs(P.y+P.h-(q.y+14))<44)hurtP(q.dmg,P.x+9<q.x+7?-1:1)}
function stepPick(){const pcx=P.x+P.w/2,pcy=P.y+P.h/2;
  for(const c of L.coins){if(c.got)continue;if(Math.abs(c.x-pcx)<18&&Math.abs(c.y-pcy)<24){c.got=true;LV.coin.push(L.coins.indexOf(c));addGold(1+(LV.done|0)+CH);sfx('coin');parts(c.x,c.y,5,'#ffe27a',90,.3,0)}}
  for(const k of PICK){if(k.got)continue;k.age+=DT;const dx=pcx-k.x,dy=pcy-k.y,d=Math.hypot(dx,dy);
    if(k.age>.35&&d<70){k.x+=dx/d*Math.min(d,420*DT);k.y+=dy/d*Math.min(d,420*DT);k.vx=0;k.vy=0}else{k.vy=Math.min(700,k.vy+1300*DT);k.x+=k.vx*DT;const ny=k.y+k.vy*DT,ty=Math.floor((ny+6)/TS);
      const kk=tile(Math.floor(k.x/TS),ty);if((solid(kk)||kk===2)&&k.vy>0){k.y=ty*TS-6;k.vy*=-.35;k.vx*=.7;if(Math.abs(k.vy)<40)k.vy=0}else k.y=ny;if(k.y>LH*TS+30)k.got=true}
    if(k.age>.35&&d<20){k.got=true;if(k.t==='coin'){addGold(k.v);sfx('coin')}else if(k.t==='pot')heal(.35);else if(k.t==='item')gainItem(mkItem(k.minR||0))}}
  PICK=PICK.filter(k=>!k.got);
  for(const p of L.pots)if(!p.got&&Math.abs(p.x-pcx)<18&&Math.abs(p.y-pcy)<26){p.got=true;heal(.4)}
  for(const c of L.chests)if(!c.open&&Math.abs(c.x+16-pcx)<22&&Math.abs(c.y-16-pcy)<26){c.open=true;LV.chest.push(c.id);sfx('chest');parts(c.x+16,c.y-16,24,'#ffe27a',220,.6,300);
    addGold(15*(1+(LV.done|0)));toast(T('+{0} altın',15*(1+(LV.done|0))));gainItem(mkItem(1));save()}
  L.cps.forEach((c,i)=>{if(i>LV.cp&&Math.abs(c.x+16-pcx)<30&&pcy>c.y-90&&pcy<c.y){LV.cp=i;G.cpIdx=i;LV.rt=G.run;save();sfx('cp');P.hp=P.mhp;hud();toast(T('Kontrol noktası!')+' · '+T('Can doldu'));parts(c.x+16,c.y-50,20,'#ffd65a',160,.7,-50)}});
  if(G.won&&Math.abs(L.exit.x*TS+16-pcx)<26&&pcy>L.exit.y*TS-90)win()}
function heal(f){const n=Math.round(P.mhp*f);P.hp=Math.min(P.mhp,P.hp+n);sfx('heal');ftxt(P.x+9,P.y-6,'+'+n,'#6aff8a');parts(P.x+9,P.y+15,12,'#6aff8a',100,.6,-80);hud()}

/* ---------- ölüm / zafer ---------- */
function die(){P.dead=true;LV.dth=(LV.dth|0)+1;sfx('die');vib(150);state='dead';setTimeout(()=>{if(state==='dead')showScr('dead')},900);
  parts(P.x+9,P.y+15,26,'#ff5a4a',240,.8,400,4);save()}
function win(){if(state!=='play')return;state='win';const t=G.run,first=!LV.best||t<LV.best;if(first)LV.best=t;const st=1|(t<=L.par?2:0)|(!(LV.dth|0)?4:0);G.stars=st;LV.star=(LV.star|0)|st;LV.dth=0;LV.rt=0;LV.done=(LV.done|0)+1;LV.cp=-1;LV.coin=[];LV.chest=[];save();
  G.rec=first;sfx('win');showScr('win')}

/* ---------- kamera ---------- */
const cam={x:0,y:0,w:800,h:384,k:1};
function stepCam(){let tx=P.x+P.w/2-cam.w*.5+P.face*cam.w*.1,ty=P.y+P.h/2-cam.h*.56;
  if(G.bossOn&&G.boss){const a0=L.arena.x0*TS-TS,a1=(L.arena.wall+1)*TS;tx=clamp(tx,a0,Math.max(a0,a1-cam.w))}
  tx=clamp(tx,0,LW*TS-cam.w);ty=clamp(ty,0,LH*TS-cam.h);cam.x=lerp(cam.x,tx,.1);cam.y=lerp(cam.y,ty,.08)}

/* ---------- ana döngü ---------- */
const DT=1/60;let acc=0,lastT=0;
function step(){G.t+=DT;G.run+=DT;
  for(const m of L.movers){const ox=m.x;m.x+=m.v*DT;if(m.x>m.x1){m.x=m.x1;m.v=-Math.abs(m.v)}if(m.x<m.x0){m.x=m.x0;m.v=Math.abs(m.v)}m.dx=m.x-ox}
  stepPlayer();if(state!=='play')return;stepEnemies();stepBoss();stepPrj();stepPick();stepCam();
  for(const p of PCL){p.l-=DT;p.vy+=p.g*DT;p.x+=p.vx*DT;p.y+=p.vy*DT;p.vx*=.98}PCL=PCL.filter(p=>p.l>0);
  for(const t of TXT)t.t+=DT;TXT=TXT.filter(t=>t.t<.9);for(const s of SLASH)s.t+=DT;SLASH=SLASH.filter(s=>s.t<s.d);for(const g of GHOST)g.t-=DT;GHOST=GHOST.filter(g=>g.t>0);
  ENS=ENS.filter(e=>!e.dead||false);
  G.shake*=.88;G.flash=Math.max(0,G.flash-DT);hint()}
let fpsN=0,fpsT=0,slowN=0;
function frame(t){requestAnimationFrame(frame);let dt=Math.min(.1,(t-lastT)/1000||0);lastT=t;
  fpsN++;fpsT+=dt;if(fpsT>2){const f=fpsN/fpsT;if(f<40){slowN++;if(slowN>=2&&FXQ>.5){FXQ=.5}}fpsN=0;fpsT=0}
  if(state==='play'&&!paused){acc+=dt;let n=0;while(acc>=DT&&n<6){if(G.hitStop>0)G.hitStop-=DT;else step();acc-=DT;n++}if(n>=6)acc=0;if(((t/250)|0)!==hudT){hudT=(t/250)|0;$('tm').textContent=fmtT(G.run)}}
  else if(state==='dead'){for(const p of PCL){p.l-=dt;p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt}PCL=PCL.filter(p=>p.l>0)}
  else if(state==='title'){G.t+=dt;cam.x=(cam.x+dt*40)%(120*TS);cam.y=LH*TS-cam.h}
  render(dt)}
let hudT=0;

/* ---------- çizim ---------- */
if(!CanvasRenderingContext2D.prototype.roundRect)CanvasRenderingContext2D.prototype.roundRect=function(x,y,w,h,r){r=Math.min(r,w/2,h/2);this.moveTo(x+r,y);this.arcTo(x+w,y,x+w,y+h,r);this.arcTo(x+w,y+h,x,y+h,r);this.arcTo(x,y+h,x,y,r);this.arcTo(x,y,x+w,y,r);this.closePath()};
const cv=$('cv'),c=cv.getContext('2d');let W=0,H=0,DPR=1,BG=[];
function resize(){DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  cam.k=H/(10.2*TS);cam.w=W/cam.k;cam.h=H/cam.k;mkBG();$('rot').classList.toggle('need',H>W)}
function mkBG(){BG=[];const defs=TH.bg;
  for(const[hf,col,par,amp,kind]of defs){const lw=Math.ceil(W*1.5),cvs=document.createElement('canvas');cvs.width=Math.round(lw*DPR);cvs.height=Math.round(H*DPR);const x=cvs.getContext('2d');x.scale(DPR,DPR);
    const base=H*hf,f=n=>Math.sin(n*Math.PI*2/lw*2)*amp*.5+Math.sin(n*Math.PI*2/lw*5+1)*amp*.3+Math.sin(n*Math.PI*2/lw*11+2)*amp*.15;
    x.fillStyle=col;if(kind===3){x.beginPath();x.moveTo(0,0);for(let i=0;i<=lw;i+=6)x.lineTo(i,base+f(i));x.lineTo(lw,0);x.fill();
      for(let i=0;i<46;i++){const sx=hash(i,3)*lw,sl=amp*(.6+hash(i,5)*1.8),sw=5+hash(i,8)*9,by=base+f(sx)-2;x.beginPath();x.moveTo(sx-sw,by);x.lineTo(sx,by+sl);x.lineTo(sx+sw,by);x.fill()}}
    else{x.beginPath();x.moveTo(0,H);for(let i=0;i<=lw;i+=6)x.lineTo(i,base-(kind===0?Math.abs(f(i))*1.6:f(i)));x.lineTo(lw,H);x.fill()}
    if(kind===4)for(let i=0;i<22;i++){const sx=(i+.5)*lw/22+hash(i,2)*20,by=base-f(sx)+4,h=amp*(.8+hash(i,4)*1.5),w=5+hash(i,6)*6;x.fillStyle=i%2?'#5ad8ff55':'#c88aff55';x.beginPath();x.moveTo(sx-w,by);x.lineTo(sx-w*.6,by-h*.8);x.lineTo(sx,by-h);x.lineTo(sx+w*.6,by-h*.7);x.lineTo(sx+w,by);x.fill()}
    if(kind===0&&!TH.cave){x.fillStyle='#ffffff22';for(let i=0;i<=lw;i+=6){const h=base-Math.abs(f(i))*1.6;if(Math.abs(f(i))>amp*.55)x.fillRect(i,h,6,5)}}
    if(kind===1||kind===2){x.fillStyle=TH.tree[kind-1];const n=kind===1?28:18;for(let i=0;i<n;i++){const tx=(i+.5)*lw/n+Math.sin(i*7)*10,th=base-f(tx);const s=(kind===1?16:26)*(.7+.3*Math.sin(i*3.3)+.3);
      x.beginPath();x.moveTo(tx-s*.5,th+4);x.lineTo(tx,th-s*2.2);x.lineTo(tx+s*.5,th+4);x.fill();x.beginPath();x.moveTo(tx-s*.65,th-s*.6);x.lineTo(tx,th-s*2.8);x.lineTo(tx+s*.65,th-s*.6);x.fill()}}
    BG.push({cv:cvs,lw,par})}}
function drawBG(){const g=c.createLinearGradient(0,0,0,H);g.addColorStop(0,TH.sky[0]);g.addColorStop(.45,TH.sky[1]);g.addColorStop(.8,TH.sky[2]);g.addColorStop(1,TH.sky[3]);c.fillStyle=g;c.fillRect(0,0,W,H);if(TH.sun){
  const sx=W*.72-cam.x*cam.k*.03%W,sy=H*.36;const sg=c.createRadialGradient(sx,sy,4,sx,sy,90);sg.addColorStop(0,'#fff8d8');sg.addColorStop(.25,'#ffe29a88');sg.addColorStop(1,'#ffe29a00');c.fillStyle=sg;c.fillRect(sx-90,sy-90,180,180);
  c.fillStyle='#fff6d8';c.beginPath();c.arc(sx,sy,22,0,7);c.fill()}
  const yOff=(cam.y-(LH*TS-cam.h))*cam.k;
  for(const b of BG){let ox=-((cam.x*cam.k*b.par)%b.lw);if(ox>0)ox-=b.lw;const yy=-yOff*b.par;for(let x=ox;x<W;x+=b.lw)c.drawImage(b.cv,x,yy,b.lw,H)}
  // uçan ateş böcekleri
  c.fillStyle=TH.fly;for(let i=0;i<14*FXQ;i++){const x=((i*173+G.t*(12+i%5*4))%(W+40))-20,y=H*.35+((i*97)%(H*.5))+Math.sin(G.t*1.5+i)*12;c.globalAlpha=.35+.35*Math.sin(G.t*3+i*2);c.fillRect(x,y,2.2,2.2)}c.globalAlpha=1}
function drawTiles(){const x0=Math.max(0,Math.floor(cam.x/TS)-1),x1=Math.min(LW-1,x0+Math.ceil(cam.w/TS)+2),y0=Math.max(0,Math.floor(cam.y/TS)-1),y1=Math.min(LH-1,y0+Math.ceil(cam.h/TS)+2);
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++){const k=L.g[ty][tx];if(!k)continue;const X=tx*TS,Y=ty*TS;
    if(k===1){let dep=0;while(dep<6&&tile(tx,ty-dep-1)===1)dep++;c.fillStyle=TH.dirt[dep];c.fillRect(X,Y,TS+.6,TS+.6);
      const h=hash(tx,ty);if(h>.45){c.fillStyle='#0000002a';c.fillRect(X+4+h*14,Y+8+h*10,7,5);}if(h<.25){c.fillStyle='#ffffff10';c.fillRect(X+6+h*40,Y+18,5,4)}
      if(!solid(tile(tx-1,ty))){c.fillStyle='#00000040';c.fillRect(X,Y,3,TS)}if(!solid(tile(tx+1,ty))){c.fillStyle='#00000040';c.fillRect(X+TS-3,Y,3,TS)}
      if(dep===0){c.fillStyle=TH.top[0];c.fillRect(X,Y,TS+.6,9);c.fillStyle=TH.top[1];c.fillRect(X,Y,TS+.6,5);c.fillStyle=TH.top[2];c.fillRect(X,Y,TS+.6,1.6);
        c.fillStyle=TH.top[0];for(let i=0;i<4;i++){const gx=X+i*8+hash(tx,i)*4;c.fillRect(gx,Y+9,3,2+hash(i,tx)*3)}

const ACT={
  new:()=>startRun(false),cont:()=>startRun(true),go:v=>{loadChapter(+v);startRun(false)},goc:v=>{loadChapter(+v);startRun(true)},chap:()=>{backTo=menu;showScr('chap')},
  resume:()=>{paused=false;showScr('');lastT=performance.now()},
  pause:()=>{if(state!=='play'||menu)return;paused=true;showScr('pause')},
  bag:()=>{backTo=menu;showScr('bag')},set:()=>{backTo=menu;showScr('set')},
  back:()=>showScr(backTo&&backTo!=='bag'&&backTo!=='set'?backTo:(state==='title'?'title':state==='dead'?'dead':state==='win'?'win':'pause')),
  restart:()=>{backTo='pause';showScr('confirm')},doRestart:()=>{paused=false;startRun(false)},
  home:()=>{paused=false;goTitle()},respawn:()=>{state='play';spawnAll();placeAtCp();showScr('');musStart(lvMus());lastT=performance.now()},
  tog:k=>{SV[k]=SV[k]?0:1;save();if(k==='mus'&&!SV.mus&&MUS.g){MUS.g.gain.value=0}if(k==='mus'&&SV.mus&&MUS.g)MUS.g.gain.value=.5;showScr('set')},
  lang:()=>{SV.lang=LANG==='en'?'tr':'en';save();location.reload()},
  eq:id=>{const it=itemById(+id);if(!it)return;SV.eq[it.s]=it.id;applyStats(false);save();showScr('bag')},
  sell:id=>{const it=itemById(+id);if(!it||SV.eq[it.s]===it.id)return;SV.inv=SV.inv.filter(i=>i!==it);addGold(sellP(it));toast(T('Satıldı: +{0} altın',sellP(it)));sfx('coin');save();showScr('bag')},
  up:id=>{const it=itemById(+id);if(!it)return;const k=upCost(it);if(SV.gold<k){toast(T('Yetersiz altın'));return}SV.gold-=k;it.u=(it.u|0)+1;applyStats(false);save();sfx('chest');toast(T('{0} güçlendirildi!',itName(it)));showScr('bag')}
};
function goTitle(){state='title';$('hud').style.display='none';$('ctl').style.display='none';$('bossbar').style.display='none';$('hint').classList.remove('on');hintCur='';MUS.on=false;spawnAll();cam.x=0;showScr('title')}
$('pbtn').onclick=e=>{e.stopPropagation();au();ACT.pause()};
window.__onBack=()=>{if(state==='play'&&!menu){ACT.pause();return true}if(menu==='bag'||menu==='set'||menu==='confirm'){ACT.back();return true}if(menu==='pause'){ACT.resume();return true}if(state!=='title'){goTitle();return true}return false};
window.__pause=()=>{if(state==='play'&&!menu)ACT.pause();if(AC)try{AC.suspend()}catch(e){}};
window.__resume=()=>{if(AC&&SV.snd)try{AC.resume()}catch(e){}};
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.__pause()});

/* ---------- girdi: klavye ---------- */
const KM={ArrowLeft:'l',KeyA:'l',ArrowRight:'r',KeyD:'r',Space:'j',ArrowUp:'j',KeyW:'j',KeyJ:'a',KeyX:'a',KeyK:'d',KeyL:'s',KeyV:'s',KeyC:'d',ShiftLeft:'d'};
addEventListener('keydown',e=>{if(e.code==='Escape'){window.__onBack();return}const k=KM[e.code];if(!k)return;e.preventDefault();au();if(e.repeat)return;
  if(k==='l')I.l=1;if(k==='r')I.r=1;if(k==='j'){I.jh=1;P.jb=.12}if(k==='a')P.ab=.15;if(k==='d')P.db=.12;if(k==='s')P.sb=.12});
addEventListener('keyup',e=>{const k=KM[e.code];if(k==='l')I.l=0;if(k==='r')I.r=0;if(k==='j')I.jh=0});
/* ---------- girdi: dokunmatik (çoklu dokunuş; parmak düğmeler arasında kayabilir) ---------- */
const TP=new Map();let BTN={};
function btnRects(){for(const id of['bl','br','bj','ba','bd','bs']){const r=$(id).getBoundingClientRect();BTN[id]={x:r.left+r.width/2,y:r.top+r.height/2,r:r.width/2}}}
function pickAct(x,y,cur){let best=null,bd=1e9;for(const id of['bj','ba','bd','bs']){const b=BTN[id],d=Math.hypot(x-b.x,y-b.y);if(d<bd){bd=d;best=id}}
  if(cur&&cur!==best){const b=BTN[best];if(Math.hypot(x-b.x,y-b.y)>b.r*1.05)return cur}return best}
function pressAct(id){if(id==='bj')P.jb=.12;else if(id==='ba')P.ab=.15;else if(id==='bd')P.db=.12;else if(id==='bs')P.sb=.12}
function updTouch(){let l=0,r=0,j=0;const on={};for(const t of TP.values()){if(t.z==='mv'){const mid=(BTN.bl.x+BTN.br.x)/2;if(t.x<mid-6)l=1;else if(t.x>mid+6)r=1;on[l?'bl':r?'br':'']=1}else{on[t.z]=1;if(t.z==='bj')j=1}}
  I.tl=l;I.tr=r;I.tj=j;for(const id of['bl','br','bj','ba','bd','bs'])$(id).classList.toggle('on',!!on[id])}
addEventListener('pointerdown',e=>{if(state!=='play'||menu||e.pointerType==='mouse'&&!e.isPrimary)return;if(e.target.closest&&e.target.closest('#pbtn,#scr'))return;
  if($('ctl').style.display==='none'){if(e.pointerType!=='touch')return;$('ctl').style.display='block'}
  au();btnRects();const z=e.clientX<W*.42?'mv':pickAct(e.clientX,e.clientY);TP.set(e.pointerId,{x:e.clientX,y:e.clientY,z});if(z!=='mv')pressAct(z);updTouch()},{passive:true});
addEventListener('pointermove',e=>{const t=TP.get(e.pointerId);if(!t)return;t.x=e.clientX;t.y=e.clientY;if(t.z!=='mv'){const z=pickAct(t.x,t.y,t.z);if(z!==t.z){t.z=z;pressAct(z)}}updTouch()},{passive:true});
const tEnd=e=>{if(TP.delete(e.pointerId))updTouch()};addEventListener('pointerup',tEnd);addEventListener('pointercancel',tEnd);
addEventListener('contextmenu',e=>e.preventDefault());

/* ---------- test kancaları (tarayıcı testleri için) ---------- */
window.__T={P,G,get L(){return L},SV,get LV(){return LV},get CH(){return CH},loadChapter,get ENS(){return ENS},get state(){return state},get menu(){return menu},I,tp:(tx,ty)=>{P.x=tx*TS;P.y=(ty==null?GT:ty)*TS-P.h;P.vx=P.vy=0;cam.x=P.x-cam.w/2},
  hitBoss:f=>{const B=G.boss;if(B){B.hp=Math.max(1,B.hp-B.mhp*f);bossbar()}},ACT,stats};

addEventListener('resize',()=>{resize();btnRects()});
loadChapter(CH);resize();goTitle();requestAnimationFrame(frame);
</script>
