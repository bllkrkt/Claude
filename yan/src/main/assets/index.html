let AC=null,MG=null,NB=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;try{const cp=AC.createDynamicsCompressor();cp.threshold.value=-16;cp.knee.value=12;cp.ratio.value=4;cp.attack.value=.003;cp.release.value=.22;MG.connect(cp);cp.connect(AC.destination)}catch(e){MG.connect(AC.destination)}
  NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume();if(AC){sbLoad();if(!MUS.iv)MUS.iv=setInterval(musTick,100)}}
function tone(f,d,type,v,slide,dl,dest){if(!AC)return;const t=AC.currentTime+(dl||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g);g.connect(dest||MG);o.start(t);o.stop(t+d+.03)}
function noise(d,v,fq,typ,dl){if(!AC)return;const t=AC.currentTime+(dl||0);const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=typ||'lowpass';f.frequency.value=fq||1200;
  const g=AC.createGain();g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+d+.03)}

RİN KRAKEN": "DEEP KRAKEN", "Okyanusun uyanan dehşeti": "The awakened terror of the ocean", "ZAMAN BEKÇİSİ": "TIME KEEPER", "Zamanı geri sarmak isteyen": "The one who would rewind time", "Yıldız Tacı": "Star Crown", "Kraken Pelerini": "Kraken Cloak", "Zaman Yüzüğü": "Ring of Time", "Yıldız Tilkisi": "Star Fox", "Hızlı yıldız okları atar.": "Fires quick star bolts.", "Gölge Kral'ın yenilmesinin üzerinden bir mevsim geçti. Bir gece gökyüzünden yıldızlar düşmeye başladı.": "A season has passed since the Shadow King fell. Then one night, stars began falling from the sky.", "Göğün bekçisi delirmiş! Yıldız Bahçesi'ni koruyan o, şimdi yıldızları yeryüzüne fırlatıyor.": "The sky's guardian has gone mad! The protector of the Star Garden now hurls stars at the earth.", "Göğe nasıl çıkacağım?": "How do I reach the sky?", "Mantarların gücüyle zıpla, rüzgâra güven. Yukarıda seni bulutlar taşıyacak.": "Leap with the mushrooms' power and trust the wind. Up there, the clouds will carry you.", "Yıldız Bekçisi": "Star Guardian", "Gözlerim açıldı... Beni zehirleyen ışık denizin dibinden geliyordu.": "My eyes are open... The light that poisoned me came from the bottom of the sea.", "Mercan Kıyısı'nda Derin Kraken uyandı. Okyanus ışığı yutuyor; yıldızlar bu yüzden düşüyor.": "The Deep Kraken has awoken at the Coral Coast. The ocean swallows the light; that is why the stars fall.", "Ağlarımız boş, kayıklarımız batık. Geceleri denizden sesler geliyor...": "Our nets are empty, our boats sunk. At night, sounds rise from the sea...", "Dalgaların altında devasa bir gölge kımıldadı. Derin Kraken'in gözleri suyun içinde parladı.": "A huge shadow stirred beneath the waves. The Deep Kraken's eyes glowed under the water.", "Kıyıyı ben temizleyeceğim. Ağlarınız yine dolacak!": "I'll clear the coast. Your nets will be full again!", "Kraken derinlere çekildi. Kabuğundan altın renkli bir çark düştü.": "The Kraken retreated to the depths. A golden gear fell from its shell.", "Bu çark Zaman Kalesi'nden! Biri zamanı geri sarıp Gölge Kral'ı geri getirmeye çalışıyor.": "This gear is from the Time Citadel! Someone is trying to rewind time and bring back the Shadow King.", "Zaman Kalesi her yüz yılda bir ortaya çıkar. Çarkları dönerken dünya nefesini tutar.": "The Time Citadel appears once every hundred years. While its gears turn, the world holds its breath.", "Zaman Bekçisi": "Time Keeper", "Işık çağı bir hataydı, avcı. Zamanı geri saracağım; karanlık yeniden hükmedecek!": "The age of light was a mistake, hunter. I will rewind time; darkness shall rule again!", "Geçmiş geri gelmez. Yarını ben yazacağım!": "The past won't return. I will write tomorrow!", "Çarklarım... duruyor... Demek zaman da seni seçti.": "My gears... are stopping... So time has chosen you too.", "Zaman Kalesi taşa dönüştü. Yıldızlar göğe döndü, denizler sakinleşti.": "The Time Citadel turned to stone. The stars returned to the sky and the seas grew calm.", "Avcı, artık sen bir efsanesin. Ama yol hiç bitmez; Sonsuz Yol seni bekliyor.": "Hunter, you are a legend now. But the road never ends; the Endless Road awaits you.", "İKİNCİ KİTAP SONU. Teşekkürler! Yeni maceralar yakında...": "END OF BOOK TWO. Thank you! New adventures coming soon...", "Yıldız haritası": "Star map", "Yıldız Bekçisi bin yıl göğü korudu. Düşen her yıldız onun bir gözyaşıdır, derler.": "The Star Guardian protected the sky for a thousand years. They say every falling star is one of its tears.", "Rüzgâr notu": "Wind note", "Bahçenin adaları rüzgârla yer değiştirir. Uçan harpiler bu rüzgârda doğar.": "The garden's islands drift with the wind. Flying harpies are born in this wind.", "Balıkçının günlüğü": "Fisher's journal", "Üç gecedir deniz kaynıyor. Kurbağalar kıyıya kaçtı; derinden bir şey yükseliyor.": "The sea has been boiling for three nights. The frogs fled ashore; something is rising from the deep.", "Islak parşömen": "Wet scroll", "Kraken uyuduğunda okyanus parlardı. Onu uyandıran, altın bir çarkın sesiymiş.": "When the Kraken slept, the ocean glowed. It was the sound of a golden gear that woke it.", "Saatçinin notu": "Clockmaker's note", "Zaman Kalesi'ndeki her çark bir anı saklar. En büyük çark, karanlık çağın anısıdır.": "Every gear in the Time Citadel holds a memory. The largest gear is the memory of the dark age.", "Son sayfa": "Last page", "Zaman Bekçisi bir zamanlar Gölge Kral'ın öğretmeniydi. Öğrencisinin yenilgisini kabullenemedi.": "The Time Keeper was once the Shadow King's teacher. He could not accept his student's defeat.", "Öfke": "Fury", "Canın %40 altındayken saldırı +%10": "Attack +10% while below 40% health", "Geniş Savuruş": "Wide Swing", "Kılıç menzili +%8": "Sword reach +8%", "Sarsılmaz": "Unshakable", "Hasar azaltma +%2, daha az geri savrulursun": "Damage reduction +2%, less knockback", "Delici Ok": "Piercing Arrow", "Okların %20 ihtimalle düşmanı delip geçer": "Arrows have a 20% chance to pierce through", "Keskin Nişan": "Sharp Aim", "Kritik hasarı +%12": "Crit damage +12%", "Seri Atış": "Rapid Fire", "Atış hızı +%6": "Attack speed +6%", "Büyük Küre": "Great Orb", "Büyü küresi hasarı +%12": "Magic orb damage +12%", "Alev Ustası": "Flame Master", "Patlama alanı +%12, patlamalar yakar": "Explosion area +12%, explosions burn", "Mana Akışı": "Mana Flow", "Vuruş başına enerji +%15": "Energy per hit +15%", "{0} becerileri": "{0} skills", "Gece Gezgini": "Night Walker", "Kızıl Muhafız": "Crimson Guard", "Orman Ruhu": "Forest Spirit", "Buz Prensi": "Ice Prince", "Altın Şövalye": "Golden Knight", "Yıldız Kahramanı": "Star Hero", "Zaman Yolcusu": "Time Traveler", "Efsane": "Legend", "Avcı": "Hunter", "100 düşman yen": "Defeat 100 enemies", "Kasap": "Slayer", "1000 düşman yen": "Defeat 1000 enemies", "İlk Zafer": "First Victory", "Bir boss yen": "Defeat a boss", "Boss Avcısı": "Boss Hunter", "25 kez boss yen": "Defeat bosses 25 times", "Gezgin": "Traveler", "5 bölüm bitir": "Finish 5 chapters", "Tüm bölümleri bitir": "Finish all chapters", "Yıldız Toplayıcı": "Star Collector Object.assign(EN,{"Kızıl Kanyon": "Crimson Canyon", "Ruhlar Mezarlığı": "Graveyard of Souls", "Ayna Sarayı": "Mirror Palace", "Kanyonun kumu yutar; kütüklerden ayrılma.": "The canyon sand swallows you; stay on the logs.", "Akrepler önce kuyruklarını kaldırır, sonra atılır.": "Scorpions raise their tails first, then lunge.", "Kanyon rüzgârı sert eser; zamanla.": "The canyon wind blows hard; time it.", "Kervan Rehberi Zeynep": "Caravan Guide Zeynep", "Dev Akrep yerden diken çıkarır. Toprak çatlayınca kaç!": "The Giant Scorpion bursts spikes from the ground. Dash when the earth cracks!", "Önünde Dev Akrep var. Zehrine dikkat!": "The Giant Scorpion is ahead. Beware its venom!", "Mezarlık karanlık; ışığın sadece etrafını aydınlatır.": "The graveyard is dark; your light only shows what is near.", "Ruhlar yaklaşınca dalış yapar, yana kaç.": "Spirits dive when you get close; dash aside.", "Karanlıkta yavaş ve dikkatli ilerle.": "Move slowly and carefully in the dark.", "Mezarcı Halil": "Gravedigger Halil", "Ruh Lordu ışınlanır ve ruh halkaları çağırır. Halka kapanmadan çık!": "The Soul Lord teleports and summons soul rings. Get out before the ring closes!", "Önünde Ruh Lordu var. Ruhlara dikkat!": "The Soul Lord is ahead. Beware the spirits!", "Ayna Sarayı'nda her şey yansır; gördüğüne değil, sezdiğine güven.": "Everything reflects in the Mirror Palace; trust what you sense, not what you see.", "Kraliçe tüm bekçilerin saldırılarını bilir.": "The Queen knows every guardian's attacks.", "Son saray. Tüm öğrendiklerini kullan.": "The final palace. Use everything you have learned.", "Kaçak Saray Hizmetçisi": "Runaway Palace Servant", "Kraliçe en sevdiği saldırıları sırayla dener. Sırayı öğren!": "The Queen tries her favorite attacks in turn. Learn the order!", "Önünde Ayna Kraliçesi var. Son savaş!": "The Mirror Queen is ahead. Final battle!", "DEV AKREP": "GIANT SCORPION", "Kanyonun zehirli bekçisi": "The venomous guardian of the canyon", "RUH LORDU": "SOUL LORD", "Mezarların efendisi": "Master of the graves", "AYNA KRALİÇESİ": "MIRROR QUEEN", "Yansımaların hükümdarı": "Ruler of reflections", "Akrep İğnesi": "Scorpion Stinger", "Ruh Feneri": "Soul Lantern", "Ayna Tacı": "Mirror Crown", "Ayna Şövalyesi": "Mirror Knight", "Kâbus Avcısı": "Nightmare Hunter", "Ayna Kırıcı": "Mirror Breaker", "Ayna Kraliçesi'ni yen": "Defeat the Mirror Queen", "Kâbus Ustası": "Nightmare Master", "Kâbus zorluğunda 3 bölüm bitir": "Finish 3 chapters on Nightmare", "Zaman Kalesi taşa döndükten sonra Bilge Ozan eski bir ayna buldu. Aynadaki yansıma ona gülümsemedi.": "After the Time Citadel turned to stone, the Wise Bard found an old mirror. The reflection in it did not smile back.", "Ayna Kraliçesi! Zaman Bekçisi onun piyonuymuş. Kızıl Kanyon'daki Dev Akrep, sarayının kapısını koruyor.": "The Mirror Queen! The Time Keeper was only her pawn. The Giant Scorpion of the Crimson Canyon guards her palace gate.", "O zaman kanyona gidiyorum. Kapıyı ben açacağım!": "Then I'm off to the canyon. I'll open that gate!", "Akrebin kuyruğundan bir ayna kırığı düştü. Kırıkta mor bir ışık titriyordu.": "A mirror shard fell from the scorpion's tail. A purple light flickered inside it.", "Ruhlar Mezarlığı... Kraliçe ölülerin ruhlarını aynalara hapsediyor.": "The Graveyard of Souls... The Queen is trapping the spirits of the dead in mirrors.", "Mezarlıktan her gece fısıltılar geliyor. Atalarımız rahat uyuyamıyor.": "Every night, whispers come from the graveyard. Our ancestors cannot rest.", "Mezar taşlarının üstünde soluk bir figür yükseldi: Ruh Lordu.": "A pale figure rose above the gravestones: the Soul Lord.", "Ruhları serbest bırakacağım. Atalarınız huzur bulacak.": "I will free the spirits. Your ancestors will find peace.", "Ruh Lordu": "Soul Lord", "Özgürüm... Teşekkürler, avcı. Kraliçe sarayında seni bekliyor; yansımana güvenme.": "I am free... Thank you, hunter. The Queen awaits you in her palace; do not trust your reflection.", "Ayna Sarayı. Her duvar bir yansıma, her yansıma bir tuzak.": "The Mirror Palace. Every wall a reflection, every reflection a trap.", "Ayna Kraliçesi": "Mirror Queen", "Sen yalnızca bir yansımasın, avcı. Gerçek sen benim aynamda!": "You are only a reflection, hunter. The real you is in my mirror!", "Aynalar kırılır. Ben kırılmam!": "Mirrors break. I don't!", "Aynalarım... paramparça...": "My mirrors... shattered...", "Ayna Sarayı yıkıldı; hapsedilen ruhlar göğe yükseldi.": "The Mirror Palace fell; the trapped spirits rose to the sky.", "Üç kitap, üç zafer. Efsane Yolu seninle yazıldı.": "Three books, three victories. The Legend Road was written by you.", "ÜÇÜNCÜ KİTAP SONU. Teşekkürler! Kâbus zorluğunda kendini dene.": "END OF BOOK THREE. Thank you! Test yourself on Nightmare difficulty.", "Kervan notu": "Caravan note", "Kanyonun kızıl taşları Dev Akrep'in kabuğundan kopmuş, derler.": "They say the canyon's red stones broke off the Giant Scorpion's shell.", "Kum üstüne yazı": "Writing in the sand", "Akrep sarayın kapısını bekler; anahtarı kuyruğunda taşır.": "The scorpion guards the palace gate; it carries the key in its tail.", "Mezar taşı": "Gravestone", "Burada yatan ruh, aynaya bakmayı reddettiği için özgür kaldı.": "The soul resting here stayed free because it refused to look into the mirror.", "Mezarcının defteri": "Gravedigger's notebook", "Ruh Lordu bir zamanlar bu mezarlığın bekçisiydi. Kraliçe onun da yansımasını çaldı.": "The Soul Lord was once this graveyard's keeper. The Queen stole his reflection too.", "Kırık ayna": "Broken mirror", "Kraliçe her bekçinin bir yansımasını saklar. Bu yüzden tüm saldırıları bilir.": "The Queen keeps a reflection of every guardian. That is why she knows all their attacks.", "Ayna kırıldığında yansımalar sahiplerine döner. Işık hep geri gelir.": "When the mirror breaks, reflections return to their owners. The light always comes back.", "Kolay": "Easy", "Normal": "Normal", "Kâbus": "Nightmare", "Zorluk": "Difficulty", "Zorluk: {0}": "Difficulty: {0}", "Altın Haftası": "G         if(!endless&&pgN<2&&R()<.22)page(x+3,GT,cfg.pg+pgN++);x+=n;break}
      case'pit':{const w=ri(3,5);liq(x,x+w);if(w>=5)plat(x+2,ri(8,9),2);coins(x+1,8,w-1);x+=w;fill(x,x+3,GT);x+=3;break}

const mrgCost=r=>60*(r+1)*(r+1);
const mrgOk=it=>it&&!it.lk&&it.r<4&&SV.eq[it.s]!==it.id;
function mergeItems(L3){const r=L3[0].r,ss=L3.map(i=>i.s),s=ss.every(x=>x===ss[0])?ss[0]:ss[Math.random()*3|0];
  const st=L3.every(i=>i.st&&i.st===L3[0].st)?L3[0].st:0;const n=mkItem(0,{r:r+1,s});if(st&&n.r>=2)n.st=st;n.u=Math.floor(Math.max(...L3.map(i=>i.u|0))/2);SV.inv=SV.inv.filter(i=>!L3.includes(i));SV.inv.push(n);SV.cnt=SV.cnt||{};SV.cnt.mr=(SV.cnt.mr|0)+1;dqAdd('merge',1);return n}
function autoMerge(){let n=0,spent=0;for(let r=0;r<=1;r++){for(;;){const pool=SV.inv.filter(i=>mrgOk(i)&&i.r===r);if(pool.length<3||SV.gold<mrgCost(r))break;
    const by={};for(const i of pool)(by[i.s]=by[i.s]||[]).push(i);let g=Object.values(by).find(a=>a.length>=3);const L3=g?g.slice(0,3):pool.slice(0,3);
    SV.gold-=mrgCost(r);spent+=mrgCost(r);mergeItems(L3);n++}}return[n,spent]}
function bulkUp(only){let n=0,spent=0;for(let k=0;k<200;k++){const eq=(only?[only]:SL.map(s=>itemById(SV.eq[s]))).filter(i=>i&&(i.u|0)<5);if(!eq.length)break;
    eq.sort((a,b)=>upCost(a)-upCost(b));const it=eq[0],c=upCost(it);if(SV.gold<c)break;SV.gold-=c;spent+=c;it.u=(it.u|0)+1;n++;dqAdd('up',1)}return[n,spent]}
function bestEq(){let n=0;for(const s of SL){let b=null;for(const i of SV.inv)if(i.s===s&&(!b||itScore(i)>itScore(b)))b=i;if(b&&SV.eq[s]!==b.id){SV.eq[s]=b.id;n++}}return n}
