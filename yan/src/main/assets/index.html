let AC=null,MG=null,NB=null;
function au(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();MG=AC.createGain();MG.gain.value=.55;MG.connect(AC.destination);
  NB=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate);const d=NB.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1}catch(e){AC=null}}
  if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,v,slide,dl,dest){if(!AC)return;const t=AC.currentTime+(dl||0);const o=AC.createOscillator(),g=AC.createGain();o.type=type||'square';
  o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,slide),t+d);g.gain.setValueAtTime(v||.12,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);
  o.connect(g);g.connect(dest||MG);o.start(t);o.stop(t+d+.03)}
function noise(d,v,fq,typ,dl){if(!AC)return;const t=AC.currentTime+(dl||0);const s=AC.createBufferSource();s.buffer=NB;const f=AC.createBiquadFilter();f.type=typ||'lowpass';f.frequency.value=fq||1200;
  const g=AC.createGain();g.gain.setValueAtTime(v||.2,t);g.gain.exponentialRampToValueAtTime(.0008,t+d);s.connect(f);f.connect(g);g.connect(MG);s.start(t);s.stop(t+d+.03)}

const mf=n=>440*Math.pow(2,(n-69)/12);
function musTick(){if(!AC||!SV.mus||!MUS.on)return;const spb=MUS.mode==='b'?.15:.2;
  if(!MUS.g){MUS.g=AC.createGain();MUS.g.gain.value=.5;MUS.g.connect(MG)}
  if(MUS.nt<AC.currentTime)MUS.nt=AC.currentTime+.05;
  while(MUS.nt<AC.currentTime+.3){const st=MUS.step,ch=SC[MUS.mode][(st>>4)&3],dl=MUS.nt-AC.currentTime;
    if(st%4===0)tone(mf(ch[0]-12),spb*3.5,'triangle',.11,0,dl,MUS.g);
    const arp=[0,2,1,3,2,1,3,2][st%8];if(st%2===0||MUS.mode==='b')tone(mf(ch[arp]+12),spb*1.4,'square',.018,0,dl,MUS.g);
    if(MUS.mode==='b'&&st%4===2)noise(.05,.05,5000,'highpass',dl);
    MUS.step++;MUS.nt+=spb}}
function musStart(m){MUS.mode=m||'f';MUS.on=true;if(!MUS.iv)MUS.iv=setInterval(musTick,100)}

const TRO={kok:{s:'c',b:0,n:'Kök Kalbi',pw:'nova'},golem:{s:'h',b:0,n:'Kristal Miğfer',pw:'shield'},kara:{s:'w',b:0,n:'Kara Kılıç',pw:'burn'},ejder:{s:'a',b:1,n:'Ejder Pulu Zırh',pw:'phoenix'},
  cadi:{s:'r',b:1,n:'Cadı Yüzüğü',pw:'vamp'},heykel:{s:'c',b:1,n:'Taş Göz',pw:'thunder'},kartal:{s:'b',b:2,n:'Kartal Kanadı',pw:'jump3'},mantar:{s:'r',b:2,n:'Mantar Mührü',pw:'magnet'},golge:{s:'b',b:1,n:'Gölge Adımı',pw:'dashd'},kral:{s:'w',b:2,n:'Gölge Kral Kılıcı',pw:'twin'}};
const itName=it=>(it.k&&TRO[it.k]?T(TRO[it.k].n):T(PRE[it.p|0])+' '+T(BASE[it.s][it.b|0]))+(it.u?' +'+it.u:'');
const itMul=it=>1+.12*(it.u|0);
const MAXU=15;
function rollAfx(k,r,m){switch(k){case'atk':return Math.max(1,Math.round(rnd(1.5,3)*m));case'hp':return Math.max(4,Math.round(rnd(8,14)*m));case'crit':return Math.round(rnd(2,4)+r);case'cd':return Math.round(rnd(8,15)+r*4);
  case'def':return Math.round(rnd(2,4)+r);case'spd':return Math.round(rnd(3,6)+r);case'ls':return Math.round(rnd(1,2)+r*.6);case'en':return Math.round(rnd(8,14)+r*3);case'gold':return Math.round(rnd(8,16)+r*5);default:return Math.round(rnd(6,12)+r*4)}}
function itPow(){return(1+.15*Math.min(LV.done|0,10))*(1+tier()*.5)}
function rollAx(it,m){it.ax={};const n=it.r+(it.s==='b'?0:0);const pool=AFK.filter(k=>!(it.s==='b'&&k==='spd'));if(it.s==='b')it.ax.spd=rollAfx('spd',it.r,m);
  for(let i=0;i<n&&pool.length;i++){const k=pool.splice(Math.random()*pool.length|0,1)[0];it.ax[k]=rollAfx(k,it.r,m)}}
function mkItem(minR,o){o=o||{};const hard=LV.done|0,lk=1+.1*((SV.sk||{}).luck|0);let r=0;const x=Math.random()/lk;
  r=x<.003+.002*hard?4:x<.02+.01*hard?3:x<.12+.02*hard?2:x<.4+.03*hard?1:0;r=Math.max(r,minR|0);if(o.r!=null)r=o.r;
  const s=o.s||SL[Math.random()*6|0],m=(1+r*.7)*itPow();
  const it={id:SV.uid++,s,r,b:o.b!=null?o.b:Math.random()*3|0,p:r,u:0,atk:0,hp:0,crit:0,nw:1};
  if(s==='w')it.atk=Math.round(rnd(3,6)*m);else if(s==='a')it.hp=Math.round(rnd(14,24)*m);else if(s==='h'){it.hp=Math.round(rnd(8,13)*m);it.atk=Math.round(rnd(.6,1.2)*m)}
  else if(s==='b')it.hp=Math.round(rnd(6,10)*m);else if(s==='r'){it.atk=Math.round(rnd(1.5,3)*m);it.crit=Math.round(rnd(1,3)*(1+r*.4))}else{it.crit=Math.round(rnd(2,4)*(1+r*.5));it.atk=Math.round(rnd(1,2)*m)}

  for(const s of SL){const it=itemById(SV.eq[s]);if(!it)continue;const m=itMul(it);o.atk+=it.atk*m;o.hp+=it.hp*m;o.crit+=it.crit*m;
    if(it.ax)for(const k in it.ax){const v=it.ax[k];o[k]+=(k==='atk'||k==='hp')?v*m:v}if(it.pw)o.pw[it.pw]=1}
  o.atk*=(1+.02*(lv-1))*(1+.06*(sk.str|0));o.hp*=(1+.025*(lv-1))*(1+.08*(sk.vit|0));o.crit+=2*(sk.cri|0);o.cd+=10*(sk.cri|0);o.def+=3*(sk.arm|0);o.en+=12*(sk.enj|0);o.gold+=5*(sk.luck|0);

function gainXP(n){if(state!=='play')return;n=Math.round(n);G.xpG=(G.xpG|0)+n;SV.xp=(SV.xp|0)+n;let up=0;while((SV.plv|0)<60&&SV.xp>=xpNeed(SV.plv|0)){SV.xp-=xpNeed(SV.plv|0);SV.plv=(SV.plv|0)+1;up=1}

function moveX(e,dx){if(!dx)return;e.x+=dx;const t0=Math.floor(e.y/TS),t1=Math.floor((e.y+e.h-.01)/TS);
  if(dx>0){const tx=Math.floor((e.x+e.w)/TS);for(let ty=t0;ty<=t1;ty++)if(solid(tile(tx,ty))){e.x=tx*TS-e.w-.001;e.vx=0;e.wall=1;return}}
  else{const tx=Math.floor(e.x/TS);for(let ty=t0;ty<=t1;ty++)if(solid(tile(tx,ty))){e.x=(tx+1)*TS+.001;e.vx=0;e.wall=-1;return}}}
function moveY(e,dy){const pb=e.y+e.h;e.y+=dy;e.on=false;e.onM=null;const t0=Math.floor(e.x/TS),t1=Math.floor((e.x+e.w-.01)/TS);
  if(dy>0){const ty=Math.floor((e.y+e.h)/TS);for(let tx=t0;tx<=t1;tx++){const k=tile(tx,ty);if(solid(k)||((k===2||k===6)&&pb<=ty*TS+.5)){if(k===6&&e===P)crumble(tx,ty);e.y=ty*TS-e.h;e.vy=0;e.on=true;return}}
    for(const m of L.movers)if(e.x+e.w>m.x+2&&e.x<m.x+m.w-2&&pb<=m.y+.5&&e.y+e.h>=m.y){e.y=m.y-e.h;e.vy=0;e.on=true;e.onM=m;return}}
  else if(dy<0){const ty=Math.floor(e.y/TS);for(let tx=t0;tx<=t1;tx++)if(solid(tile(tx,ty))){e.y=(ty+1)*TS;e.vy=0;return}}}
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const groundAhead=(e,dir)=>{const tx=Math.floor((dir>0?e.x+e.w+2:e.x-2)/TS),ty=Math.floor((e.y+e.h+4)/TS);const k=tile(tx,ty);return solid(k)||k===2||k===6};
function wallAhead(e,dir){const tx=Math.floor((dir>0?e.x+e.w+2:e.x-2)/TS),ty=Math.floor((e.y+e.h-4)/TS);return solid(tile(tx,ty))}

function crumble(x,y){if(L.crT.some(k=>k.x===x&&k.y===y))return;for(let d=-2;d<=2;d++){if(d&&tile(x+d,y)===6&&!L.crT.some(k=>k.x===x+d&&k.y===y)&&Math.abs(d)<=1)L.crT.push({x:x+d,y,t:.5,ph:0})}L.crT.push({x,y,t:.5,ph:0});sfx('crack')}

  if(state==='play'&&!paused){acc+=dt;let n=0;while(acc>=DT&&n<6){if(G.hitStop>0)G.hitStop-=DT;else step();acc-=DT;n++}if(n>=6)acc=0;if(((t/250)|0)!==hudT){hudT=(t/250)|0;$('tm').textContent=fmtT(G.run)}}

function mergeItems(L3){const r=L3[0].r,ss=L3.map(i=>i.s),s=ss.every(x=>x===ss[0])?ss[0]:ss[Math.random()*3|0];
  const n=mkItem(0,{r:r+1,s});n.u=Math.floor(Math.max(...L3.map(i=>i.u|0))/2);SV.inv=SV.inv.filter(i=>!L3.includes(i));SV.inv.push(n);dqAdd('merge',1);return n}
function autoMerge(){let n=0,spent=0;for(let r=0;r<=1;r++){for(;;){const pool=SV.inv.filter(i=>mrgOk(i)&&i.r===r);if(pool.length<3||SV.gold<mrgCost(r))break;
    const by={};for(const i of pool)(by[i.s]=by[i.s]||[]).push(i);let g=Object.values(by).find(a=>a.length>=3);const L3=g?g.slice(0,3):pool.slice(0,3);
    SV.gold-=mrgCost(r);spent+=mrgCost(r);mergeItems(L3);n++}}return[n,spent]}
function bulkUp(only){let n=0,spent=0;for(let k=0;k<200;k++){const eq=(only?[only]:SL.map(s=>itemById(SV.eq[s]))).filter(i=>i&&(i.u|0)<5);if(!eq.length)break;
    eq.sort((a,b)=>upCost(a)-upCost(b));const it=eq[0],c=upCost(it);if(SV.gold<c)break;SV.gold-=c;spent+=c;it.u=(it.u|0)+1;n++;dqAdd('up',1)}return[n,spent]}
function bestEq(){let n=0;for(const s of SL){let b=null;for(const i of SV.inv)if(i.s===s&&(!b||itScore(i)>itScore(b)))b=i;if(b&&SV.eq[s]!==b.id){SV.eq[s]=b.id;n++}}return n}
const better=it=>{if(SV.eq[it.s]===it.id)return false;const c=itemById(SV.eq[it.s]);return!c||itScore(it)>itScore(c)};

function dqCheck(){if(SV.dq&&SV.dq.d===today())return;const prog=ORD.filter(i=>SV.lvs[i].done).length,pool=DQT.slice(),q=[];
  for(let i=0;i<3;i++){const t=pool.splice(Math.random()*pool.length|0,1)[0],lv=Math.random()*3|0;q.push({k:t.k,t:t.a[lv],p:0,g:Math.round(60*(1+lv)*(1+prog*.5)),o:3*(1+lv),c:0})}
  SV.dq={d:today(),q,b:0};save()}
function dqAdd(k,n){dqCheck();for(const q of SV.dq.q)if(q.k===k&&q.p<q.t){q.p=Math.min(q.t,q.p+n);if(q.p>=q.t)toast(T('Günlük görev tamam: {0}',T(DQT.find(x=>x.k===k).n,q.t)))}}
const dqReady=()=>{dqCheck();return SV.dq.q.some(q=>q.p>=q.t&&!q.c)||SV.dq.q.every(q=>q.c)&&!SV.dq.b};
function dqH(){dqCheck();let h='<div class="pan"><h2>'+T('Günlük Görevler')+'</h2><p class="mut" style="text-align:center;margin:0 0 6px">'+T('Her gün yenilenir.')+'</p>';

    (q.c?'<span class="mut">'+T('Alındı')+'</span>':'<button class="'+(done?'g':'')+'" data-a="dqc" data-v="'+i+'"'+(done?'':' disabled')+'>'+T('Al')+'</button>')+'</div></div>'});
  const all=SV.dq.q.every(q=>q.c);h+='<div class="it"><div style="flex:1"><div class="nm" style="color:var(--gold)">'+T('Hepsini bitir bonusu')+'</div><div class="st">'+T('Epik eşya + 15 öz')+'</div></div><div class="bt">'+

  return h+'<button class="btn" data-a="back">'+T('Geri')+'</button></div>'}

  I.tl=l;I.tr=r;I.tj=j;for(const id of['bl','br','bj','ba','bd','bs'])$(id).classList.toggle('on',!!on[id])}
