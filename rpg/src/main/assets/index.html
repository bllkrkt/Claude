<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b0c16">
<title>Efsane Avcısı</title>
<style>
@font-face{font-family:J;font-weight:400 800;font-display:swap;src:url(fonts/jakarta-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:J;font-weight:400 800;font-display:swap;src:url(fonts/jakarta-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
:root{--bg:#0b0c16;--pan:linear-gradient(160deg,#1e2136,#15172a);--line:rgba(255,255,255,.08);--line2:rgba(255,255,255,.14);--tx:#f1f2ff;--mut:#9ca2c4;--gold:#ffcf4a;--gem:#5fe3ff;--ess:#c58bff;--red:#ff5263;--grn:#3ddc84;--hot:linear-gradient(160deg,#ff9a3d,#f0364f)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font-family:J,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden;overscroll-behavior:none}
body{background:radial-gradient(ellipse 120% 60% at 50% -10%,#2a1f55 0,transparent 60%),radial-gradient(ellipse 80% 50% at 100% 110%,#3a1420 0,transparent 60%),var(--bg)}
button{font:inherit;color:inherit;border:0;background:none;touch-action:manipulation;cursor:pointer;padding:0}
#app{position:fixed;inset:0;display:flex;flex-direction:column;max-width:520px;margin:0 auto;padding-top:env(safe-area-inset-top)}
/* ---------- üst bilgi ---------- */
#hud{display:flex;align-items:center;gap:10px;padding:8px 12px 8px 10px}
.ava{--p:0;position:relative;width:50px;height:50px;border-radius:50%;padding:3px;background:conic-gradient(#5ab0ff calc(var(--p)*1%),#ffffff14 0);flex:none}
.ava>div{width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3a3f66,#191b2e);display:grid;place-items:center;font-size:25px}
.ava b{position:absolute;bottom:-5px;left:50%;transform:translateX(-50%);background:linear-gradient(#ffd56a,#ff9a1f);color:#3a1d00;border-radius:99px;font-size:11px;font-weight:800;padding:1px 7px;box-shadow:0 2px 4px #0008;white-space:nowrap}
.hmid{flex:1;min-width:0}.hmid .t1{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.hmid .t2{font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pills{display:flex;flex-direction:column;gap:4px;align-items:flex-end}
.pill{display:flex;align-items:center;gap:4px;background:#0006;border:1px solid var(--line);border-radius:99px;padding:2px 9px 2px 6px;font-weight:800;font-size:13px;white-space:nowrap}
.pill.g{color:var(--gold)}.pill.d{color:var(--gem)}
.gear{width:40px;height:40px;border-radius:12px;background:#ffffff0d;border:1px solid var(--line);font-size:18px;flex:none}
/* ---------- genel ---------- */
main{flex:1;position:relative;min-height:0}
.scr{position:absolute;inset:0;display:none;overflow-y:auto;padding:4px 12px 16px;-webkit-overflow-scrolling:touch}
.scr.on{display:block;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
#s-battle.on{display:flex;flex-direction:column;padding:0;overflow:hidden;animation:none}
h2{font-size:20px;margin:6px 0 12px;font-weight:800}h3{font-size:12px;color:var(--mut);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.8px;font-weight:800}
.card{background:var(--pan);border:1px solid var(--line);border-radius:18px;padding:12px;margin-bottom:10px;box-shadow:0 4px 14px #0004}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:50px;padding:0 16px;border-radius:15px;background:linear-gradient(#2a2e48,#222539);border:1px solid var(--line2);font-weight:800;font-size:15px;white-space:nowrap;box-shadow:0 3px 0 #0006}
.btn.pri{background:var(--hot);border:0;box-shadow:0 4px 0 #8a1c2c}.btn.ok{background:linear-gradient(#2fbf6f,#1b8c4d);border:0;box-shadow:0 4px 0 #0e5a30}
.btn.gem{background:linear-gradient(#3fc9ec,#1f7fb8);border:0;box-shadow:0 4px 0 #134c70}.btn.ess{background:linear-gradient(#a56bff,#6b35c9);border:0;box-shadow:0 4px 0 #3d1b7a}
.btn.warn{background:linear-gradient(#6a2836,#4c1c27);border-color:#8a3345}.btn.sm{min-height:40px;font-size:13px;padding:0 12px;border-radius:12px}
.btn:disabled{opacity:.38;filter:grayscale(.6)}.btn:active:not(:disabled){transform:translateY(2px);box-shadow:0 1px 0 #0006}
.row{display:flex;gap:8px;align-items:center}.grow{flex:1;min-width:0}.mut{color:var(--mut);font-size:13px}.w100{width:100%}
.seg{display:flex;background:#0005;border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px;margin:4px 0 12px}
.seg button{flex:1;min-height:42px;border-radius:10px;font-weight:800;font-size:12.5px;color:var(--mut);white-space:nowrap}
.seg button.on{background:linear-gradient(#34385a,#272a44);color:var(--tx);box-shadow:0 2px 6px #0006}
.pbar{height:9px;border-radius:99px;background:#0008;overflow:hidden}.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#4f9cff,#7df)}
.pbar.done i{background:linear-gradient(90deg,#2fbf6f,#8ef0b0)}
/* ---------- savaş üst çubuk ---------- */
.zbar{display:flex;align-items:center;gap:6px;padding:0 10px 8px}
.zbar>button{width:44px;height:44px;border-radius:13px;background:#ffffff0d;border:1px solid var(--line);font-size:15px;flex:none}
.zbar>button:disabled{opacity:.25}
.zbar .chip{width:auto;padding:0 10px;font-size:12px;font-weight:800;color:var(--mut)}.zbar .chip.on{background:#1d5a3a;border-color:#2c8a59;color:#b6f7cd}
.zbar .zinfo{flex:1;width:auto;text-align:center;min-width:0;padding:4px 0}
#zName{font-weight:800;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:5px;justify-content:center;margin-top:5px;height:8px;align-items:center}
.dots b{width:15px;height:6px;border-radius:9px;background:#fff2}.dots b.k{background:var(--gold);box-shadow:0 0 6px var(--gold)}
.dots .bossT{font-size:11px;color:#ff7b7b;font-weight:800;letter-spacing:1px;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.4}}
/* ---------- sahne ---------- */
#stage{flex:1;position:relative;margin:0 10px;border-radius:24px;overflow:hidden;min-height:0;border:1px solid var(--line2);touch-action:manipulation;box-shadow:0 10px 30px #0008,inset 0 0 0 1px #ffffff08;isolation:isolate}
#sky,#far,#parts,#ground{position:absolute;inset:0;pointer-events:none}
#far span{position:absolute;bottom:25%;opacity:.42;filter:brightness(.55) saturate(.7) blur(.4px)}
#ground{top:auto;height:31%;background:radial-gradient(ellipse 70% 40% at 50% 0,#ffffff1c,transparent 70%),linear-gradient(#0000,var(--gnd) 28%,#0009)}
#ground::before{content:"";position:absolute;left:0;right:0;top:0;height:2px;background:linear-gradient(90deg,transparent,#ffffff30,transparent)}
#parts span{position:absolute;display:block}
.pt-fall span{top:-8%;animation:pfall linear infinite}
.pt-rise span{bottom:-4%;border-radius:50%;animation:prise linear infinite}
.pt-drift span{left:-6%;border-radius:50%;animation:pdrift linear infinite}
@keyframes pfall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(18px,280px) rotate(160deg)}100%{transform:translate(-10px,560px) rotate(330deg)}}
@keyframes prise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translate(14px,-520px);opacity:0}}
@keyframes pdrift{0%{transform:translateX(0);opacity:0}10%{opacity:.9}100%{transform:translate(520px,-30px);opacity:0}}
#top{position:absolute;left:0;right:0;top:0;padding:10px 14px 0;z-index:3;pointer-events:none;background:linear-gradient(#0008,transparent)}
#mName{text-align:center;font-weight:800;font-size:15.5px;text-shadow:0 2px 4px #000}
#mName .tag{display:inline-block;font-size:10.5px;padding:2px 7px;border-radius:99px;margin-right:6px;vertical-align:2px;letter-spacing:.6px}
.tag.boss{background:#e8334b}.tag.elite{background:#a63dff}
.hbar{position:relative;height:18px;border-radius:99px;background:#000a;overflow:hidden;margin:6px 10px 0;border:1px solid #ffffff1a}
.hbar i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
.hbar .gh{background:#fff;opacity:.75;transition:width .45s .2s}
.hbar .fg{background:linear-gradient(#ff6a6a,#e8263f);transition:width .1s}
.hbar .fg::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:#ffffff40;border-radius:99px}
.hbar.nt i{transition:none}
.hbar span{position:absolute;inset:0;display:grid;place-items:center;font-size:11px;font-weight:800;text-shadow:0 1px 2px #000}
.abar{height:4px;margin:5px 70px 0;border-radius:9px;background:#0008;overflow:hidden}.abar i{display:block;height:100%;background:#ffd54a;width:0}
#buffs{position:absolute;left:10px;top:74px;display:flex;flex-direction:column;gap:4px;z-index:3;pointer-events:none}
#buffs div{background:#000a;border:1px solid var(--line2);border-radius:99px;padding:3px 9px;font-size:12px;font-weight:800}
#combo{position:absolute;right:12px;top:72px;text-align:right;z-index:3;pointer-events:none;opacity:0;transition:opacity .2s}
#combo.on{opacity:1}#combo b{display:block;font-size:30px;font-weight:800;line-height:1;background:linear-gradient(#fff3b0,#ff9a1f);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #0009)}
#combo small{font-size:10px;font-weight:800;letter-spacing:1.5px;color:#ffd27a}#combo em{display:block;font-style:normal;font-size:11px;color:#fff;opacity:.8}
#combo.pop b{animation:cpop .15s}@keyframes cpop{50%{transform:scale(1.3)}}
#monW{position:absolute;left:0;right:0;top:21%;bottom:17%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;z-index:2}
#mon{font-size:min(33vw,145px);line-height:1;filter:drop-shadow(0 10px 8px #0008);animation:idle 2.2s ease-in-out infinite;transform-origin:50% 100%;will-change:transform}
#mon.boss{font-size:min(44vw,190px)}
#mon.elite{animation:idle 2.2s ease-in-out infinite,aura 1.2s ease-in-out infinite}
@keyframes aura{50%{filter:drop-shadow(0 0 18px #c45bff) drop-shadow(0 10px 8px #0008)}}
#mon.hit{animation:hit .17s}#mon.dead{animation:die .45s forwards}#mon.in{animation:spawn .35s cubic-bezier(.2,1.5,.4,1)}
@keyframes idle{50%{transform:scale(1.03,.97)}}
@keyframes hit{35%{transform:scale(1.12,.84) rotate(-5deg);filter:brightness(3) drop-shadow(0 10px 8px #0008)}}
@keyframes die{30%{transform:scale(1.15);filter:brightness(4)}to{transform:scale(.1) rotate(35deg) translateY(40px);opacity:0}}
@keyframes spawn{from{transform:scale(.2) translateY(-60px);opacity:0}}
#mSh{width:46%;height:16px;margin-top:-8px;border-radius:50%;background:radial-gradient(#000a,transparent 70%)}
#hero{position:absolute;left:12px;bottom:6%;display:flex;align-items:flex-end;gap:2px;z-index:2;pointer-events:none}
#heroE{position:relative;font-size:50px;line-height:1;filter:drop-shadow(0 6px 4px #0009)}
#heroE.lunge{animation:lunge .16s}@keyframes lunge{50%{transform:translate(16px,-6px) rotate(12deg)}}
#heroE.sh::after{content:"";position:absolute;inset:-12px;border-radius:50%;border:3px solid #7fe7ff;box-shadow:0 0 18px #7fe7ff,inset 0 0 18px #7fe7ff80;animation:pulse 1s infinite}
#heroE.dg{opacity:.5;filter:drop-shadow(8px 0 0 #fff4) drop-shadow(-8px 0 0 #fff2)}
#heroE.bf{filter:drop-shadow(0 0 12px #ff6a3d) drop-shadow(0 6px 4px #0009)}
@keyframes pulse{50%{transform:scale(1.08);opacity:.7}}
#petE{font-size:34px;line-height:1;filter:drop-shadow(0 4px 3px #0009)}
#petE.hop{animation:hop .3s}@keyframes hop{40%{transform:translate(10px,-18px) rotate(-12deg)}}
#loot{position:absolute;left:8px;right:8px;bottom:8px;display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none;z-index:5}
#loot div{background:#000c;border:1.5px solid;border-radius:99px;padding:5px 12px;font-size:13px;font-weight:800;animation:lootIn 2.8s forwards}
@keyframes lootIn{0%{transform:translateY(20px);opacity:0}8%,80%{transform:none;opacity:1}100%{opacity:0}}
#banner{position:absolute;left:0;right:0;top:40%;z-index:6;pointer-events:none;text-align:center;display:none}
#banner.on{display:block;animation:ban 1.6s forwards}
#banner div{display:inline-block;padding:10px 26px;font-size:23px;font-weight:800;letter-spacing:2px;background:linear-gradient(90deg,transparent,#000d 15%,#000d 85%,transparent);text-shadow:0 0 14px currentColor}
#banner.b-boss div{color:#ff6b6b}#banner.b-lv div{color:#ffd56a}#banner.b-zone div{color:#9ff0c0}
@keyframes ban{0%{transform:translateX(-100%);opacity:0}15%,80%{transform:none;opacity:1}100%{transform:translateX(100%);opacity:0}}
.shake{animation:shake .25s}@keyframes shake{25%{transform:translateX(-7px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
.bigshake{animation:bshake .35s}@keyframes bshake{20%{transform:translate(-9px,4px)}40%{transform:translate(8px,-5px)}60%{transform:translate(-6px,3px)}80%{transform:translate(4px,-2px)}}
.fl{position:absolute;font-weight:800;font-size:23px;color:#fff;text-shadow:0 2px 0 #000,0 0 6px #000,0 0 2px #000;pointer-events:none;animation:fl .85s ease-out forwards;z-index:7;white-space:nowrap}
.fl.c{font-size:34px;color:#ffe14a}.fl.c::before{content:"KRİTİK";display:block;font-size:11px;letter-spacing:2px;text-align:center;color:#ff9a1f}
.fl.sk{font-size:30px;color:#ff9a5a}.fl.pt{font-size:17px;color:#bfe3ff}.fl.p{color:#ff5263}.fl.h{color:#5df08f}.fl.g{color:var(--gold);font-size:16px}.fl.x{color:#7dd3ff;font-size:16px}.fl.m{color:#ddd;font-size:18px}.fl.d{color:var(--gem);font-size:17px}
@keyframes fl{0%{transform:translate(-50%,0) scale(.5);opacity:0}15%{transform:translate(-50%,-16px) scale(1.25);opacity:1}100%{transform:translate(-50%,-95px) scale(1);opacity:0}}
.slash{position:absolute;width:150px;height:150px;margin:-75px 0 0 -75px;pointer-events:none;z-index:6;animation:slash .28s ease-out forwards}
@keyframes slash{0%{opacity:0;transform:rotate(var(--r)) scale(.6)}30%{opacity:1}100%{opacity:0;transform:rotate(var(--r)) scale(1.15)}}
.spk{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:6;animation:spk .45s ease-out forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
.boom{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:5px solid #ffb347;pointer-events:none;z-index:6;animation:boom .45s ease-out forwards}
@keyframes boom{to{transform:scale(5);opacity:0;border-width:1px}}
.proj{position:absolute;font-size:40px;pointer-events:none;z-index:7;filter:drop-shadow(0 0 10px #fff8)}
#vig{position:fixed;inset:0;pointer-events:none;z-index:9;box-shadow:inset 0 0 90px 20px #ff000099;opacity:0;transition:opacity .4s}
#vig.on{opacity:1;animation:vig 1s infinite}@keyframes vig{50%{opacity:.45}}
/* ---------- oyuncu + yetenekler ---------- */
#pbox{padding:9px 12px 0}
.php{position:relative;height:22px;border-radius:99px;background:#000a;overflow:hidden;border:1px solid #ffffff1a}
.php i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(#5ff09a,#1fae5c);border-radius:99px;transition:width .15s}
.php i::after{content:"";position:absolute;left:0;right:0;top:0;height:45%;background:#ffffff40;border-radius:99px}
.php span{position:absolute;inset:0;display:grid;place-items:center;font-size:12px;font-weight:800;text-shadow:0 1px 2px #000}
#pSt{font-size:12px;color:var(--mut);margin-top:5px;display:flex;justify-content:space-between;white-space:nowrap;padding:0 4px}
#pSt b{color:var(--tx)}
#skills{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;padding:9px 12px 0}
.skb{position:relative;aspect-ratio:1;max-width:66px;justify-self:center;width:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#3c4170,#1c1f36);border:2px solid #ffffff22;display:grid;place-items:center;font-size:27px;overflow:hidden;box-shadow:0 4px 10px #0007}
.skb.rdy{border-color:#ffcf4a;box-shadow:0 0 12px #ffcf4a66,0 4px 10px #0007}
.skb .cd{position:absolute;inset:0;background:conic-gradient(#000b calc(var(--p,0)*1%),transparent 0);pointer-events:none}
.skb em{position:absolute;bottom:4px;left:0;right:0;text-align:center;font-style:normal;font-size:9.5px;font-weight:800;text-shadow:0 1px 2px #000,0 0 3px #000}
.skb.lk{filter:grayscale(1);opacity:.45}
.skb .n{position:absolute;top:6px;right:6px;background:#e8334b;font-size:10.5px;font-weight:800;border-radius:99px;min-width:19px;padding:1px 4px;font-style:normal;line-height:1.3}
.skb:active{transform:scale(.92)}
#bHit{margin:10px 12px 12px;height:74px;border-radius:22px;background:var(--hot);font-size:24px;font-weight:800;letter-spacing:2px;display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 6px 0 #8a1c2c,0 10px 20px #f0364f44;position:relative;overflow:hidden;flex:none}
#bHit::before{content:"";position:absolute;left:0;right:0;top:0;height:48%;background:linear-gradient(#ffffff40,#ffffff08);border-radius:22px 22px 0 0}
#bHit span{font-size:34px}#bHit:active{transform:translateY(4px);box-shadow:0 2px 0 #8a1c2c}
/* ---------- sekmeler ---------- */
#tabs{display:grid;grid-template-columns:repeat(5,1fr);background:#121426e6;border-top:1px solid var(--line);padding:4px 4px calc(4px + env(safe-area-inset-bottom));backdrop-filter:blur(8px)}
#tabs button{position:relative;padding:6px 0 5px;font-size:22px;display:flex;flex-direction:column;align-items:center;gap:1px;border-radius:14px;color:var(--mut)}
#tabs button.on{background:linear-gradient(#2c3054,#22253f);color:var(--gold)}#tabs button.on>span{animation:bounce .35s}
@keyframes bounce{40%{transform:translateY(-5px) scale(1.15)}}
#tabs small{font-size:10.5px;font-weight:800}
.dot{position:absolute;top:2px;right:16%;min-width:18px;height:18px;border-radius:9px;background:var(--red);color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center;padding:0 5px;box-shadow:0 0 0 2px #121426;font-style:normal}
.dot[hidden]{display:none}
/* ---------- çanta ---------- */
.eqg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.slot{position:relative;background:var(--pan);border:2px solid var(--line);border-radius:16px;padding:8px 4px;text-align:center;min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;overflow:hidden}
.slot .e{font-size:32px;line-height:1.1;filter:drop-shadow(0 3px 3px #0008)}.slot.empty .e{opacity:.22;filter:grayscale(1)}
.slot small{font-size:10.5px;color:var(--mut);font-weight:800;line-height:1.15;display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 3px;position:relative;z-index:1}
.slot .u,.it .u{position:absolute;top:3px;left:5px;font-size:11px;font-weight:800;color:#fff;text-shadow:0 1px 2px #000;z-index:2}
.filt{display:flex;gap:6px;overflow-x:auto;margin:8px -12px 8px;padding:0 12px;scrollbar-width:none}
.filt button{flex:none;min-width:44px;height:38px;padding:0 10px;border-radius:12px;background:#ffffff0d;border:1px solid var(--line);font-size:17px;font-weight:800}
.filt button.on{background:#ffcf4a22;border-color:var(--gold)}
.invg{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.it{position:relative;aspect-ratio:1;border-radius:14px;border:2px solid;display:grid;place-items:center;font-size:28px;overflow:hidden}
.it>span:first-child,.slot .e{position:relative;z-index:1}
.it .up{position:absolute;bottom:1px;left:4px;font-size:11px;color:var(--grn);font-weight:800;z-index:2}
.it .st{position:absolute;top:1px;right:3px;font-size:12px;z-index:2}.slot .st{position:absolute;top:3px;right:5px;font-size:13px;z-index:2}
.it .l{position:absolute;bottom:1px;right:5px;font-size:9.5px;color:#fffc;font-weight:800;z-index:2}
.it .lk{position:absolute;bottom:1px;left:17px;font-size:10px;z-index:2}
.it.empty{border:2px dashed var(--line);background:none}

  case'gold':return 4+Math.min(L,200)*.04;case'ls':return .6+Math.min(L,200)*.004}}
function makeItem(L,r,slot,setK){slot=slot||pick(SLOTS).k;const d=SLOT[slot],st={};
  const add=(k,f)=>{const v=statBase(k,L)*f*RAR[r].m*rnd(.85,1.15);st[k]=STAT[k].p?Math.round(v*10)/10:Math.max(1,Math.round(v))};
  (d.pri||[[pick(['crit','critDmg','gold','ls']),1],['hp',.3]]).forEach(p=>add(p[0],p[1]));
  const pool=Object.keys(STAT).filter(k=>!(k in st)).sort(()=>Math.random()-.5);
  for(let i=0;i<r&&pool.length;i++){const k=pool.pop();add(k,STAT[k].p?.5:.35)}
  const b=pick(d.names);
  const it={id:S.nextId++,slot,r,L,up:0,n:pick(PRE[r])+' '+b[1],e:b[0],st};if(setK||(r>=2&&Math.random()<(r===3?.6:.35)))it.set=setK||pick(Object.keys(SETS));return it}

  const z=MUS[S.zone%MUS.length],st=60000/z.tp/2;musNext=now+st;const i=musI++%32,n=z.sc.length;

function upPlan(risky,run){let g=S.gold,e=S.ess,n=0,ok=0,g0=g,e0=e;const lv={};const its=SLOTS.map(s=>S.eq[s.k]).filter(Boolean);its.forEach(it=>lv[it.id]=it.up);
  for(let k=0;k<600;k++){let best=null,bc=null;for(const it of its){const u=run?it.up:lv[it.id];if(u>=UPMAX||(!risky&&u>=5))continue;const c=upCost(Object.assign({},it,{up:u}));if(c.g>g||c.e>e)continue;if(!best||c.g<bc.g){best=it;bc=c}}
    if(!best)break;n++;g-=bc.g;e-=bc.e;if(run){if(doForge(best))ok++}else{lv[best.id]++;ok++}}
  return {n,ok,g:g0-g,e:e0-e}}

    updAll();itemSheet(it);save()},
  bulk:()=>{const fs=bulkF();
    const row=(k,t)=>{const a=S.inv.filter(fs[k]);return '<div class="card"><b>'+t+' ('+a.length+')</b><div class="row" style="margin-top:8px"><button class="btn sm warn grow" data-a="bulkDo" data-v="s'+k+'" '+(a.length?'':'disabled')+'>Sat · 💰 '+fmt(a.reduce((x,i)=>x+price(i),0))+'</button><button class="btn sm ess grow" data-a="bulkDo" data-v="m'+k+'" '+(a.length?'':'disabled')+'>Erit · 💠 '+fmt(a.reduce((x,i)=>x+meltV(i),0))+'</button></div></div>'};
    openSheet('<h2>🧹 Toplu işlem</h2><p class="mut">Epik, Efsanevi, geliştirilmiş (+) ve 🔒 kilitli eşyalara dokunulmaz.</p>'+row(0,'Sıradanlar')+row(1,'Kuşandığımdan zayıf Sıradan + Nadir')+row(2,'Tüm Sıradan + Nadir')+'<button class="btn w100" data-a="close">Vazgeç</button>')},
  bulkDo:v=>{const f=bulkF()[+v[1]],melt=v[0]==='m';
    const s=S.inv.filter(f);s.forEach(unsock);S.inv=S.inv.filter(i=>!f(i));
    if(melt){const e=s.reduce((x,i)=>x+meltV(i),0);S.ess+=e;toast(s.length+' eşya eritildi · +'+fmt(e)+' 💠')}else{const g=s.reduce((x,i)=>x+price(i),0);S.gold+=g;toast(s.length+' eşya satıldı · +'+fmt(g)+' 💰')}
    closeSheet();beep(880,.1,'triangle',.05);updAll();save()},
  stat:v=>{if(S.pts<=0)return;S.pts--;S.st[v]++;const old=P.hp;calc();if(P.hp>old)S.hp+=P.hp-old;beep(700,.08,'triangle',.05);updAll();save()},
  heroSeg:v=>{heroSeg=v;renderHero()},
  skUp:v=>{const i=+v,c=skCost(S.skl[i]);if(S.gold<c||S.skl[i]>=20)return;S.gold-=c;S.skl[i]++;tune([600,900],70);toast('✨ '+CLS[S.cls].sk[i].n+' Sv '+S.skl[i]);updAll();save()},
  petFeed:()=>{const l=S.pets[S.pet],c=petCost(l);if(S.gold<c||l>=30)return;S.gold-=c;hpKeep(()=>{S.pets[S.pet]=l+1});
    if(petStage(l+1)>petStage(l)){confetti(70);tune([523,659,784,1047,1319],90);vib([40,40,120]);toast('🌟 Evrim! '+PET[S.pet].e+' '+pName(S.pet),'big');if(D3)D3.levelUp()}else{tune([500,750],70);toast('🍖 '+pName(S.pet)+' Sv '+(l+1))}updAll();save()},
  petSel:v=>{if(!S.pets[v])return;hpKeep(()=>{S.pet=v});toast(PET[v].e+' '+PET[v].n+' artık yanında');updAll();save()},
  petBuy:v=>{const p=PET[v];if(S.pets[v]||!p.gem||S.gems<p.gem)return;S.gems-=p.gem;S.pets[v]=1;hpKeep(()=>{S.pet=v});confetti(40);tune([523,659,784,1047],80);toast('🐾 Yeni yoldaş: '+p.e+' '+p.n,'big');updAll();save()},
  clsChange:()=>{if(!S.cls)return classSheet();openSheet('<h2>Sınıf değiştir</h2><p class="mut">Eşyaların, seviyen ve statların korunur; yeteneklerin yeni sınıfa göre değişir (yetenek seviyeleri korunur).</p><div class="row"><button class="btn grow" data-a="close">Vazgeç</button><button class="btn gem grow" data-a="clsChangeOk" '+(S.gems<100?'disabled':'')+'>💎 100 ile değiştir</button></div>')},
  clsChangeOk:()=>{if(S.gems<100)return;S.gems-=100;S.cls=null;classSheet()},
  pickCls:v=>{hpKeep(()=>{S.cls=v});S.seen=true;R.cd=[0,0,0,0];closeSheet();renderSkillBar();updAll();banner(CLS[v].e+' '+CLS[v].n.toLocaleUpperCase('tr'),'lv');confetti(40);save(true);
    S.nv=7;if(!S.daily.claimed&&!Q.includes(loginSheet))enqueue(loginSheet);storyCheck()},
  set:v=>{S.set[v]=!S.set[v];if(v==='vib')vib(40);if(v==='sound')beep(660,.1,'triangle',.06);ACT.settings();save()},
  buyPot:v=>{const n=+v,p=potPrice()*n;if(S.gold<p)return;S.gold-=p;S.potions+=n;beep(600,.1,'triangle',.05);toast('🧪 +'+n+' iksir');updAll();renderSkillBar();save()},
  chest:v=>{const c=CHESTS[v];if(!c.p)return;const p=c.p(gBest());if(S.gold<p)return;if(S.inv.length>=INV_MAX){toast('🎒 Çanta dolu — önce eşya sat');return}S.gold-=p;openChest(+v)},
  chestGem:v=>{const c=CHESTS[v];if(S.gems<c.gem)return;if(S.inv.length>=INV_MAX){toast('🎒 Çanta dolu — önce eşya sat');return}S.gems-=c.gem;openChest(+v)},
  gemGold:()=>{if(S.gems<10)return;S.gems-=10;const g=Math.round(gpk(gBest())*60);S.gold+=g;toast('+'+fmt(g)+' 💰','big');updAll();save()},
  gemEss:()=>{if(S.gems<15)return;S.gems-=15;S.ess+=40;toast('+40 💠','big');updAll();save()},
  claimLogin:()=>claimLogin(),
  arena:()=>startArena(),
  dung:v=>startDung(v),
  dungDone:()=>{closeSheet();spawn();updAll()},
  duel:v=>startDuel(+v),
  duelDone:()=>{closeSheet();spawn();updAll()},
  oppNew:()=>{genOpps();renderAdv();toast('🔄 Yeni rakipler geldi')},
  invSeg:v=>{invSeg=v;renderInv();if(D3)vitrin()},
  runeMerge:()=>{let n=0;for(let l=1;l<5;l++)for(const t in RUNES){const k=t+':'+l;while((S.runes[k]||0)>=3){S.runes[k]-=3;giveRune(t+':'+(l+1),1);n++}}
    for(const k in S.runes)if(!S.runes[k])delete S.runes[k];if(n){tune([660,880,1320],70);confetti(30);toast('✨ '+n+' birleştirme yapıldı','big')}renderInv();save()},
  sockPick:v=>{const [id,i]=v.split('|'),it=findAny(id);if(!it)return;const ks=Object.keys(S.runes).filter(k=>S.runes[k]>0).sort((a,b)=>b.split(':')[1]-a.split(':')[1]||a.localeCompare(b));
    openSheet('<h2>🔮 Rün seç</h2><p class="mut">'+it.e+' '+esc(iName(it))+' · '+(+i+1)+'. yuva</p>'+(ks.length?ks.map(k=>'<button class="btn w100" style="margin-bottom:8px;justify-content:space-between;border-color:'+RUNES[k.split(':')[0]].c+'" data-a="sockSet" data-v="'+id+'|'+i+'|'+k+'"><span>'+runeLbl(k)+' ×'+S.runes[k]+'</span><span class="mut">'+runeVal(k)+'</span></button>').join(''):'<div class="note">Hiç rünün yok. Boss\'lar, elitler ve 🔮 Rün Tapınağı rün düşürür.</div>')+'<button class="btn w100" data-a="item" data-v="'+id+'">Geri</button>')},
  sockSet:v=>{const [id,i,k]=v.split('|'),it=findAny(id);if(!it||!(S.runes[k]>0))return;const sk=sockOf(it);hpKeep(()=>{if(sk[i])giveRune(sk[i],1);sk[i]=k;S.runes[k]--;if(!S.runes[k])delete S.runes[k]});tune([660,990],60);toast('🔮 '+runeLbl(k)+' takıldı');updAll();itemSheet(it);save()},
  unsock:v=>{const [id,i]=v.split('|'),it=findAny(id);if(!it)return;const sk=sockOf(it);if(!sk[i])return;hpKeep(()=>{giveRune(sk[i],1);sk[i]=null});updAll();itemSheet(it);save()},
  gemRune:()=>{if(S.gems<25)return;S.gems-=25;const got=[];for(let i=0;i<3;i++){const k=rollRune(.05);giveRune(k,1);got.push(runeLbl(k))}toast('🔮 '+got.join(' · '),'big');confetti(25);updAll();save()},
  gemKey:()=>{if(S.gems<20)return;S.gems-=20;for(const k in S.dung.left)S.dung.left[k]++;toast('🗝️ Her zindana +1 hak','big');updAll();save()},
  aa:()=>{if(!aaOpen()){toast('🔒 Oto saldırı, ilk boss\'u (Orman 10. kat) yenince açılır');return}aaSheet()},
  aaTog:()=>{S.autoAtk=!S.autoAtk;updBattle();aaSheet();save()},
  aaSp:v=>{const t=AAS[+v];if(!t||!aaTierOk(t))return;S.aaSp=+v;S.autoAtk=true;updBattle();aaSheet();save()},
  as:()=>{if(!asOpen()){toast('🔒 Oto yetenek 15. seviyede açılır');return}S.autoSk=!S.autoSk;toast(S.autoSk?'✨ Oto yetenek açık':'✨ Oto yetenek kapalı');updBattle();save()},
  skin:v=>{const k=SKINS.find(x=>x.k===v);if(!k)return;if(!S.skins[v]){if(S.gems<k.gem){toast('💎 Yeterli elmas yok ('+k.gem+' gerekli)');return}S.gems-=k.gem;S.skins[v]=1;confetti(40);tune([523,659,784,1047],80);toast('🎨 Yeni kostüm: '+k.e+' '+k.n,'big')}S.skin=v;updAll();save()},
  arenaDone:()=>{closeSheet();spawn();updAll()},
  reb:()=>{const g=soulGain();if(!g)return;const kept=S.inv.concat(Object.values(S.eq)).filter(i=>i&&i.lk).length;
    openSheet('<div style="text-align:center"><div style="font-size:56px">🌀</div><h2>Yeniden doğmak istiyor musun?</h2></div><p class="mut">Seviye 1\'den, Orman '+(1+5*(S.reb.up.start||0))+'. kattan başlarsın. Altın, öz ve eşyalar silinir.<br>Korunan: sınıf, elmas, yoldaşlar, yetenek seviyeleri, başarımlar ve 🔒 kilitli '+Math.min(6,kept)+' eşya'+(kept>6?' (en güçlü 6 tanesi)':'')+'.</p><div class="note">Kazanacağın: <b style="color:var(--gold)">+'+g+' 🔮 Ruh Taşı</b> → Ruh Ağacı\'nda kalıcı güç</div><div class="row"><button class="btn grow" data-a="close">Vazgeç</button><button class="btn pri grow" data-a="rebOk">🌀 Yeniden doğ</button></div>')},
  rebOk:()=>rebirth(),
  soulUp:v=>{const s=SOUL.find(x=>x.k===v),l=S.reb.up[v]||0,c=soulCost(l);if(!s||l>=s.max||S.reb.souls<c)return;S.reb.souls-=c;hpKeep(()=>{S.reb.up[v]=l+1});tune([600,900],70);toast(s.i+' '+s.n+' '+(l+1)+'/'+s.max);updAll();save()},
  set3d:()=>{S.set.d3=!S.set.d3;save(true);location.reload()},
  qClaim:v=>{const q=S.daily.q[+v];if(!q||q.c||q.p<q.n)return;q.c=true;const g=qGold();S.gold+=g;S.gems+=8;tune([523,784],80);toast('+'+fmt(g)+' 💰 · +8 💎','big');updAll();save()},
  qBonus:()=>{const D=S.daily;if(D.bonus||!D.q.every(q=>q.c))return;D.bonus=true;S.gems+=15;toast('+15 💎','big');confetti(50);openChest(1,true);updAll();save()},
  achClaim:v=>{const a=ACH.find(x=>x.k===v),t=achTier(a);if(t>=a.t.length||ACHV[a.k]()<a.t[t])return;S.ach[a.k]=t+1;S.gems+=a.g[t];confetti(40);tune([523,659,784,1047],80);toast('🏆 '+a.n+' · +'+a.g[t]+' 💎','big');updAll();save()},
  offTake:v=>{const o=offPend;if(!o)return;const m=+v;if(m===2){if(S.gems<15)return;S.gems-=15}offPend=null;
    S.gold+=o.gold*m;S.tot.gold+=o.gold*m;S.ess+=o.ess*m;closeSheet();addXp(o.xp*m);toast('+'+fmt(o.gold*m)+' 💰 · +'+fmt(o.xp*m)+' XP','big');fxCoins(8);updAll();save()},
  zone:v=>{v=+v;if(!S.maxF[v]){toast('🔒 Bu bölge henüz kilitli');return}if(dead||busyMode())return;S.zone=v;S.kills=0;closeSheet();setStage();spawn();go('battle');banner(ZONES[v].e+' '+ZONES[v].n.toLocaleUpperCase('tr'),'zone');storyCheck();save()},
  settings:()=>openSheet('<h2>⚙️ Ayarlar</h2><div class="row"><button class="btn grow" data-a="set" data-v="sound">'+(S.set.sound?'🔊 Ses açık':'🔇 Ses kapalı')+'</button><button class="btn grow" data-a="set" data-v="vib">'+(S.set.vib?'📳 Titreşim açık':'📴 Titreşim kapalı')+'</button></div>'+
    '<button class="btn w100" style="margin-top:8px" data-a="set3d">'+(S.set.d3?(D3?'🧊 3B grafik açık':'🧊 3B açık ama bu cihaz desteklemiyor'):'🖼️ 2B grafik (yavaş telefonlar için)')+'</button>'+
    '<button class="btn w100" style="margin-top:8px" data-a="set" data-v="music">'+(S.set.music?'🎵 Müzik açık':'🎵 Müzik kapalı')+'</button>'+
    '<h3>Macera</h3><div class="card"><div class="dg">'+[['☠️ Öldürülen',S.tot.kills],['👑 Boss',S.tot.boss],['💀 Elit',S.tot.elite],['✨ Efsanevi',S.tot.leg],['🎯 Kritik',S.tot.crits],['👆 Dokunuş',S.tot.taps],['🔥 En iyi kombo',S.tot.maxCombo],['⚒️ En iyi +',S.tot.maxUp],['🎁 Sandık',S.tot.chests],['💰 Kazanılan',S.tot.gold]].map(r=>'<div><span>'+r[0]+'</span><b>'+fmt(r[1])+'</b></div>').join('')+'</div></div>'+
    '<div class="row"><button class="btn grow" data-a="backup">💾 Kayıt yedeği</button><button class="btn warn grow" data-a="reset">🗑️ Sıfırla</button></div><button class="btn w100" style="margin-top:8px" data-a="close">Kapat</button>'),
  backup:()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    openSheet('<h2>💾 Kayıt yedeği</h2><p class="mut">Bu kodu kopyalayıp bir yere (ör. kendine mesaj) saklarsan, telefon değiştirince ya da oyunu silince ilerlemeni geri yükleyebilirsin.</p><textarea id="bkOut" readonly>'+code+'</textarea><button class="btn ok w100" style="margin:8px 0 16px" data-a="copy">📋 Kodu kopyala</button>'+
     '<p class="mut">Geri yüklemek için kodu buraya yapıştır:</p><textarea id="bkIn" placeholder="Kayıt kodunu yapıştır"></textarea><button class="btn warn w100" style="margin-top:8px" data-a="restore">Kodu yükle (şimdiki kaydın üzerine yazar)</button><button class="btn w100" style="margin-top:8px" data-a="close">Kapat</button>')},
  copy:()=>{const t=$('bkOut');t.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}if(navigator.clipboard)navigator.clipboard.writeText(t.value).catch(()=>{});toast(ok||navigator.clipboard?'📋 Kopyalandı':'Kodu elle seçip kopyala')},
  restore:()=>{try{const o=JSON.parse(decodeURIComponent(escape(atob($('bkIn').value.trim()))));if(!o||typeof o.lvl!=='number'||!Array.isArray(o.inv))throw 0;applySave(o);dead=false;closeSheet();calc();setStage();renderSkillBar();spawn();go('battle');save(true);toast('✅ Kayıt yüklendi','big');if(!S.cls)enqueue(()=>classSheet())}catch(e){toast('❌ Kod geçersiz')}},
  reset:()=>openSheet('<h2>🗑️ Her şeyi sıfırla?</h2><p class="mut">Seviyen, eşyaların, yoldaşların, elmasların ve altınların silinir. Geri alınamaz.</p><div class="row"><button class="btn grow" data-a="close">Vazgeç</button><button class="btn warn grow" data-a="resetOk">Evet, sıfırla</button></div>'),
  resetOk:()=>{const set=S.set;S=fresh();S.set=set;dead=false;Q.length=0;offPend=null;$('sheetBg').classList.remove('on');calc();dailyCheck();setStage();renderSkillBar();spawn();go('battle');save(true);introSheet()}
};
const bulkF=()=>[i=>!i.lk&&!i.up&&i.r===0,i=>!i.lk&&!i.up&&i.r<=1&&power(i)<=power(S.eq[i.slot]),i=>!i.lk&&!i.up&&i.r<=1];
document.addEventListener('click',e=>{const t=e.target.closest('[data-a]');if(!t||t.disabled)return;const f=ACT[t.dataset.a];if(f)f(t.dataset.v,t)});
document.addEventListener('contextmenu',e=>{if(e.target.tagName!=='TEXTAREA')e.preventDefault()});
window.__onBack=()=>{if($('leg').classList.contains('on')){ACT.legClose();return true}
  if($('sheetBg').classList.contains('on')){if(!sheetLock)closeSheet();return true}
  if(tab!=='battle'){go('battle');return true}return false};

/* ======================= BAŞLAT ======================= */
function introSheet(){classSheet(`<div style="text-align:center"><div style="font-size:56px">⚔️</div><h2>Efsane Avcısı'na hoş geldin!</h2></div>
 <p class="mut" style="font-size:14px;line-height:1.6">👆 Canavara ya da <b>VUR</b>'a dokunarak saldır; hızlı dokun, <b>kombo</b> hasarı artırsın.<br>✨ Yuvarlak butonlar <b>yeteneklerin</b>, 🧪 iksirin.<br>🎒 Eşyaları kuşan, ⚒️ geliştir · 🐾 yoldaş edin · 📜 her gün görev yap.<br>👑 Her 10. katta boss seni bekliyor!</p><h3 style="text-align:center">Sınıfını seç</h3>`)}
function newsSheet(){classSheet(`<div style="text-align:center"><div style="font-size:56px">🎉</div><h2>Büyük güncelleme!</h2></div>
 <div class="card" style="font-size:13.5px;line-height:1.7">🧙 <b>Sınıflar</b>: Savaşçı, Okçu, Büyücü<br>✨ <b>4 yetenek</b> + kombo sistemi<br>⚒️ <b>Demirci</b>: eşyaları +15'e kadar geliştir, erit<br>🐾 <b>Yoldaşlar</b>: yanında savaşır (Kurt hediye!)<br>📜 <b>Günlük ödül, görevler, başarımlar</b><br>💎 <b>Elmas</b> ve 🌙 sen yokken kazanç<br>💀 <b>Elit canavarlar</b> ve tamamen yeni görünüm</div>
 <p class="mut" style="text-align:center">Tüm eşyaların ve ilerlemen yerinde. Şimdi sınıfını seç:</p>`)}
function news7(){S.nv=7;save();openSheet('<div style="text-align:center"><div style="font-size:56px">🎉</div><h2>Dev güncelleme!</h2></div><div class="card" style="font-size:13.5px;line-height:1.75">'+
  '🏰 <b>Macera sekmesi</b>: Boss Arenası, 3 Zindan, Düello Ligi<br>🛡️ <b>Boss özel saldırıları</b>: uyarı gelince SAVUN\'a bas, karşı saldır!<br>😡 Canı yarıya inen boss <b>öfkelenir</b><br>💀 Elit canavarlara <b>özellik</b>: Zırhlı, Hızlı, Vampir, Dev…<br>🔮 <b>Rün sistemi</b>: eşyalara rün tak, birleştir<br>🧙‍♂️ <b>Hikâye</b> ve boss replikleri<br>🧍 Çanta\'da dönen <b>3B karakter vitrini</b><br>🐛 30. kat boss\'u artık seni sonraki bölgeye geçiriyor</div><button class="btn pri w100" data-a="close">Hadi başlayalım!</button>')}
load();calc();
if(S.set.d3&&window.S3D){try{if(S3D.init(stage)){D3=S3D;stage.classList.add('td')}}catch(e){D3=null}}
if(!S.maxF[S.zone])S.zone=0;
setStage();renderSkillBar();spawn();updAll();
if(!S.cls)enqueue(S.seen?newsSheet:introSheet);
giftCheck();aaCheck();if(S.cls&&S.nv<7)enqueue(news7);
offline(Date.now()-(S.lastSeen||Date.now()));
dailyCheck();if(S.cls&&!S.daily.claimed&&!Q.includes(loginSheet))enqueue(loginSheet);
save(true);
</script>
