plugins { id 'com.android.application' }
android {
    namespace 'com.bilal.efsaneavcisi'
    compileSdk 35
    defaultConfig {
        applicationId 'com.bilal.efsaneavcisi'
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '3.0'
    }
    // Aynı imza = güncellemeler eskisinin üzerine kurulur, oyun kaydı silinmez. Bu anahtarı değiştirme.
    signingConfigs {
        debug {
            storeFile file('keystore/oyun.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.debug } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'androidx.webkit:webkit:1.12.1' }
